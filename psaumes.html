<footer>Radio Sources de Vie • Ottawa, Canada • Diffusion mondiale<br>« Ta parole est une lampe à mes pieds. » (Psaume 119:105)</footer>
<script>
const P={"1": "Psaume 1.\n\nHeureux l'homme qui ne marche pas selon le conseil des méchants, qui ne s'arrête pas sur la voie des pécheurs, et qui ne s'assied pas en compagnie des moqueurs,\n\nmais qui trouve son plaisir dans la loi de l'Éternel, et qui la médite jour et nuit !\n\nIl est comme un arbre planté près d'un courant d'eau, qui donne son fruit en sa saison, et dont le feuillage ne se flétrit point : tout ce qu'il fait lui réussit.\n\nIl n'en est pas ainsi des méchants : ils sont comme la paille que le vent dissipe.\n\nC'est pourquoi les méchants ne résistent pas au jour du jugement, ni les pécheurs dans l'assemblée des justes ;\n\ncar l'Éternel connaît la voie des justes, et la voie des pécheurs mène à la ruine.\n", "2": "Psaume 2.\n\nPourquoi ce tumulte parmi les nations, ces vaines pensées parmi les peuples ?\n\nPourquoi les rois de la terre se soulèvent-ils et les princes se liguent-ils avec eux contre l'Éternel et contre son oint ?\n\nBrisons leurs liens, délivrons-nous de leurs chaînes !\n\nCelui qui siège dans les cieux rit, le Seigneur se moque d'eux.\n\nPuis il leur parle dans sa colère, il les épouvante dans sa fureur :\n\nc'est moi qui ai oint mon roi sur Sion, ma montagne sainte !\n\nJe publierai le décret ; l'Éternel m'a dit : Tu es mon fils ! Je t'ai engendré aujourd'hui.\n\nDemande-moi et je te donnerai les nations pour héritage, les extrémités de la terre pour possession ;\n\ntu les briseras avec une verge de fer, tu les briseras comme le vase d'un potier.\n\nEt maintenant, rois, conduisez-vous avec sagesse ! Juges de la terre, recevez instruction !\n\nServez l'Éternel avec crainte, et réjouissez-vous avec tremblement.\n\nBaisez le fils, de peur qu'il ne s'irrite, et que vous ne périssiez dans votre voie, car sa colère est prompte à s'enflammer. Heureux tous ceux qui se confient en lui !\n", "3": "Psaume 3.\n\nPsaume de David. À l'occasion de sa fuite devant Absalom, son fils. Ô Éternel, que mes ennemis sont nombreux ! Quelle multitude se lève contre moi !\n\nCombien qui disent à mon sujet : plus de salut pour lui auprès de Dieu !\n\nMais toi, ô Éternel ! tu es mon bouclier, tu es ma gloire, et tu relèves ma tête.\n\nDe ma voix je crie à l'Éternel, et il me répond de sa montagne sainte.\n\nJe me couche, et je m'endors ; je me réveille, car l'Éternel est mon soutien.\n\nJe ne crains pas les myriades de peuples qui m'assiègent de toutes parts.\n\nLève-toi, Éternel ! sauve-moi, mon Dieu ! Car tu frappes à la joue tous mes ennemis, tu brises les dents des méchants.\n\nLe salut est auprès de l'Éternel : que ta bénédiction soit sur ton peuple !\n", "4": "Psaume 4.\n\nAu chef des chantres. Avec instruments à cordes. Psaume de David. Quand je crie, réponds-moi, Dieu de ma justice ! Quand je suis dans la détresse, sauve-moi ! Aie pitié de moi, écoute ma prière !\n\nFils des hommes, jusques à quand ma gloire sera-t-elle outragée ? Jusques à quand aimerez-vous la vanité, chercherez-vous le mensonge ?\n\nSachez que l'Éternel s'est choisi un homme pieux ; l'Éternel entend, quand je crie à lui.\n\nTremblez, et ne péchez point ; parlez en vos cœurs sur votre couche, puis taisez-vous.\n\nOffrez des sacrifices de justice, et confiez-vous à l'Éternel.\n\nPlusieurs disent : Qui nous fera voir le bonheur ? Fais lever sur nous la lumière de ta face, ô Éternel !\n\nTu mets dans mon cœur plus de joie qu'ils n'en ont quand abondent leur froment et leur moût.\n\nJe me couche et je m'endors en paix, car toi seul, ô Éternel ! tu me donnes la sécurité dans ma demeure.\n", "5": "Psaume 5.\n\nAu chef des chantres. Avec les flûtes. Psaume de David. Prête l'oreille à mes paroles, ô Éternel ! Écoute mes gémissements !\n\nSois attentif à mes cris, mon roi et mon Dieu ! C'est à toi que j'adresse ma prière.\n\nÉternel ! le matin tu entends ma voix ; le matin je me tourne vers toi, et je regarde.\n\nCar tu n'es point un Dieu qui prenne plaisir au mal ; le méchant n'a pas sa demeure auprès de toi.\n\nLes insensés ne subsistent pas devant tes yeux ; tu hais tous ceux qui commettent l'iniquité.\n\nTu fais périr les menteurs ; l'Éternel abhorre les hommes de sang et de fraude.\n\nMais moi, par ta grande miséricorde, je vais à ta maison, je me prosterne dans ton saint temple avec crainte.\n\nÉternel ! conduis-moi dans ta justice, à cause de mes ennemis, aplanis ta voie sous mes pas.\n\nCar il n'y a point de sincérité dans leur bouche ; leur cœur est rempli de malice, leur gosier est un sépulcre ouvert, et ils ont sur la langue des paroles flatteuses.\n\nFrappe-les comme des coupables, ô Dieu ! Que leurs desseins amènent leur chute ! Précipite-les au milieu de leurs péchés sans nombre ! Car ils se révoltent contre toi.\n\nAlors tous ceux qui se confient en toi se réjouiront, ils auront de l'allégresse à toujours, et tu les protégeras ; tu seras un sujet de joie pour ceux qui aiment ton nom.\n\nCar tu bénis le juste, ô Éternel ! Tu l'entoures de ta grâce comme d'un bouclier.\n", "6": "Psaume 6.\n\nAu chef des chantres. Avec instruments à cordes. Sur la harpe à huit cordes. Psaume de David. Éternel ! ne me punis pas dans ta colère, et ne me châtie pas dans ta fureur.\n\nAie pitié de moi, Éternel ! car je suis sans force ; guéris-moi, Éternel ! car mes os sont tremblants.\n\nMon âme est toute troublée ; et toi, Éternel ! jusques à quand ?...\n\nReviens, Éternel ! délivre mon âme ; sauve-moi, à cause de ta miséricorde.\n\nCar celui qui meurt n'a plus ton souvenir ; qui te louera dans le séjour des morts ?\n\nJe m'épuise à force de gémir ; chaque nuit ma couche est baignée de mes larmes, mon lit est arrosé de mes pleurs.\n\nJ'ai le visage usé par le chagrin ; tous ceux qui me persécutent le font vieillir.\n\nÉloignez-vous de moi, vous tous qui faites le mal ! Car l'Éternel entend la voix de mes larmes ;\n\nl'Éternel exauce mes supplications, l'Éternel accueille ma prière.\n\nTous mes ennemis sont confondus, saisis d'épouvante ; ils reculent, soudain couverts de honte.\n", "7": "Psaume 7.\n\nComplainte de David. Chantée à l'Éternel, au sujet de Cusch, Benjamite. Éternel, mon Dieu ! je cherche en toi mon refuge ; sauve-moi de tous mes persécuteurs, et délivre-moi,\n\nafin qu'ils ne me déchirent pas, comme un lion qui dévore sans que personne vienne au secours.\n\nÉternel, mon Dieu ! si j'ai fait cela, s'il y a de l'iniquité dans mes mains,\n\nsi j'ai rendu le mal à celui qui était paisible envers moi, si j'ai dépouillé celui qui m'opprimait sans cause,\n\nque l'ennemi me poursuive et m'atteigne, qu'il foule à terre ma vie, et qu'il couche ma gloire dans la poussière !\n\nLève-toi, ô Éternel ! dans ta colère, lève-toi contre la fureur de mes adversaires, réveille-toi pour me secourir, ordonne un jugement !\n\nQue l'assemblée des peuples t'environne ! Monte au-dessus d'elle vers les lieux élevés !\n\nL'Éternel juge les peuples : rends-moi justice, ô Éternel ! Selon mon droit et selon mon innocence !\n\nMets un terme à la malice des méchants, et affermis le juste, toi qui sondes les cœurs et les reins, Dieu juste !\n\nMon bouclier est en Dieu, qui sauve ceux dont le cœur est droit.\n\nDieu est un juste juge, Dieu s'irrite en tout temps.\n\nSi le méchant ne se convertit pas, il aiguise son glaive, il bande son arc, et il vise ;\n\nil dirige sur lui des traits meurtriers, il rend ses flèches brûlantes.\n\nVoici, le méchant prépare le mal, il conçoit l'iniquité, et il enfante le néant.\n\nIl ouvre une fosse, il la creuse, et il tombe dans la fosse qu'il a faite.\n\nSon iniquité retombe sur sa tête, et sa violence redescend sur son front.\n\nJe louerai l'Éternel à cause de sa justice, je chanterai le nom de l'Éternel, du Très-Haut.\n", "8": "Psaume 8.\n\nAu chef des chantres. Sur la guitthith. Psaume de David. Éternel, notre Seigneur ! Que ton nom est magnifique sur toute la terre ! Ta majesté s'élève au-dessus des cieux.\n\nPar la bouche des enfants et de ceux qui sont à la mamelle tu as fondé ta gloire, pour confondre tes adversaires, pour imposer silence à l'ennemi et au vindicatif.\n\nQuand je contemple les cieux, ouvrage de tes mains, la lune et les étoiles que tu as créées :\n\nqu'est-ce que l'homme, pour que tu te souviennes de lui ? Et le fils de l'homme, pour que tu prennes garde à lui ?\n\nTu l'as fait de peu inférieur à Dieu, et tu l'as couronné de gloire et de magnificence.\n\nTu lui as donné la domination sur les œuvres de tes mains, tu as tout mis sous ses pieds,\n\nles brebis comme les bœufs, et les animaux des champs,\n\nles oiseaux du ciel et les poissons de la mer, tout ce qui parcourt les sentiers des mers.\n\nÉternel, notre Seigneur ! Que ton nom est magnifique sur toute la terre !\n", "9": "Psaume 9.\n\nAu chef des chantres. Sur meurs pour le fils. Psaume de David. Je louerai l'Éternel de tout mon cœur, je raconterai toutes tes merveilles.\n\nJe ferai de toi le sujet de ma joie et de mon allégresse, je chanterai ton nom, Dieu Très-Haut !\n\nMes ennemis reculent, ils chancellent, ils périssent devant ta face.\n\nCar tu soutiens mon droit et ma cause, tu sièges sur ton trône en juste juge.\n\nTu châties les nations, tu détruis le méchant, tu effaces leur nom pour toujours et à perpétuité.\n\nPlus d'ennemis ! Des ruines éternelles ! Des villes que tu as renversées ! Leur souvenir est anéanti.\n\nL'Éternel règne à jamais, il a dressé son trône pour le jugement ;\n\nil juge le monde avec justice, il juge les peuples avec droiture.\n\nL'Éternel est un refuge pour l'opprimé, un refuge au temps de la détresse.\n\nCeux qui connaissent ton nom se confient en toi. Car tu n'abandonnes pas ceux qui te cherchent, ô Éternel !\n\nChantez à l'Éternel, qui réside en Sion, publiez parmi les peuples ses hauts faits !\n\nCar il venge le sang et se souvient des malheureux, il n'oublie pas leurs cris.\n\nAie pitié de moi, Éternel ! Vois la misère où me réduisent mes ennemis, enlève-moi des portes de la mort,\n\nafin que je publie toutes tes louanges, dans les portes de la fille de Sion, et que je me réjouisse de ton salut.\n\nLes nations tombent dans la fosse qu'elles ont faite, leur pied se prend au filet qu'elles ont caché.\n\nL'Éternel se montre, il fait justice, il enlace le méchant dans l'œuvre de ses mains. Jeu d'instruments.\n\nLes méchants se tournent vers le séjour des morts, toutes les nations qui oublient Dieu.\n\nCar le malheureux n'est point oublié à jamais, l'espérance des misérables ne périt pas à toujours.\n\nLève-toi, ô Éternel ! Que l'homme ne triomphe pas ! Que les nations soient jugées devant ta face !\n\nFrappe-les d'épouvante, ô Éternel ! Que les peuples sachent qu'ils sont des hommes !\n", "10": "Psaume 10.\n\nPourquoi, ô Éternel ! te tiens-tu éloigné ? Pourquoi te caches-tu au temps de la détresse ?\n\nLe méchant dans son orgueil poursuit les malheureux, ils sont victimes des trames qu'il a conçues.\n\nCar le méchant se glorifie de sa convoitise, et le ravisseur outrage, méprise l'Éternel.\n\nLe méchant dit avec arrogance : il ne punit pas ! Il n'y a point de Dieu ! Voilà toutes ses pensées.\n\nSes voies réussissent en tout temps ; tes jugements sont trop élevés pour l'atteindre, il souffle contre tous ses adversaires.\n\nIl dit en son cœur : je ne chancelle pas, je suis pour toujours à l'abri du malheur !\n\nSa bouche est pleine de malédictions, de tromperies et de fraudes ; il y a sous sa langue de la malice et de l'iniquité.\n\nIl se tient en embuscade près des villages, il assassine l'innocent dans des lieux écartés ; ses yeux épient le malheureux.\n\nIl est aux aguets dans sa retraite, comme le lion dans sa tanière, il est aux aguets pour surprendre le malheureux ; il le surprend et l'attire dans son filet.\n\nIl se courbe, il se baisse, et les misérables tombent dans ses griffes.\n\nIl dit en son cœur : Dieu oublie ! Il cache sa face, il ne regarde jamais !\n\nLève-toi, Éternel ! ô Dieu, lève ta main ! N'oublie pas les malheureux !\n\nPourquoi le méchant méprise-t-il Dieu ? Pourquoi dit-il en son cœur : tu ne punis pas ?\n\nTu regardes cependant, car tu vois la peine et la souffrance, pour prendre en main leur cause ; c'est à toi que s'abandonne le malheureux, c'est toi qui viens en aide à l'orphelin.\n\nBrise le bras du méchant, punis ses iniquités, et qu'il disparaisse à tes yeux !\n\nL'Éternel est roi à toujours et à perpétuité ; les nations sont exterminées de son pays.\n\nTu entends les vœux de ceux qui souffrent, ô Éternel ! Tu affermis leur cœur ; tu prêtes l'oreille\n\npour rendre justice à l'orphelin et à l'opprimé, afin que l'homme tiré de la terre cesse d'inspirer l'effroi.\n", "11": "Psaume 11.\n\nAu chef des chantres. De David. C'est en l'Éternel que je cherche un refuge. Comment pouvez-vous me dire : Fuis dans vos montagnes, comme un oiseau ?\n\nCar voici, les méchants bandent l'arc, ils ajustent leur flèche sur la corde, pour tirer dans l'ombre sur ceux dont le cœur est droit.\n\nQuand les fondements sont renversés, le juste, que ferait-il ?\n\nL'Éternel est dans son saint temple, l'Éternel a son trône dans les cieux ; ses yeux regardent, ses paupières sondent les fils de l'homme.\n\nL'Éternel sonde le juste ; il hait le méchant et celui qui se plaît à la violence.\n\nIl fait pleuvoir sur les méchants des charbons, du feu et du soufre ; un vent brûlant, c'est le calice qu'ils ont en partage.\n\nCar l'Éternel est juste, il aime la justice ; les hommes droits contemplent sa face.\n", "12": "Psaume 12.\n\nAu chef des chantres. Sur la harpe à huit cordes. Psaume de David. Sauve, Éternel ! car les hommes pieux s'en vont, les fidèles disparaissent parmi les fils de l'homme.\n\nOn se dit des faussetés les uns aux autres, on a sur les lèvres des choses flatteuses, on parle avec un cœur double.\n\nQue l'Éternel extermine toutes les lèvres flatteuses, la langue qui discourt avec arrogance,\n\nceux qui disent : Nous sommes puissants par notre langue, nous avons nos lèvres avec nous ; qui serait notre maître ?\n\nParce que les malheureux sont opprimés et que les pauvres gémissent, maintenant, dit l'Éternel, je me lève, j'apporte le salut à ceux contre qui l'on souffle.\n\nLes paroles de l'Éternel sont des paroles pures, un argent éprouvé sur terre au creuset, et sept fois épuré.\n\nToi, Éternel ! tu les garderas, tu les préserveras de cette race à jamais.\n\nLes méchants se promènent de toutes parts, quand la bassesse règne parmi les fils de l'homme.\n", "13": "Psaume 13.\n\nAu chef des chantres. Psaume de David. Jusques à quand, Éternel ! m'oublieras-tu sans cesse ? Jusques à quand me cacheras-tu ta face ?\n\nJusques à quand aurai-je des soucis dans mon âme, et chaque jour des chagrins dans mon cœur ? Jusques à quand mon ennemi s'élèvera-t-il contre moi ?\n\nRegarde, réponds-moi, Éternel, mon Dieu ! Donne à mes yeux la clarté, afin que je ne m'endorme pas du sommeil de la mort,\n\nafin que mon ennemi ne dise pas : je l'ai vaincu ! Et que mes adversaires ne se réjouissent pas, si je chancelle.\n\nMoi, j'ai confiance en ta bonté, j'ai de l'allégresse dans le cœur, à cause de ton salut ;\n\nje chante à l'Éternel, car il m'a fait du bien.\n", "14": "Psaume 14.\n\nAu chef des chantres. De David. L'insensé dit en son cœur : il n'y a point de Dieu ! Ils se sont corrompus, ils ont commis des actions abominables ; il n'en est aucun qui fasse le bien.\n\nL'Éternel, du haut des cieux, regarde les fils de l'homme, pour voir s'il y a quelqu'un qui soit intelligent, qui cherche Dieu.\n\nTous sont égarés, tous sont pervertis ; il n'en est aucun qui fasse le bien, pas même un seul.\n\nTous ceux qui commettent l'iniquité ont-ils perdu le sens ? Ils dévorent mon peuple, ils le prennent pour nourriture ; ils n'invoquent point l'Éternel.\n\nC'est alors qu'ils trembleront d'épouvante, quand Dieu paraîtra au milieu de la race juste.\n\nJetez l'opprobre sur l'espérance du malheureux... L'Éternel est son refuge.\n\nOh ! qui fera partir de Sion la délivrance d'Israël ? Quand l'Éternel ramènera les captifs de son peuple, Jacob sera dans l'allégresse, Israël se réjouira.\n", "15": "Psaume 15.\n\nPsaume de David. Ô Éternel ! qui séjournera dans ta tente ? Qui demeurera sur ta montagne sainte ?\n\nCelui qui marche dans l'intégrité, qui pratique la justice et qui dit la vérité selon son cœur.\n\nIl ne calomnie point avec sa langue, il ne fait point de mal à son semblable, et il ne jette point l'opprobre sur son prochain.\n\nIl regarde avec dédain celui qui est méprisable, mais il honore ceux qui craignent l'Éternel ; il ne se rétracte point, s'il fait un serment à son préjudice.\n\nIl n'exige point d'intérêt de son argent, et il n'accepte point de don contre l'innocent. Celui qui se conduit ainsi ne chancelle jamais.\n", "16": "Psaume 16.\n\nHymne de David. Garde-moi, ô Dieu ! car je cherche en toi mon refuge.\n\nJe dis à l'Éternel : tu es mon Seigneur, tu es mon souverain bien !\n\nLes saints qui sont dans le pays, les hommes pieux sont l'objet de toute mon affection.\n\nOn multiplie les idoles, on court après les dieux étrangers : je ne répands pas leurs libations de sang, je ne mets pas leurs noms sur mes lèvres.\n\nL'Éternel est mon partage et mon calice ; c'est toi qui m'assures mon lot ;\n\nun héritage délicieux m'est échu, une belle possession m'est accordée.\n\nJe bénis l'Éternel, mon conseiller ; la nuit même mon cœur m'exhorte.\n\nJ'ai constamment l'Éternel sous mes yeux ; quand il est à ma droite, je ne chancelle pas.\n\nAussi mon cœur est dans la joie, mon esprit dans l'allégresse, et mon corps repose en sécurité.\n\nCar tu ne livreras pas mon âme au séjour des morts, tu ne permettras pas que ton bien-aimé voie la corruption.\n\nTu me feras connaître le sentier de la vie ; il y a d'abondantes joies devant ta face, des délices éternelles à ta droite.\n", "17": "Psaume 17.\n\nPrière de David. Éternel ! écoute la droiture, sois attentif à mes cris, prête l'oreille à ma prière faite avec des lèvres sans tromperie !\n\nQue ma justice paraisse devant ta face, que tes yeux contemplent mon intégrité !\n\nSi tu sondes mon cœur, si tu le visites la nuit, si tu m'éprouves, tu ne trouveras rien : ma pensée n'est pas autre que ce qui sort de ma bouche.\n\nÀ la vue des actions des hommes, fidèle à la parole de tes lèvres, je me tiens en garde contre la voie des violents ;\n\nmes pas sont fermes dans tes sentiers, mes pieds ne chancellent point.\n\nJe t'invoque, car tu m'exauces, ô Dieu ! Incline vers moi ton oreille, écoute ma parole !\n\nSignale ta bonté, toi qui sauves ceux qui cherchent un refuge, et qui par ta droite les délivres de leurs adversaires !\n\nGarde-moi comme la prunelle de l'œil ; protège-moi, à l'ombre de tes ailes,\n\ncontre les méchants qui me persécutent, contre mes ennemis acharnés qui m'enveloppent.\n\nIls ferment leurs entrailles, ils ont à la bouche des paroles hautaines.\n\nIls sont sur nos pas, déjà ils nous entourent, ils nous épient pour nous terrasser.\n\nOn dirait un lion avide de déchirer, un lionceau aux aguets dans son repaire.\n\nLève-toi, Éternel, marche à sa rencontre, renverse-le ! Délivre-moi du méchant par ton glaive !\n\nDélivre-moi des hommes par ta main, Éternel, des hommes de ce monde ! Leur part est dans la vie, et tu remplis leur ventre de tes biens ; leurs enfants sont rassasiés, et ils laissent leur superflu à leurs petits-enfants.\n\nPour moi, dans mon innocence, je verrai ta face ; dès le réveil, je me rassasierai de ton image.\n", "18": "Psaume 18.\n\nAu chef des chantres. Du serviteur de l'Éternel, de David, qui adressa à l'Éternel les paroles de ce cantique, lorsque l'Éternel l'eut délivré de la main de tous ses ennemis et de la main de Saül. Il dit : Je t'aime, ô Éternel, ma force !\n\nÉternel, mon rocher, ma forteresse, mon libérateur ! Mon Dieu, mon rocher, où je trouve un abri ! Mon bouclier, la force qui me sauve, ma haute retraite !\n\nJe m'écrie : Loué soit l'Éternel ! Et je suis délivré de mes ennemis.\n\nLes liens de la mort m'avaient environné, et les torrents de la destruction m'avaient épouvanté ;\n\nles liens du sépulcre m'avaient entouré, les filets de la mort m'avaient surpris.\n\nDans ma détresse, j'ai invoqué l'Éternel, j'ai crié à mon Dieu ; de son palais, il a entendu ma voix, et mon cri est parvenu devant lui à ses oreilles.\n\nLa terre fut ébranlée et trembla, les fondements des montagnes frémirent, et ils furent ébranlés, parce qu'il était irrité.\n\nIl s'élevait de la fumée dans ses narines, et un feu dévorant sortait de sa bouche : il en jaillissait des charbons embrasés.\n\nIl abaissa les cieux, et il descendit : il y avait une épaisse nuée sous ses pieds.\n\nIl était monté sur un chérubin, et il volait, il planait sur les ailes du vent.\n\nIl faisait des ténèbres sa retraite, sa tente autour de lui, il était enveloppé des eaux obscures et de sombres nuages.\n\nDe la splendeur qui le précédait s'échappaient les nuées, lançant de la grêle et des charbons de feu.\n\nL'Éternel tonna dans les cieux, le Très-Haut fit retentir sa voix, avec la grêle et les charbons de feu.\n\nIl lança ses flèches et dispersa mes ennemis, il multiplia les coups de la foudre et les mit en déroute.\n\nLe lit des eaux apparut, les fondements du monde furent découverts, par ta menace, ô Éternel ! Par le bruit du souffle de tes narines.\n\nIl étendit sa main d'en haut, il me saisit, il me retira des grandes eaux ;\n\nil me délivra de mon adversaire puissant, de mes ennemis qui étaient plus forts que moi.\n\nIls m'avaient surpris au jour de ma détresse ; mais l'Éternel fut mon appui.\n\nIl m'a mis au large, il m'a sauvé, parce qu'il m'aime.\n\nL'Éternel m'a traité selon ma droiture, il m'a rendu selon la pureté de mes mains ;\n\ncar j'ai observé les voies de l'Éternel, et je n'ai point été coupable envers mon Dieu.\n\nToutes ses ordonnances ont été devant moi, et je ne me suis point écarté de ses lois.\n\nJ'ai été sans reproche envers lui, et je me suis tenu en garde contre mon iniquité.\n\nAussi l'Éternel m'a rendu selon ma droiture, selon la pureté de mes mains devant ses yeux.\n\nAvec celui qui est bon tu te montres bon, avec l'homme droit tu agis selon la droiture,\n\navec celui qui est pur tu te montres pur, et avec le pervers tu agis selon sa perversité.\n\nTu sauves le peuple qui s'humilie, et tu abaisses les regards hautains.\n\nOui, tu fais briller ma lumière ; l'Éternel, mon Dieu, éclaire mes ténèbres.\n\nAvec toi je me précipite sur une troupe en armes, avec mon Dieu je franchis une muraille.\n\nLes voies de Dieu sont parfaites, la parole de l'Éternel est éprouvée ; il est un bouclier pour tous ceux qui se confient en lui.\n\nCar qui est Dieu, si ce n'est l'Éternel ; et qui est un rocher, si ce n'est notre Dieu ?\n\nC'est Dieu qui me ceint de force, et qui me conduit dans la voie droite.\n\nIl rend mes pieds semblables à ceux des biches, et il me place sur mes lieux élevés.\n\nIl exerce mes mains au combat, et mes bras tendent l'arc d'airain.\n\nTu me donnes le bouclier de ton salut, ta droite me soutient, et je deviens grand par ta bonté.\n\nTu élargis le chemin sous mes pas, et mes pieds ne chancellent point.\n\nJe poursuis mes ennemis, je les atteins, et je ne reviens pas avant de les avoir anéantis.\n\nJe les brise, et ils ne peuvent se relever ; ils tombent sous mes pieds.\n\nTu me ceins de force pour le combat, tu fais plier sous moi mes adversaires.\n\nTu fais tourner le dos à mes ennemis devant moi, et j'extermine ceux qui me haïssent.\n\nIls crient, et personne pour les sauver ! Ils crient à l'Éternel, et il ne leur répond pas !\n\nJe les broie comme la poussière qu'emporte le vent, je les foule comme la boue des rues.\n\nTu me délivres des dissensions du peuple ; tu me mets à la tête des nations ; un peuple que je ne connaissais pas m'est asservi.\n\nIls m'obéissent au premier ordre, les fils de l'étranger me flattent ;\n\nles fils de l'étranger sont en défaillance, ils tremblent hors de leurs forteresses.\n\nVive l'Éternel, et béni soit mon rocher ! Que le Dieu de mon salut soit exalté,\n\nle Dieu qui est mon vengeur, qui m'assujettit les peuples,\n\nqui me délivre de mes ennemis ! Tu m'élèves au-dessus de mes adversaires, tu me sauves de l'homme violent.\n\nC'est pourquoi je te louerai parmi les nations, ô Éternel ! Et je chanterai à la gloire de ton nom.\n\nIl accorde de grandes délivrances à son roi, et il fait miséricorde à son oint, à David, et à sa postérité, pour toujours.\n", "19": "Psaume 19.\n\nAu chef des chantres. Psaume de David. Les cieux racontent la gloire de Dieu, et l'étendue manifeste l'œuvre de ses mains.\n\nLe jour en instruit un autre jour, la nuit en donne connaissance à une autre nuit.\n\nCe n'est pas un langage, ce ne sont pas des paroles dont le son ne soit point entendu :\n\nleur retentissement parcourt toute la terre, leurs accents vont aux extrémités du monde, où il a dressé une tente pour le soleil.\n\nEt le soleil, semblable à un époux qui sort de sa chambre, s'élance dans la carrière avec la joie d'un héros ;\n\nil se lève à une extrémité des cieux, et achève sa course à l'autre extrémité : rien ne se dérobe à sa chaleur.\n\nLa loi de l'Éternel est parfaite, elle restaure l'âme ; le témoignage de l'Éternel est véritable, il rend sage l'ignorant.\n\nLes ordonnances de l'Éternel sont droites, elles réjouissent le cœur ; les commandements de l'Éternel sont purs, ils éclairent les yeux.\n\nLa crainte de l'Éternel est pure, elle subsiste à toujours ; les jugements de l'Éternel sont vrais, ils sont tous justes.\n\nIls sont plus précieux que l'or, que beaucoup d'or fin ; ils sont plus doux que le miel, que celui qui coule des rayons.\n\nTon serviteur aussi en reçoit instruction ; pour qui les observe la récompense est grande.\n\nQui connaît ses égarements ? Pardonne-moi ceux que j'ignore.\n\nPréserve aussi ton serviteur des orgueilleux ; qu'ils ne dominent point sur moi ! Alors je serai intègre, innocent de grands péchés.\n\nReçois favorablement les paroles de ma bouche et les sentiments de mon cœur, Ô Éternel, mon rocher et mon libérateur !\n", "20": "Psaume 20.\n\nAu chef des chantres. Psaume de David. Que l'Éternel t'exauce au jour de la détresse, que le nom du Dieu de Jacob te protège !\n\nQue du sanctuaire il t'envoie du secours, que de Sion il te soutienne !\n\nQu'il se souvienne de toutes tes offrandes, et qu'il agrée tes holocaustes !\n\nQu'il te donne ce que ton cœur désire, et qu'il accomplisse tous tes desseins !\n\nNous nous réjouirons de ton salut, nous lèverons l'étendard au nom de notre Dieu ; l'Éternel exaucera tous tes vœux.\n\nJe sais déjà que l'Éternel sauve son oint ; il l'exaucera des cieux, de sa sainte demeure, par le secours puissant de sa droite.\n\nCeux-ci s'appuient sur leurs chars, ceux-là sur leurs chevaux ; nous, nous invoquons le nom de l'Éternel, notre Dieu.\n\nEux, ils plient, et ils tombent ; nous, nous tenons ferme, et restons debout.\n\nÉternel, sauve le roi ! Qu'il nous exauce, quand nous l'invoquons !\n", "21": "Psaume 21.\n\nAu chef des chantres. Psaume de David. Éternel ! le roi se réjouit de ta protection puissante. Oh ! comme ton secours le remplit d'allégresse !\n\nTu lui as donné ce que désirait son cœur, et tu n'as pas refusé ce que demandaient ses lèvres.\n\nCar tu l'as prévenu par les bénédictions de ta grâce, tu as mis sur sa tête une couronne d'or pur.\n\nIl te demandait la vie, tu la lui as donnée, une vie longue pour toujours et à perpétuité.\n\nSa gloire est grande à cause de ton secours ; tu places sur lui l'éclat et la magnificence.\n\nTu le rends à jamais un objet de bénédictions, tu le combles de joie devant ta face.\n\nLe roi se confie en l'Éternel ; et, par la bonté du Très-Haut, il ne chancelle pas.\n\nTa main trouvera tous tes ennemis, ta droite trouvera ceux qui te haïssent.\n\nTu les rendras tels qu'une fournaise ardente, le jour où tu te montreras ; l'Éternel les anéantira dans sa colère, et le feu les dévorera.\n\nTu feras disparaître leur postérité de la terre, et leur race du milieu des fils de l'homme.\n\nIls ont projeté du mal contre toi, ils ont conçu de mauvais desseins, mais ils seront impuissants.\n\nCar tu leur feras tourner le dos, et avec ton arc tu tireras sur eux.\n\nLève-toi, Éternel, avec ta force ! Nous voulons chanter, célébrer ta puissance.\n", "22": "Psaume 22.\n\nAu chef des chantres. Sur biche de l'aurore. Psaume de David. Mon Dieu ! mon Dieu ! pourquoi m'as-tu abandonné, et t'éloignes-tu sans me secourir, sans écouter mes plaintes ?\n\nMon Dieu ! je crie le jour, et tu ne réponds pas ; la nuit, et je n'ai point de repos.\n\nPourtant tu es le Saint, tu sièges au milieu des louanges d'Israël.\n\nEn toi se confiaient nos pères ; ils se confiaient, et tu les délivrais.\n\nIls criaient à toi, et ils étaient sauvés ; ils se confiaient en toi, et ils n'étaient point confus.\n\nEt moi, je suis un ver et non un homme, l'opprobre des hommes et le méprisé du peuple.\n\nTous ceux qui me voient se moquent de moi, ils ouvrent la bouche, secouent la tête :\n\nrecommande-toi à l'Éternel ! L'Éternel le sauvera, il le délivrera, puisqu'il l'aime !\n\nOui, tu m'as fait sortir du sein maternel, tu m'as mis en sûreté sur les mamelles de ma mère ;\n\ndès le sein maternel j'ai été sous ta garde, dès le ventre de ma mère tu as été mon Dieu.\n\nNe t'éloigne pas de moi quand la détresse est proche, quand personne ne vient à mon secours !\n\nDe nombreux taureaux sont autour de moi, des taureaux de Basan m'environnent.\n\nIls ouvrent contre moi leur gueule, semblables au lion qui déchire et rugit.\n\nJe suis comme de l'eau qui s'écoule, et tous mes os se séparent ; mon cœur est comme de la cire, il se fond dans mes entrailles.\n\nMa force se dessèche comme l'argile, et ma langue s'attache à mon palais ; tu me réduis à la poussière de la mort.\n\nCar des chiens m'environnent, une bande de scélérats rôdent autour de moi, ils ont percé mes mains et mes pieds.\n\nJe pourrais compter tous mes os. Eux, ils observent, ils me regardent ;\n\nils se partagent mes vêtements, ils tirent au sort ma tunique.\n\nEt toi, Éternel, ne t'éloigne pas ! Toi qui es ma force, viens en hâte à mon secours !\n\nProtège mon âme contre le glaive, ma vie contre le pouvoir des chiens !\n\nSauve-moi de la gueule du lion, délivre-moi des cornes du buffle !\n\nJe publierai ton nom parmi mes frères, je te célébrerai au milieu de l'assemblée.\n\nVous qui craignez l'Éternel, louez-le ! Vous tous, postérité de Jacob, glorifiez-le ! Tremblez devant lui, vous tous, postérité d'Israël !\n\nCar il n'a ni mépris ni dédain pour les peines du misérable, et il ne lui cache point sa face ; mais il l'écoute quand il crie à lui.\n\nTu seras dans la grande assemblée l'objet de mes louanges ; j'accomplirai mes vœux en présence de ceux qui te craignent.\n\nLes malheureux mangeront et se rassasieront, ceux qui cherchent l'Éternel le célébreront. Que votre cœur vive à toujours !\n\nToutes les extrémités de la terre penseront à l'Éternel et se tourneront vers lui ; toutes les familles des nations se prosterneront devant ta face.\n\nCar à l'Éternel appartient le règne : il domine sur les nations.\n\nTous les puissants de la terre mangeront et se prosterneront aussi ; devant lui s'inclineront tous ceux qui descendent dans la poussière, ceux qui ne peuvent conserver leur vie.\n\nLa postérité le servira ; on parlera du Seigneur à la génération future.\n\nQuand elle viendra, elle annoncera sa justice, elle annoncera son œuvre au peuple nouveau-né.\n", "23": "Psaume 23.\n\nCantique de David. L'Éternel est mon berger : je ne manquerai de rien.\n\nIl me fait reposer dans de verts pâturages, il me dirige près des eaux paisibles.\n\nIl restaure mon âme, il me conduit dans les sentiers de la justice, à cause de son nom.\n\nQuand je marche dans la vallée de l'ombre de la mort, je ne crains aucun mal, car tu es avec moi : ta houlette et ton bâton me rassurent.\n\nTu dresses devant moi une table, en face de mes adversaires ; tu oins d'huile ma tête, et ma coupe déborde.\n\nOui, le bonheur et la grâce m'accompagneront tous les jours de ma vie, et j'habiterai dans la maison de l'Éternel jusqu'à la fin de mes jours.\n", "24": "Psaume 24.\n\nPsaume de David. À l'Éternel la terre et ce qu'elle renferme, le monde et ceux qui l'habitent !\n\nCar il l'a fondée sur les mers, et affermie sur les fleuves.\n\nQui pourra monter à la montagne de l'Éternel ? Qui s'élèvera jusqu'à son lieu saint ?\n\nCelui qui a les mains innocentes et le cœur pur ; celui qui ne livre pas son âme au mensonge, et qui ne jure pas pour tromper.\n\nIl obtiendra la bénédiction de l'Éternel, la miséricorde du Dieu de son salut.\n\nVoilà le partage de la génération qui l'invoque, de ceux qui cherchent ta face, de Jacob !\n\nPortes, élevez vos linteaux ; élevez-vous, portes éternelles ! Que le roi de gloire fasse son entrée !\n\nQui est ce roi de gloire ? L'Éternel fort et puissant, l'Éternel puissant dans les combats.\n\nPortes, élevez vos linteaux ; élevez-les, portes éternelles ! Que le roi de gloire fasse son entrée !\n\nQui donc est ce roi de gloire ? L'Éternel des armées : voilà le roi de gloire !\n", "25": "Psaume 25.\n\nDe David. Éternel ! j'élève à toi mon âme.\n\nMon Dieu ! en toi je me confie : que je ne sois pas couvert de honte ! Que mes ennemis ne se réjouissent pas à mon sujet !\n\nTous ceux qui espèrent en toi ne seront point confondus ; ceux-là seront confondus qui sont infidèles sans cause.\n\nÉternel ! fais-moi connaître tes voies, enseigne-moi tes sentiers.\n\nConduis-moi dans ta vérité, et instruis-moi ; car tu es le Dieu de mon salut, tu es toujours mon espérance.\n\nÉternel ! souviens-toi de ta miséricorde et de ta bonté ; car elles sont éternelles.\n\nNe te souviens pas des fautes de ma jeunesse ni de mes transgressions ; souviens-toi de moi selon ta miséricorde, à cause de ta bonté, ô Éternel !\n\nL'Éternel est bon et droit : c'est pourquoi il montre aux pécheurs la voie.\n\nIl conduit les humbles dans la justice, il enseigne aux humbles sa voie.\n\nTous les sentiers de l'Éternel sont miséricorde et fidélité, pour ceux qui gardent son alliance et ses commandements.\n\nC'est à cause de ton nom, ô Éternel ! Que tu pardonneras mon iniquité, car elle est grande.\n\nQuel est l'homme qui craint l'Éternel ? L'Éternel lui montre la voie qu'il doit choisir.\n\nSon âme reposera dans le bonheur, et sa postérité possédera le pays.\n\nL'amitié de l'Éternel est pour ceux qui le craignent, et son alliance leur donne instruction.\n\nJe tourne constamment les yeux vers l'Éternel, car il fera sortir mes pieds du filet.\n\nRegarde-moi et aie pitié de moi, car je suis abandonné et malheureux.\n\nLes angoisses de mon cœur augmentent ; tire-moi de ma détresse.\n\nVois ma misère et ma peine, et pardonne tous mes péchés.\n\nVois combien mes ennemis sont nombreux, et de quelle haine violente ils me poursuivent.\n\nGarde mon âme et sauve-moi ! Que je ne sois pas confus, quand je cherche auprès de toi mon refuge !\n\nQue l'innocence et la droiture me protègent, quand je mets en toi mon espérance !\n\nÔ Dieu ! délivre Israël de toutes ses détresses !\n", "26": "Psaume 26.\n\nDe David. Rends-moi justice, Éternel ! car je marche dans l'intégrité, je me confie en l'Éternel, je ne chancelle pas.\n\nSonde-moi, Éternel ! éprouve-moi, fais passer au creuset mes reins et mon cœur ;\n\ncar ta grâce est devant mes yeux, et je marche dans ta vérité.\n\nJe ne m'assieds pas avec les hommes faux, je ne vais pas avec les gens dissimulés ;\n\nje hais l'assemblée de ceux qui font le mal, je ne m'assieds pas avec les méchants.\n\nJe lave mes mains dans l'innocence, et je vais autour de ton autel, ô Éternel !\n\nPour éclater en actions de grâces, et raconter toutes tes merveilles.\n\nÉternel ! j'aime le séjour de ta maison, le lieu où ta gloire habite.\n\nN'enlève pas mon âme avec les pécheurs, ma vie avec les hommes de sang,\n\ndont les mains sont criminelles et la droite pleine de présents !\n\nMoi, je marche dans l'intégrité ; délivre-moi et aie pitié de moi !\n\nMon pied est ferme dans la droiture : je bénirai l'Éternel dans les assemblées.\n", "27": "Psaume 27.\n\nDe David. L'Éternel est ma lumière et mon salut : de qui aurais-je crainte ? L'Éternel est le soutien de ma vie : de qui aurais-je peur ?\n\nQuand des méchants s'avancent contre moi, pour dévorer ma chair, ce sont mes persécuteurs et mes ennemis qui chancellent et tombent.\n\nSi une armée se campait contre moi, mon cœur n'aurait aucune crainte ; si une guerre s'élevait contre moi, je serais malgré cela plein de confiance.\n\nJe demande à l'Éternel une chose, que je désire ardemment : je voudrais habiter toute ma vie dans la maison de l'Éternel, pour contempler la magnificence de l'Éternel et pour admirer son temple.\n\nCar il me protégera dans son tabernacle au jour du malheur, il me cachera sous l'abri de sa tente ; il m'élèvera sur un rocher.\n\nEt déjà ma tête s'élève sur mes ennemis qui m'entourent ; j'offrirai des sacrifices dans sa tente, au son de la trompette ; je chanterai, je célébrerai l'Éternel.\n\nÉternel ! écoute ma voix, je t'invoque : aie pitié de moi et exauce-moi !\n\nMon cœur dit de ta part : cherchez ma face ! Je cherche ta face, ô Éternel !\n\nNe me cache point ta face, ne repousse pas avec colère ton serviteur ! Tu es mon secours, ne me laisse pas, ne m'abandonne pas, Dieu de mon salut !\n\nCar mon père et ma mère m'abandonnent, mais l'Éternel me recueillera.\n\nÉternel ! enseigne-moi ta voie, conduis-moi dans le sentier de la droiture, à cause de mes ennemis.\n\nNe me livre pas au bon plaisir de mes adversaires, car il s'élève contre moi de faux témoins et des gens qui ne respirent que la violence.\n\nOh ! si je n'étais pas sûr de voir la bonté de l'Éternel sur la terre des vivants !...\n\nEspère en l'Éternel ! Fortifie-toi et que ton cœur s'affermisse ! Espère en l'Éternel !\n", "28": "Psaume 28.\n\nDe David. Éternel ! c'est à toi que je crie. Mon rocher ! ne reste pas sourd à ma voix, de peur que, si tu t'éloignes sans me répondre, je ne sois semblable à ceux qui descendent dans la fosse.\n\nÉcoute la voix de mes supplications, quand je crie à toi, quand j'élève mes mains vers ton sanctuaire.\n\nNe m'emporte pas avec les méchants et les hommes iniques, qui parlent de paix à leur prochain et qui ont la malice dans le cœur.\n\nRends-leur selon leurs œuvres et selon la malice de leurs actions, rends-leur selon l'ouvrage de leurs mains ; donne-leur le salaire qu'ils méritent.\n\nCar ils ne sont pas attentifs aux œuvres de l'Éternel, à l'ouvrage de ses mains. Qu'il les renverse et ne les relève point !\n\nBéni soit l'Éternel ! Car il exauce la voix de mes supplications.\n\nL'Éternel est ma force et mon bouclier ; en lui mon cœur se confie, et je suis secouru ; j'ai de l'allégresse dans le cœur, et je le loue par mes chants.\n\nL'Éternel est la force de son peuple, il est le rocher des délivrances de son oint.\n\nSauve ton peuple et bénis ton héritage ! Sois leur berger et leur soutien pour toujours !\n", "29": "Psaume 29.\n\nPsaume de David. Fils de Dieu, rendez à l'Éternel, rendez à l'Éternel gloire et honneur !\n\nRendez à l'Éternel gloire pour son nom ! Prosternez-vous devant l'Éternel avec des ornements sacrés !\n\nLa voix de l'Éternel retentit sur les eaux, le Dieu de gloire fait gronder le tonnerre ; l'Éternel est sur les grandes eaux.\n\nLa voix de l'Éternel est puissante, la voix de l'Éternel est majestueuse.\n\nLa voix de l'Éternel brise les cèdres ; l'Éternel brise les cèdres du Liban,\n\nil les fait bondir comme des veaux, et le Liban et le Sirion comme de jeunes buffles.\n\nLa voix de l'Éternel fait jaillir des flammes de feu.\n\nLa voix de l'Éternel fait trembler le désert ; l'Éternel fait trembler le désert de Kadès.\n\nLa voix de l'Éternel fait enfanter les biches, elle dépouille les forêts. Dans son palais tout s'écrie : Gloire !\n\nL'Éternel était sur son trône lors du déluge ; l'Éternel sur son trône règne éternellement.\n\nL'Éternel donne la force à son peuple ; l'Éternel bénit son peuple et le rend heureux.\n", "30": "Psaume 30.\n\nPsaume. Cantique pour la dédicace de la maison. De David. Je t'exalte, ô Éternel, car tu m'as relevé, tu n'as pas voulu que mes ennemis se réjouissent à mon sujet.\n\nÉternel, mon Dieu ! J'ai crié à toi, et tu m'as guéri.\n\nÉternel ! tu as fait remonter mon âme du séjour des morts, tu m'as fait revivre loin de ceux qui descendent dans la fosse.\n\nChantez à l'Éternel, vous qui l'aimez, célébrez par vos louanges sa sainteté !\n\nCar sa colère dure un instant, mais sa grâce toute la vie ; le soir arrivent les pleurs, et le matin l'allégresse.\n\nJe disais dans ma sécurité : je ne chancellerai jamais !\n\nÉternel ! par ta grâce tu avais affermi ma montagne... Tu cachas ta face, et je fus troublé.\n\nÉternel ! j'ai crié à toi, j'ai imploré l'Éternel :\n\nque gagnes-tu à verser mon sang, à me faire descendre dans la fosse ? La poussière a-t-elle pour toi des louanges ? Raconte-t-elle ta fidélité ?\n\nÉcoute, Éternel, aie pitié de moi ! Éternel, secours-moi !\n\nEt tu as changé mes lamentations en allégresse, tu as délié mon sac, et tu m'as ceint de joie,\n\nafin que mon cœur te chante et ne soit pas muet. Éternel, mon Dieu ! je te louerai toujours.\n", "31": "Psaume 31.\n\nAu chef des chantres. Psaume de David. Éternel ! je cherche en toi mon refuge : que jamais je ne sois confondu ! Délivre-moi dans ta justice !\n\nIncline vers moi ton oreille, hâte-toi de me secourir ! Sois pour moi un rocher protecteur, une forteresse, où je trouve mon salut !\n\nCar tu es mon rocher, ma forteresse ; et à cause de ton nom tu me conduiras, tu me dirigeras.\n\nTu me feras sortir du filet qu'ils m'ont tendu ; car tu es mon protecteur.\n\nJe remets mon esprit entre tes mains ; tu me délivreras, Éternel, Dieu de vérité !\n\nJe hais ceux qui s'attachent à de vaines idoles, et je me confie en l'Éternel.\n\nJe serai par ta grâce dans l'allégresse et dans la joie ; car tu vois ma misère, tu sais les angoisses de mon âme,\n\net tu ne me livreras pas aux mains de l'ennemi, tu mettras mes pieds au large.\n\nAie pitié de moi, Éternel ! car je suis dans la détresse ; j'ai le visage, l'âme et le corps usés par le chagrin.\n\nMa vie se consume dans la douleur, et mes années dans les soupirs ; ma force est épuisée à cause de mon iniquité, et mes os dépérissent.\n\nTous mes adversaires m'ont rendu un objet d'opprobre, de grand opprobre pour mes voisins, et de terreur pour mes amis ; ceux qui me voient dehors s'enfuient loin de moi.\n\nJe suis oublié des cœurs comme un mort, je suis comme un vase brisé.\n\nJ'apprends les mauvais propos de plusieurs, l'épouvante qui règne à l'entour, quand ils se concertent ensemble contre moi : ils complotent de m'ôter la vie.\n\nMais en toi je me confie, ô Éternel ! Je dis : Tu es mon Dieu !\n\nMes destinées sont dans ta main ; délivre-moi de mes ennemis et de mes persécuteurs !\n\nFais luire ta face sur ton serviteur, sauve-moi par ta grâce !\n\nÉternel, que je ne sois pas confondu quand je t'invoque. Que les méchants soient confondus, qu'ils descendent en silence au séjour des morts !\n\nQu'elles deviennent muettes, les lèvres menteuses, qui parlent avec audace contre le juste, avec arrogance et dédain !\n\nOh ! combien est grande ta bonté, que tu tiens en réserve pour ceux qui te craignent, que tu témoignes à ceux qui cherchent en toi leur refuge, à la vue des fils de l'homme !\n\nTu les protèges sous l'abri de ta face contre ceux qui les persécutent, tu les protèges dans ta tente contre les langues qui les attaquent.\n\nBéni soit l'Éternel ! Car il a signalé sa grâce envers moi, comme si j'avais été dans une ville forte.\n\nJe disais dans ma précipitation : je suis chassé loin de ton regard ! Mais tu as entendu la voix de mes supplications, quand j'ai crié vers toi.\n\nAimez l'Éternel, vous qui avez de la piété ! L'Éternel garde les fidèles, et il punit sévèrement les orgueilleux.\n\nFortifiez-vous et que votre cœur s'affermisse, vous tous qui espérez en l'Éternel !\n", "32": "Psaume 32.\n\nDe David. Cantique. Heureux celui à qui la transgression est remise, à qui le péché est pardonné !\n\nHeureux l'homme à qui l'Éternel n'impute pas d'iniquité, et dans l'esprit duquel il n'y a point de fraude !\n\nTant que je me suis tu, mes os se consumaient, je gémissais toute la journée ;\n\ncar nuit et jour ta main s'appesantissait sur moi, ma vigueur n'était plus que sécheresse, comme celle de l'été.\n\nJe t'ai fait connaître mon péché, je n'ai pas caché mon iniquité ; j'ai dit : J'avouerai mes transgressions à l'Éternel ! Et tu as effacé la peine de mon péché.\n\nQu'ainsi tout homme pieux te prie au temps convenable ! Si de grandes eaux débordent, elles ne l'atteindront nullement.\n\nTu es un asile pour moi, tu me garantis de la détresse, tu m'entoures de chants de délivrance.\n\nJe t'instruirai et te montrerai la voie que tu dois suivre ; je te conseillerai, j'aurai le regard sur toi.\n\nNe soyez pas comme un cheval ou un mulet sans intelligence ; on les bride avec un frein et un mors, dont on les pare, afin qu'ils ne s'approchent point de toi.\n\nBeaucoup de douleurs sont la part du méchant, mais celui qui se confie en l'Éternel est environné de sa grâce.\n\nJustes, réjouissez-vous en l'Éternel et soyez dans l'allégresse ! Poussez des cris de joie, vous tous qui êtes droits de cœur !\n", "33": "Psaume 33.\n\nJustes, réjouissez-vous en l'Éternel ! La louange sied aux hommes droits.\n\nCélébrez l'Éternel avec la harpe, célébrez-le sur le luth à dix cordes.\n\nChantez-lui un cantique nouveau ! Faites retentir vos instruments et vos voix !\n\nCar la parole de l'Éternel est droite, et toutes ses œuvres s'accomplissent avec fidélité ;\n\nil aime la justice et la droiture ; la bonté de l'Éternel remplit la terre.\n\nLes cieux ont été faits par la parole de l'Éternel, et toute leur armée par le souffle de sa bouche.\n\nIl amoncelle en un tas les eaux de la mer, il met dans des réservoirs les abîmes.\n\nQue toute la terre craigne l'Éternel ! Que tous les habitants du monde tremblent devant lui !\n\nCar il dit, et la chose arrive ; il ordonne, et elle existe.\n\nL'Éternel renverse les desseins des nations, il anéantit les projets des peuples ;\n\nles desseins de l'Éternel subsistent à toujours, et les projets de son cœur, de génération en génération.\n\nHeureuse la nation dont l'Éternel est le Dieu ! Heureux le peuple qu'il choisit pour son héritage !\n\nL'Éternel regarde du haut des cieux, il voit tous les fils de l'homme ;\n\ndu lieu de sa demeure il observe tous les habitants de la terre,\n\nlui qui forme leur cœur à tous, qui est attentif à toutes leurs actions.\n\nCe n'est pas une grande armée qui sauve le roi, ce n'est pas une grande force qui délivre le héros ;\n\nle cheval est impuissant pour assurer le salut, et toute sa vigueur ne donne pas la délivrance.\n\nVoici, l'œil de l'Éternel est sur ceux qui le craignent, sur ceux qui espèrent en sa bonté,\n\nafin d'arracher leur âme à la mort et de les faire vivre au milieu de la famine.\n\nNotre âme espère en l'Éternel ; il est notre secours et notre bouclier.\n\nCar notre cœur met en lui sa joie, car nous avons confiance en son saint nom.\n\nÉternel ! que ta grâce soit sur nous, comme nous espérons en toi !\n", "34": "Psaume 34.\n\nDe David. Lorsqu'il contrefit l'insensé en présence d'Abimélec, et qu'il s'en alla chassé par lui. Je bénirai l'Éternel en tout temps ; sa louange sera toujours dans ma bouche.\n\nQue mon âme se glorifie en l'Éternel ! Que les malheureux écoutent et se réjouissent !\n\nExaltez avec moi l'Éternel ! Célébrons tous son nom !\n\nJ'ai cherché l'Éternel, et il m'a répondu ; il m'a délivré de toutes mes frayeurs.\n\nQuand on tourne vers lui les regards, on est rayonnant de joie, et le visage ne se couvre pas de honte.\n\nQuand un malheureux crie, l'Éternel entend, et il le sauve de toutes ses détresses.\n\nL'ange de l'Éternel campe autour de ceux qui le craignent, et il les arrache au danger.\n\nSentez et voyez combien l'Éternel est bon ! Heureux l'homme qui cherche en lui son refuge !\n\nCraignez l'Éternel, vous ses saints ! Car rien ne manque à ceux qui le craignent.\n\nLes lionceaux éprouvent la disette et la faim, mais ceux qui cherchent l'Éternel ne sont privés d'aucun bien.\n\nVenez, mes fils, écoutez-moi ! Je vous enseignerai la crainte de l'Éternel.\n\nQuel est l'homme qui aime la vie, qui désire la prolonger pour jouir du bonheur ?\n\nPréserve ta langue du mal, et tes lèvres des paroles trompeuses ;\n\néloigne-toi du mal, et fais le bien ; recherche et poursuis la paix.\n\nLes yeux de l'Éternel sont sur les justes, et ses oreilles sont attentives à leurs cris.\n\nL'Éternel tourne sa face contre les méchants, pour retrancher de la terre leur souvenir.\n\nQuand les justes crient, l'Éternel entend, et il les délivre de toutes leurs détresses ;\n\nl'Éternel est près de ceux qui ont le cœur brisé, et il sauve ceux qui ont l'esprit dans l'abattement.\n\nLe malheur atteint souvent le juste, mais l'Éternel l'en délivre toujours.\n\nIl garde tous ses os, aucun d'eux n'est brisé.\n\nLe malheur tue le méchant, et les ennemis du juste sont châtiés.\n\nL'Éternel délivre l'âme de ses serviteurs, et tous ceux qui l'ont pour refuge échappent au châtiment.\n", "35": "Psaume 35.\n\nDe David. Éternel ! défends-moi contre mes adversaires, combats ceux qui me combattent !\n\nSaisis le petit et le grand bouclier, et lève-toi pour me secourir !\n\nBrandis la lance et le javelot contre mes persécuteurs ! Dis à mon âme : je suis ton salut !\n\nQu'ils soient honteux et confus, ceux qui en veulent à ma vie ! Qu'ils reculent et rougissent, ceux qui méditent ma perte !\n\nQu'ils soient comme la balle emportée par le vent, et que l'ange de l'Éternel les chasse !\n\nQue leur route soit ténébreuse et glissante, et que l'ange de l'Éternel les poursuive !\n\nCar sans cause ils m'ont tendu leur filet sur une fosse, sans cause ils l'ont creusée pour m'ôter la vie.\n\nQue la ruine les atteigne à l'improviste, qu'ils soient pris dans le filet qu'ils ont tendu, qu'ils y tombent et périssent !\n\nEt mon âme aura de la joie en l'Éternel, de l'allégresse en son salut.\n\nTous mes os diront : Éternel ! qui peut, comme toi, délivrer le malheureux d'un plus fort que lui, le malheureux et le pauvre de celui qui le dépouille ?\n\nDe faux témoins se lèvent : ils m'interrogent sur ce que j'ignore.\n\nIls me rendent le mal pour le bien : mon âme est dans l'abandon.\n\nEt moi, quand ils étaient malades, je revêtais un sac, j'humiliais mon âme par le jeûne, je priais, la tête penchée sur mon sein.\n\nComme pour un ami, pour un frère, je me traînais lentement ; comme pour le deuil d'une mère, je me courbais avec tristesse.\n\nPuis, quand je chancelle, ils se réjouissent et s'assemblent, ils s'assemblent à mon insu pour m'outrager, ils me déchirent sans relâche ;\n\navec les impies, les parasites moqueurs, ils grincent des dents contre moi.\n\nSeigneur ! Jusques à quand le verras-tu ? Protège mon âme contre leurs embûches, ma vie contre les lionceaux !\n\nJe te louerai dans la grande assemblée, je te célébrerai au milieu d'un peuple nombreux.\n\nQue ceux qui sont à tort mes ennemis ne se réjouissent pas à mon sujet, que ceux qui me haïssent sans cause ne m'insultent pas du regard !\n\nCar ils tiennent un langage qui n'est point celui de la paix, ils méditent la tromperie contre les gens tranquilles du pays.\n\nIls ouvrent contre moi leur bouche, ils disent : Ah ! ah ! nos yeux regardent !\n\nÉternel, tu le vois ! ne reste pas en silence ! Seigneur, ne t'éloigne pas de moi !\n\nRéveille-toi, réveille-toi pour me faire justice ! Mon Dieu et mon Seigneur, défends ma cause !\n\nJuge-moi selon ta justice, Éternel, mon Dieu ! Et qu'ils ne se réjouissent pas à mon sujet !\n\nQu'ils ne disent pas dans leur cœur : ah ! voilà ce que nous voulions ! Qu'ils ne disent pas : nous l'avons englouti !\n\nQue tous ensemble ils soient honteux et confus, ceux qui se réjouissent de mon malheur ! Qu'ils revêtent l'ignominie et l'opprobre, ceux qui s'élèvent contre moi !\n\nQu'ils aient de l'allégresse et de la joie, ceux qui prennent plaisir à mon innocence, et que sans cesse ils disent : Exalté soit l'Éternel, qui veut la paix de son serviteur !\n\nEt ma langue célébrera ta justice, elle dira tous les jours ta louange.\n", "36": "Psaume 36.\n\nAu chef des chantres. Du serviteur de l'Éternel, de David. La parole impie du méchant est au fond de son cœur ; la crainte de Dieu n'est pas devant ses yeux.\n\nCar il se flatte à ses propres yeux, pour consommer son iniquité, pour assouvir sa haine.\n\nLes paroles de sa bouche sont fausses et trompeuses ; il renonce à agir avec sagesse, à faire le bien.\n\nIl médite l'injustice sur sa couche, il se tient sur une voie qui n'est pas bonne, il ne repousse pas le mal.\n\nÉternel ! ta bonté atteint jusqu'aux cieux, ta fidélité jusqu'aux nues.\n\nTa justice est comme les montagnes de Dieu, tes jugements sont comme le grand abîme. Éternel ! tu soutiens les hommes et les bêtes.\n\nCombien est précieuse ta bonté, ô Dieu ! À l'ombre de tes ailes les fils de l'homme cherchent un refuge.\n\nIls se rassasient de l'abondance de ta maison, et tu les abreuves au torrent de tes délices.\n\nCar auprès de toi est la source de la vie ; par ta lumière nous voyons la lumière.\n\nÉtends ta bonté sur ceux qui te connaissent, et ta justice sur ceux dont le cœur est droit !\n\nQue le pied de l'orgueil ne m'atteigne pas, et que la main des méchants ne me fasse pas fuir !\n\nDéjà tombent ceux qui commettent l'iniquité ; ils sont renversés, et ils ne peuvent se relever.\n", "37": "Psaume 37.\n\nDe David. Ne t'irrite pas contre les méchants, n'envie pas ceux qui font le mal.\n\nCar ils sont fauchés aussi vite que l'herbe, et ils se flétrissent comme le gazon vert.\n\nConfie-toi en l'Éternel, et pratique le bien ; aie le pays pour demeure et la fidélité pour pâture.\n\nFais de l'Éternel tes délices, et il te donnera ce que ton cœur désire.\n\nRecommande ton sort à l'Éternel, mets en lui ta confiance, et il agira.\n\nIl fera paraître ta justice comme la lumière, et ton droit comme le soleil à son midi.\n\nGarde le silence devant l'Éternel, et espère en lui ; ne t'irrite pas contre celui qui réussit dans ses voies, contre l'homme qui vient à bout de ses mauvais desseins.\n\nLaisse la colère, abandonne la fureur ; ne t'irrite pas, ce serait mal faire.\n\nCar les méchants seront retranchés, et ceux qui espèrent en l'Éternel posséderont le pays.\n\nEncore un peu de temps, et le méchant n'est plus ; tu regardes le lieu où il était, et il a disparu.\n\nLes misérables possèdent le pays, et ils jouissent abondamment de la paix.\n\nLe méchant forme des projets contre le juste, et il grince des dents contre lui.\n\nLe Seigneur se rit du méchant, car il voit que son jour arrive.\n\nLes méchants tirent le glaive, ils bandent leur arc, pour faire tomber le malheureux et l'indigent, pour égorger ceux dont la voie est droite.\n\nLeur glaive entre dans leur propre cœur, et leurs arcs se brisent.\n\nMieux vaut le peu du juste que l'abondance de beaucoup de méchants ;\n\ncar les bras des méchants seront brisés, mais l'Éternel soutient les justes.\n\nL'Éternel connaît les jours des hommes intègres, et leur héritage dure à jamais.\n\nIls ne sont pas confondus au temps du malheur, et ils sont rassasiés aux jours de la famine.\n\nMais les méchants périssent, et les ennemis de l'Éternel, comme les plus beaux pâturages ; ils s'évanouissent, ils s'évanouissent en fumée.\n\nLe méchant emprunte, et il ne rend pas ; le juste est compatissant, et il donne.\n\nCar ceux que bénit l'Éternel possèdent le pays, et ceux qu'il maudit sont retranchés.\n\nL'Éternel affermit les pas de l'homme, et il prend plaisir à sa voie ;\n\ns'il tombe, il n'est pas terrassé, car l'Éternel lui prend la main.\n\nJ'ai été jeune, j'ai vieilli ; et je n'ai point vu le juste abandonné, ni sa postérité mendiant son pain.\n\nToujours il est compatissant, et il prête ; et sa postérité est bénie.\n\nDétourne-toi du mal, fais le bien, et possède à jamais ta demeure.\n\nCar l'Éternel aime la justice, et il n'abandonne pas ses fidèles ; ils sont toujours sous sa garde, mais la postérité des méchants est retranchée.\n\nLes justes posséderont le pays, et ils y demeureront à jamais.\n\nLa bouche du juste annonce la sagesse, et sa langue proclame la justice.\n\nLa loi de son Dieu est dans son cœur ; ses pas ne chancellent point.\n\nLe méchant épie le juste, et il cherche à le faire mourir.\n\nL'Éternel ne le laisse pas entre ses mains, et il ne le condamne pas quand il est en jugement.\n\nEspère en l'Éternel, garde sa voie, et il t'élèvera pour que tu possèdes le pays ; tu verras les méchants retranchés.\n\nJ'ai vu le méchant dans toute sa puissance ; il s'étendait comme un arbre verdoyant.\n\nIl a passé, et voici, il n'est plus ; je le cherche, et il ne se trouve plus.\n\nObserve celui qui est intègre, et regarde celui qui est droit ; car il y a une postérité pour l'homme de paix.\n\nMais les rebelles sont tous anéantis, la postérité des méchants est retranchée.\n\nLe salut des justes vient de l'Éternel ; il est leur protecteur au temps de la détresse.\n\nL'Éternel les secourt et les délivre ; il les délivre des méchants et les sauve, parce qu'ils cherchent en lui leur refuge.\n", "38": "Psaume 38.\n\nPsaume de David. Pour souvenir. Éternel ! ne me punis pas dans ta colère, et ne me châtie pas dans ta fureur.\n\nCar tes flèches m'ont atteint, et ta main s'est appesantie sur moi.\n\nIl n'y a rien de sain dans ma chair à cause de ta colère, il n'y a plus de vigueur dans mes os à cause de mon péché.\n\nCar mes iniquités s'élèvent au-dessus de ma tête ; comme un lourd fardeau, elles sont trop pesantes pour moi.\n\nMes plaies sont infectes et purulentes, par l'effet de ma folie.\n\nJe suis courbé, abattu au dernier point ; tout le jour je marche dans la tristesse.\n\nCar un mal brûlant dévore mes entrailles, et il n'y a rien de sain dans ma chair.\n\nJe suis sans force, entièrement brisé ; le trouble de mon cœur m'arrache des gémissements.\n\nSeigneur ! tous mes désirs sont devant toi, et mes soupirs ne te sont point cachés.\n\nMon cœur est agité, ma force m'abandonne, et la lumière de mes yeux n'est plus même avec moi.\n\nMes amis et mes connaissances s'éloignent de ma plaie, et mes proches se tiennent à l'écart.\n\nCeux qui en veulent à ma vie tendent leurs pièges ; ceux qui cherchent mon malheur disent des méchancetés, et méditent tout le jour des tromperies.\n\nEt moi, je suis comme un sourd, je n'entends pas ; je suis comme un muet, qui n'ouvre pas la bouche.\n\nJe suis comme un homme qui n'entend pas, et dans la bouche duquel il n'y a point de réplique.\n\nÉternel ! c'est en toi que j'espère ; tu répondras, Seigneur, mon Dieu !\n\nCar je dis : Ne permets pas qu'ils se réjouissent à mon sujet, qu'ils s'élèvent contre moi, si mon pied chancelle !\n\nCar je suis près de tomber, et ma douleur est toujours devant moi.\n\nCar je reconnais mon iniquité, je suis dans la crainte à cause de mon péché.\n\nEt mes ennemis sont pleins de vie, pleins de force ; ceux qui me haïssent sans cause sont nombreux.\n\nIls me rendent le mal pour le bien ; ils sont mes adversaires, parce que je recherche le bien.\n\nNe m'abandonne pas, Éternel ! Mon Dieu, ne t'éloigne pas de moi !\n\nViens en hâte à mon secours, Seigneur, mon salut !\n", "39": "Psaume 39.\n\nAu chef des chantres. À Jeduthun, Psaume de David. Je disais : Je veillerai sur mes voies, de peur de pécher par ma langue ; je mettrai un frein à ma bouche, tant que le méchant sera devant moi.\n\nJe suis resté muet, dans le silence ; je me suis tu, quoique malheureux ; et ma douleur n'était pas moins vive.\n\nMon cœur brûlait au dedans de moi, un feu intérieur me consumait, et la parole est venue sur ma langue.\n\nÉternel ! dis-moi quel est le terme de ma vie, quelle est la mesure de mes jours ; que je sache combien je suis fragile.\n\nVoici, tu as donné à mes jours la largeur de la main, et ma vie est comme un rien devant toi. Oui, tout homme debout n'est qu'un souffle.\n\nOui, l'homme se promène comme une ombre, il s'agite vainement ; il amasse, et il ne sait qui recueillera.\n\nMaintenant, Seigneur, que puis-je espérer ? En toi est mon espérance.\n\nDélivre-moi de toutes mes transgressions ! Ne me rends pas l'opprobre de l'insensé !\n\nJe reste muet, je n'ouvre pas la bouche, car c'est toi qui agis.\n\nDétourne de moi tes coups ! Je succombe sous les attaques de ta main.\n\nTu châties l'homme en le punissant de son iniquité, tu détruis comme la teigne ce qu'il a de plus cher. Oui, tout homme est un souffle.\n\nÉcoute ma prière, Éternel, et prête l'oreille à mes cris ! Ne sois pas insensible à mes larmes ! Car je suis un étranger chez toi, un habitant, comme tous mes pères.\n\nDétourne de moi le regard, et laisse-moi respirer, avant que je m'en aille et que ne sois plus !\n", "40": "Psaume 40.\n\nAu chef des chantres. De David. Psaume. J'avais mis en l'Éternel mon espérance ; et il s'est incliné vers moi, il a écouté mes cris.\n\nIl m'a retiré de la fosse de destruction, du fond de la boue ; et il a dressé mes pieds sur le roc, il a affermi mes pas.\n\nIl a mis dans ma bouche un cantique nouveau, une louange à notre Dieu ; beaucoup l'ont vu, et ont eu de la crainte, et ils se sont confiés en l'Éternel.\n\nHeureux l'homme qui place en l'Éternel sa confiance, et qui ne se tourne pas vers les hautains et les menteurs !\n\nTu as multiplié, Éternel, mon Dieu ! Tes merveilles et tes desseins en notre faveur ; nul n'est comparable à toi ; je voudrais les publier et les proclamer, mais leur nombre est trop grand pour que je les raconte.\n\nTu ne désires ni sacrifice ni offrande, tu m'as ouvert les oreilles ; tu ne demandes ni holocauste ni victime expiatoire.\n\nAlors je dis : Voici, je viens avec le rouleau du livre écrit pour moi.\n\nJe veux faire ta volonté, mon Dieu ! Et ta loi est au fond de mon cœur.\n\nJ'annonce la justice dans la grande assemblée ; voici, je ne ferme pas mes lèvres, Éternel, tu le sais !\n\nJe ne retiens pas dans mon cœur ta justice, je publie ta vérité et ton salut ; je ne cache pas ta bonté et ta fidélité dans la grande assemblée.\n\nToi, Éternel ! tu ne me refuseras pas tes compassions ; ta bonté et ta fidélité me garderont toujours.\n\nCar des maux sans nombre m'environnent ; les châtiments de mes iniquités m'atteignent, et je ne puis en supporter la vue ; ils sont plus nombreux que les cheveux de ma tête, et mon courage m'abandonne.\n\nVeuille me délivrer, ô Éternel ! Éternel, viens en hâte à mon secours !\n\nQue tous ensemble ils soient honteux et confus, ceux qui en veulent à ma vie pour l'enlever ! Qu'ils reculent et rougissent, ceux qui désirent ma perte !\n\nQu'ils soient dans la stupeur par l'effet de leur honte, ceux qui me disent : Ah ! ah !\n\nQue tous ceux qui te cherchent soient dans l'allégresse et se réjouissent en toi ! Que ceux qui aiment ton salut disent sans cesse : exalté soit l'Éternel !\n\nMoi, je suis pauvre et indigent ; mais le Seigneur pense à moi. Tu es mon aide et mon libérateur : mon Dieu, ne tarde pas !\n", "41": "Psaume 41.\n\nAu chef des chantres. Psaume de David. Heureux celui qui s'intéresse au pauvre ! Au jour du malheur l'Éternel le délivre ;\n\nl'Éternel le garde et lui conserve la vie. Il est heureux sur la terre, et tu ne le livres pas au bon plaisir de ses ennemis.\n\nL'Éternel le soutient sur son lit de douleur ; tu le soulages dans toutes ses maladies.\n\nJe dis : Éternel, aie pitié de moi ! Guéris mon âme ! car j'ai péché contre toi.\n\nMes ennemis disent méchamment de moi : quand mourra-t-il ? quand périra son nom ?\n\nSi quelqu'un vient me voir, il prend un langage faux, il recueille des sujets de médire ; il s'en va, et il parle au dehors.\n\nTous mes ennemis chuchotent entre eux contre moi ; ils pensent que mon malheur causera ma ruine :\n\nil est dangereusement atteint, le voilà couché, il ne se relèvera pas !\n\nCelui-là même avec qui j'étais en paix, qui avait ma confiance et qui mangeait mon pain, lève le talon contre moi.\n\nToi, Éternel, aie pitié de moi et rétablis-moi ! Et je leur rendrai ce qui leur est dû.\n\nJe connaîtrai que tu m'aimes, si mon ennemi ne triomphe pas de moi.\n\nTu m'as soutenu à cause de mon intégrité, et tu m'as placé pour toujours en ta présence.\n\nBéni soit l'Éternel, le Dieu d'Israël, d'éternité en éternité ! Amen ! Amen !\n", "42": "Psaume 42.\n\nAu chef des chantres. Cantique des fils de Koré. Comme une biche soupire après des courants d'eau, ainsi mon âme soupire après toi, ô Dieu !\n\nMon âme a soif de Dieu, du Dieu vivant : quand irai-je et paraîtrai-je devant la face de Dieu ?\n\nMes larmes sont ma nourriture jour et nuit, pendant qu'on me dit sans cesse : où est ton Dieu ?\n\nJe me rappelle avec effusion de cœur quand je marchais entouré de la foule, et que je m'avançais à sa tête vers la maison de Dieu, au milieu des cris de joie et des actions de grâces d'une multitude en fête.\n\nPourquoi t'abats-tu, mon âme, et gémis-tu au dedans de moi ? Espère en Dieu, car je le louerai encore ; il est mon salut et mon Dieu.\n\nMon âme est abattue au dedans de moi : aussi c'est à toi que je pense, depuis le pays du Jourdain, depuis l'Hermon, depuis la montagne de Mitsear.\n\nUn flot appelle un autre flot au bruit de tes ondées ; toutes tes vagues et tous tes flots passent sur moi.\n\nLe jour, l'Éternel m'accordait sa grâce ; la nuit, je chantais ses louanges, j'adressais une prière au Dieu de ma vie.\n\nJe dis à Dieu, mon rocher : pourquoi m'oublies-tu ? Pourquoi dois-je marcher dans la tristesse, sous l'oppression de l'ennemi ?\n\nMes os se brisent quand mes persécuteurs m'outragent, en me disant sans cesse : où est ton Dieu ?\n\nPourquoi t'abats-tu, mon âme, et gémis-tu au dedans de moi ? Espère en Dieu, car je le louerai encore ; il est mon salut et mon Dieu.\n", "43": "Psaume 43.\n\nRends-moi justice, ô Dieu, défends ma cause contre une nation infidèle ! Délivre-moi des hommes de fraude et d'iniquité !\n\nToi, mon Dieu protecteur, pourquoi me repousses-tu ? Pourquoi dois-je marcher dans la tristesse, sous l'oppression de l'ennemi ?\n\nEnvoie ta lumière et ta fidélité ! Qu'elles me guident, qu'elles me conduisent à ta montagne sainte et à tes demeures !\n\nJ'irai vers l'autel de Dieu, de Dieu, ma joie et mon allégresse, et je te célébrerai sur la harpe, ô Dieu, mon Dieu !\n\nPourquoi t'abats-tu, mon âme, et gémis-tu au dedans de moi ? Espère en Dieu, car je le louerai encore ; il est mon salut et mon Dieu.\n", "44": "Psaume 44.\n\nAu chef des chantres. Des fils de Koré. Cantique. Ô Dieu ! nous avons entendu de nos oreilles, nos pères nous ont raconté les œuvres que tu as accomplies de leur temps, aux jours d'autrefois.\n\nDe ta main tu as chassé des nations pour les établir, tu as frappé des peuples pour les étendre.\n\nCar ce n'est point par leur épée qu'ils se sont emparés du pays, ce n'est point leur bras qui les a sauvés ; mais c'est ta droite, c'est ton bras, c'est la lumière de ta face, parce que tu les aimais.\n\nÔ Dieu ! tu es mon roi : ordonne la délivrance de Jacob !\n\nAvec toi nous renversons nos ennemis, avec ton nom nous écrasons nos adversaires.\n\nCar ce n'est pas en mon arc que je me confie, ce n'est pas mon épée qui me sauvera ;\n\nmais c'est toi qui nous délivres de nos ennemis, et qui confonds ceux qui nous haïssent.\n\nNous nous glorifions en Dieu chaque jour, et nous célébrerons à jamais ton nom.\n\nCependant tu nous repousses, tu nous couvres de honte, tu ne sors plus avec nos armées ;\n\ntu nous fais reculer devant l'ennemi, et ceux qui nous haïssent enlèvent nos dépouilles.\n\nTu nous livres comme des brebis à dévorer, tu nous disperses parmi les nations.\n\nTu vends ton peuple pour rien, tu ne l'estimes pas à une grande valeur.\n\nTu fais de nous un objet d'opprobre pour nos voisins, de moquerie et de risée pour ceux qui nous entourent ;\n\ntu fais de nous un objet de sarcasme parmi les nations, et de hochements de tête parmi les peuples.\n\nMa honte est toujours devant moi, et la confusion couvre mon visage,\n\nà la voix de celui qui m'insulte et m'outrage, à la vue de l'ennemi et du vindicatif.\n\nTout cela nous arrive, sans que nous t'ayons oublié, sans que nous ayons violé ton alliance :\n\nnotre cœur ne s'est point détourné, nos pas ne se sont point éloignés de ton sentier,\n\npour que tu nous écrases dans la demeure des chacals, et que tu nous couvres de l'ombre de la mort.\n\nSi nous avions oublié le nom de notre Dieu, et étendu nos mains vers un dieu étranger,\n\nDieu ne le saurait-il pas, lui qui connaît les secrets du cœur ?\n\nMais c'est à cause de toi qu'on nous égorge tous les jours, qu'on nous regarde comme des brebis destinées à la boucherie.\n\nRéveille-toi ! Pourquoi dors-tu, Seigneur ? Réveille-toi ! ne nous repousse pas à jamais !\n\nPourquoi caches-tu ta face ? Pourquoi oublies-tu notre misère et notre oppression ?\n\nCar notre âme est abattue dans la poussière, notre corps est attaché à la terre.\n\nLève-toi, pour nous secourir ! Délivre-nous à cause de ta bonté !\n", "45": "Psaume 45.\n\nAu chef des chantres. Sur les lis. Des fils de Koré. Cantique. Chant d'amour. Des paroles pleines de charme bouillonnent dans mon cœur. Je dis : Mon œuvre est pour le roi ! Que ma langue soit comme la plume d'un habile écrivain !\n\nTu es le plus beau des fils de l'homme, la grâce est répandue sur tes lèvres : c'est pourquoi Dieu t'a béni pour toujours.\n\nVaillant guerrier, ceins ton épée, ta parure et ta gloire,\n\noui, ta gloire ! Sois vainqueur, monte sur ton char, défends la vérité, la douceur et la justice, et que ta droite se signale par de merveilleux exploits !\n\nTes flèches sont aiguës ; des peuples tomberont sous toi ; elles perceront le cœur des ennemis du roi.\n\nTon trône, ô Dieu, est à toujours ; le sceptre de ton règne est un sceptre d'équité.\n\nTu aimes la justice, et tu hais la méchanceté : c'est pourquoi, ô Dieu, ton Dieu t'a oint d'une huile de joie, par privilège sur tes collègues.\n\nLa myrrhe, l'aloès et la casse parfument tous tes vêtements ; dans les palais d'ivoire les instruments à cordes te réjouissent.\n\nDes filles de rois sont parmi tes bien-aimées ; la reine est à ta droite, parée d'or d'Ophir.\n\nÉcoute, ma fille, vois, et prête l'oreille ; oublie ton peuple et la maison de ton père.\n\nLe roi porte ses désirs sur ta beauté ; puisqu'il est ton seigneur, rends-lui tes hommages.\n\nEt, avec des présents, la fille de Tyr, les plus riches du peuple rechercheront ta faveur.\n\nToute resplendissante est la fille du roi dans l'intérieur du palais ; elle porte un vêtement tissu d'or.\n\nElle est présentée au roi, vêtue de ses habits brodés, et suivie des jeunes filles, ses compagnes, qui sont amenées auprès de toi ;\n\non les introduit au milieu des réjouissances et de l'allégresse, elles entrent dans le palais du roi.\n\nTes enfants prendront la place de tes pères ; tu les établiras princes dans tout le pays.\n\nJe rappellerai ton nom dans tous les âges : aussi les peuples te loueront éternellement et à jamais.\n", "46": "Psaume 46.\n\nAu chef des chantres. Des fils de Koré. Sur alamoth. Cantique. Dieu est pour nous un refuge et un appui, un secours qui ne manque jamais dans la détresse.\n\nC'est pourquoi nous sommes sans crainte quand la terre est bouleversée, et que les montagnes chancellent au cœur des mers,\n\nquand les flots de la mer mugissent, écument, se soulèvent jusqu'à faire trembler les montagnes.\n\nIl est un fleuve dont les courants réjouissent la cité de Dieu, le sanctuaire des demeures du Très-Haut.\n\nDieu est au milieu d'elle : elle n'est point ébranlée ; Dieu la secourt dès l'aube du matin.\n\nDes nations s'agitent, des royaumes s'ébranlent ; il fait entendre sa voix : la terre se fond d'épouvante.\n\nL'Éternel des armées est avec nous, le Dieu de Jacob est pour nous une haute retraite.\n\nVenez, contemplez les œuvres de l'Éternel, les ravages qu'il a opérés sur la terre !\n\nC'est lui qui a fait cesser les combats jusqu'au bout de la terre ; il a brisé l'arc, et il a rompu la lance, il a consumé par le feu les chars de guerre.\n\nArrêtez, et sachez que je suis Dieu : Je domine sur les nations, je domine sur la terre.\n\nL'Éternel des armées est avec nous, le Dieu de Jacob est pour nous une haute retraite.\n", "47": "Psaume 47.\n\nAu chef des chantres. Des fils de Koré. Psaume. Vous tous, peuples, battez des mains ! Poussez vers Dieu des cris de joie !\n\nCar l'Éternel, le Très-Haut, est redoutable, il est un grand roi sur toute la terre.\n\nIl nous assujettit des peuples, il met des nations sous nos pieds ;\n\nil nous choisit notre héritage, la gloire de Jacob qu'il aime.\n\nDieu monte au milieu des cris de triomphe, l'Éternel s'avance au son de la trompette.\n\nChantez à Dieu, chantez ! Chantez à notre roi, chantez !\n\nCar Dieu est roi de toute la terre : chantez un cantique !\n\nDieu règne sur les nations, Dieu a pour siège son saint trône.\n\nLes princes des peuples se réunissent au peuple du Dieu d'Abraham ; car à Dieu sont les boucliers de la terre : il est souverainement élevé.\n", "48": "Psaume 48.\n\nCantique. Psaume des fils de Koré. L'Éternel est grand, il est l'objet de toutes les louanges, dans la ville de notre Dieu, sur sa montagne sainte.\n\nBelle est la colline, joie de toute la terre, la montagne de Sion ; le côté septentrional, c'est la ville du grand roi.\n\nDieu, dans ses palais, est connu pour une haute retraite.\n\nCar voici, les rois s'étaient concertés : ils n'ont fait que passer ensemble.\n\nIls ont regardé, tout stupéfaits, ils ont eu peur, et ont pris la fuite.\n\nLà un tremblement les a saisis, comme la douleur d'une femme qui accouche.\n\nIls ont été chassés comme par le vent d'orient, qui brise les navires de Tarsis.\n\nCe que nous avions entendu dire, nous l'avons vu dans la ville de l'Éternel des armées, dans la ville de notre Dieu : Dieu la fera subsister à toujours.\n\nÔ Dieu, nous pensons à ta bonté au milieu de ton temple.\n\nComme ton nom, ô Dieu ! Ta louange retentit jusqu'aux extrémités de la terre ; ta droite est pleine de justice.\n\nLa montagne de Sion se réjouit, les filles de Juda sont dans l'allégresse, à cause de tes jugements.\n\nParcourez Sion, parcourez-en l'enceinte, comptez ses tours,\n\nobservez son rempart, examinez ses palais, pour le raconter à la génération future.\n\nVoilà le Dieu qui est notre Dieu éternellement et à jamais ; il sera notre guide jusqu'à la mort.\n", "49": "Psaume 49.\n\nAu chef des chantres. Des fils de Koré. Psaume. Écoutez ceci, vous tous, peuples, prêtez l'oreille, vous tous, habitants du monde,\n\npetits et grands, riches et pauvres !\n\nMa bouche va faire entendre des paroles sages, et mon cœur a des pensées pleines de sens.\n\nJe prête l'oreille aux sentences qui me sont inspirées, j'ouvre mon chant au son de la harpe.\n\nPourquoi craindrais-je aux jours du malheur, lorsque l'iniquité de mes adversaires m'enveloppe ?\n\nIls ont confiance en leurs biens, et se glorifient de leur grande richesse.\n\nIls ne peuvent se racheter l'un l'autre, ni donner à Dieu le prix du rachat.\n\nLe rachat de leur âme est cher, et n'aura jamais lieu ;\n\nils ne vivront pas toujours, ils n'éviteront pas la vue de la fosse.\n\nCar ils la verront : les sages meurent, l'insensé et le stupide périssent également, et ils laissent à d'autres leurs biens.\n\nIls s'imaginent que leurs maisons seront éternelles, que leurs demeures subsisteront d'âge en âge, eux dont les noms sont honorés sur la terre.\n\nMais l'homme qui est en honneur n'a point de durée, il est semblable aux bêtes que l'on égorge.\n\nTelle est leur voie, leur folie, et ceux qui les suivent se plaisent à leurs discours.\n\nComme un troupeau, ils sont mis dans le séjour des morts, la mort en fait sa pâture ; et bientôt les hommes droits les foulent aux pieds, leur beauté s'évanouit, le séjour des morts est leur demeure.\n\nMais Dieu sauvera mon âme du séjour des morts, car il me prendra sous sa protection.\n\nNe sois pas dans la crainte parce qu'un homme s'enrichit, parce que les trésors de sa maison se multiplient ;\n\ncar il n'emporte rien en mourant, ses trésors ne descendent point après lui.\n\nIl aura beau s'estimer heureux pendant sa vie, on aura beau te louer des jouissances que tu te donnes,\n\ntu iras néanmoins au séjour de tes pères, qui jamais ne reverront la lumière.\n\nL'homme qui est en honneur, et qui n'a pas d'intelligence, est semblable aux bêtes que l'on égorge.\n", "50": "Psaume 50.\n\nPsaume d'Asaph. Dieu, Dieu, l'Éternel, parle, et convoque la terre, depuis le soleil levant jusqu'au soleil couchant.\n\nDe Sion, beauté parfaite, Dieu resplendit.\n\nIl vient, notre Dieu, il ne reste pas en silence ; devant lui est un feu dévorant, autour de lui une violente tempête.\n\nIl crie vers les cieux en haut, et vers la terre, pour juger son peuple :\n\nrassemblez-moi mes fidèles, qui ont fait alliance avec moi par le sacrifice !\n\nEt les cieux publieront sa justice, car c'est Dieu qui est juge.\n\nÉcoute, mon peuple ! et je parlerai ; Israël ! et je t'avertirai. Je suis Dieu, ton Dieu.\n\nCe n'est pas pour tes sacrifices que je te fais des reproches ; tes holocaustes sont constamment devant moi.\n\nJe ne prendrai pas de taureau dans ta maison, ni de bouc dans tes bergeries.\n\nCar tous les animaux des forêts sont à moi, toutes les bêtes des montagnes par milliers ;\n\nje connais tous les oiseaux des montagnes, et tout ce qui se meut dans les champs m'appartient.\n\nSi j'avais faim, je ne te le dirais pas, car le monde est à moi et tout ce qu'il renferme.\n\nEst-ce que je mange la chair des taureaux ? Est-ce que je bois le sang des boucs ?\n\nOffre pour sacrifice à Dieu des actions de grâces, et accomplis tes vœux envers le Très-Haut.\n\nEt invoque-moi au jour de la détresse ; je te délivrerai, et tu me glorifieras.\n\nEt Dieu dit au méchant : quoi donc ! tu énumères mes lois, et tu as mon alliance à la bouche,\n\ntoi qui hais les avis, et qui jettes mes paroles derrière toi !\n\nSi tu vois un voleur, tu te plais avec lui, et ta part est avec les adultères.\n\nTu livres ta bouche
