au mal, et ta langue est un tissu de tromperies.\n\nTu t'assieds, et tu parles contre ton frère, tu diffames le fils de ta mère.\n\nVoilà ce que tu as fait, et je me suis tu. Tu t'es imaginé que je te ressemblais ; mais je vais te reprendre, et tout mettre sous tes yeux.\n\nPrenez-y donc garde, vous qui oubliez Dieu, de peur que je ne déchire, sans que personne délivre.\n\nCelui qui offre pour sacrifice des actions de grâces me glorifie, et à celui qui veille sur sa voie je ferai voir le salut de Dieu.\n", "51": "Psaume 51.\n\nAu chef des chantres. Psaume de David. Lorsque nathan, le prophète, vint à lui, après que David fut allé vers Bath-Schéba. Ô Dieu ! aie pitié de moi dans ta bonté ; selon ta grande miséricorde, efface mes transgressions ;\n\nlave-moi complètement de mon iniquité, et purifie-moi de mon péché.\n\nCar je reconnais mes transgressions, et mon péché est constamment devant moi.\n\nJ'ai péché contre toi seul, et j'ai fait ce qui est mal à tes yeux, en sorte que tu seras juste dans ta sentence, sans reproche dans ton jugement.\n\nVoici, je suis né dans l'iniquité, et ma mère m'a conçu dans le péché.\n\nMais tu veux que la vérité soit au fond du cœur : fais donc pénétrer la sagesse au dedans de moi !\n\nPurifie-moi avec l'hysope, et je serai pur ; lave-moi, et je serai plus blanc que la neige.\n\nAnnonce-moi l'allégresse et la joie, et les os que tu as brisés se réjouiront.\n\nDétourne ton regard de mes péchés, efface toutes mes iniquités.\n\nÔ Dieu ! crée en moi un cœur pur, renouvelle en moi un esprit bien disposé.\n\nNe me rejette pas loin de ta face, ne me retire pas ton esprit saint.\n\nRends-moi la joie de ton salut, et qu'un esprit de bonne volonté me soutienne !\n\nJ'enseignerai tes voies à ceux qui les transgressent, et les pécheurs reviendront à toi.\n\nÔ Dieu, Dieu de mon salut ! délivre-moi du sang versé, et ma langue célébrera ta miséricorde.\n\nSeigneur ! ouvre mes lèvres, et ma bouche publiera ta louange.\n\nSi tu eusses voulu des sacrifices, je t'en aurais offert ; mais tu ne prends point plaisir aux holocaustes.\n\nLes sacrifices qui sont agréables à Dieu, c'est un esprit brisé : Ô Dieu ! tu ne dédaignes pas un cœur brisé et contrit.\n\nRépands par ta grâce tes bienfaits sur Sion, bâtis les murs de Jérusalem !\n\nAlors tu agréeras des sacrifices de justice, des holocaustes et des victimes tout entières ; alors on offrira des taureaux sur ton autel.\n", "52": "Psaume 52.\n\nAu chef des chantres. Cantique de David. À l'occasion du rapport que Doëg, l'Édomite, vint faire à Saül, en lui disant : David s'est rendu dans la maison d'Achimélec. Pourquoi te glorifies-tu de ta méchanceté, tyran ? La bonté de Dieu subsiste toujours.\n\nTa langue n'invente que malice, comme un rasoir affilé, fourbe que tu es !\n\nTu aimes le mal plutôt que le bien, le mensonge plutôt que la droiture.\n\nTu aimes toutes les paroles de destruction, langue trompeuse !\n\nAussi Dieu t'abattra pour toujours, il te saisira et t'enlèvera de ta tente ; il te déracinera de la terre des vivants.\n\nLes justes le verront, et auront de la crainte, et ils feront de lui le sujet de leurs moqueries :\n\nvoilà l'homme qui ne prenait point Dieu pour protecteur, mais qui se confiait en ses grandes richesses, et qui triomphait dans sa malice !\n\nEt moi, je suis dans la maison de Dieu comme un olivier verdoyant, je me confie dans la bonté de Dieu, éternellement et à jamais.\n\nJe te louerai toujours, parce que tu as agi ; et je veux espérer en ton nom, parce qu'il est favorable, en présence de tes fidèles.\n", "53": "Psaume 53.\n\nAu chef des chantres. Sur la flûte. Cantique de David. L'insensé dit en son cœur : il n'y a point de Dieu ! Ils se sont corrompus, ils ont commis des iniquités abominables ; il n'en est aucun qui fasse le bien.\n\nDieu, du haut des cieux, regarde les fils de l'homme, pour voir s'il y a quelqu'un qui soit intelligent, qui cherche Dieu.\n\nTous sont égarés, tous sont pervertis ; il n'en est aucun qui fasse le bien, pas même un seul.\n\nCeux qui commettent l'iniquité ont-ils perdu le sens ? Ils dévorent mon peuple, ils le prennent pour nourriture ; ils n'invoquent point Dieu.\n\nAlors ils trembleront d'épouvante, sans qu'il y ait sujet d'épouvante ; Dieu dispersera les os de ceux qui campent contre toi ; tu les confondras, car Dieu les a rejetés.\n\nOh ! qui fera partir de Sion la délivrance d'Israël ? Quand Dieu ramènera les captifs de son peuple, Jacob sera dans l'allégresse, Israël se réjouira.\n", "54": "Psaume 54.\n\nAu chef des chantres. Avec instruments à cordes. Cantique de David. Lorsque les Ziphiens vinrent dire à Saül : David n'est-il pas caché parmi nous ? Ô Dieu ! sauve-moi par ton nom, et rends-moi justice par ta puissance !\n\nÔ Dieu ! écoute ma prière, prête l'oreille aux paroles de ma bouche !\n\nCar des étrangers se sont levés contre moi, des hommes violents en veulent à ma vie ; ils ne portent pas leurs pensées sur Dieu.\n\nVoici, Dieu est mon secours, le Seigneur est le soutien de mon âme.\n\nLe mal retombera sur mes adversaires ; anéantis-les, dans ta fidélité !\n\nJe t'offrirai de bon cœur des sacrifices ; je louerai ton nom, ô Éternel ! car il est favorable,\n\ncar il me délivre de toute détresse, et mes yeux se réjouissent à la vue de mes ennemis.\n", "55": "Psaume 55.\n\nAu chef des chantres. Avec instruments à cordes. Cantique de David. Ô Dieu ! prête l'oreille à ma prière, et ne te dérobe pas à mes supplications !\n\nÉcoute-moi, et réponds-moi ! J'erre çà et là dans mon chagrin et je m'agite,\n\nà cause de la voix de l'ennemi et de l'oppression du méchant ; car ils font tomber sur moi le malheur, et me poursuivent avec colère.\n\nMon cœur tremble au dedans de moi, et les terreurs de la mort me surprennent ;\n\nla crainte et l'épouvante m'assaillent, et le frisson m'enveloppe.\n\nJe dis : Oh ! si j'avais les ailes de la colombe, je m'envolerais, et je trouverais le repos ;\n\nvoici, je fuirais bien loin, j'irais séjourner au désert ;\n\nje m'échapperais en toute hâte, plus rapide que le vent impétueux, que la tempête.\n\nRéduis à néant, Seigneur, divise leurs langues ! Car je vois dans la ville la violence et les querelles ;\n\nelles en font jour et nuit le tour sur les murs ; l'iniquité et la malice sont dans son sein ;\n\nla méchanceté est au milieu d'elle, et la fraude et la tromperie ne quittent point ses places.\n\nCe n'est pas un ennemi qui m'outrage, je le supporterais ; ce n'est pas mon adversaire qui s'élève contre moi, je me cacherais devant lui.\n\nC'est toi, que j'estimais mon égal, toi, mon confident et mon ami !\n\nEnsemble nous vivions dans une douce intimité, nous allions avec la foule à la maison de Dieu !\n\nQue la mort les surprenne, qu'ils descendent vivants au séjour des morts ! Car la méchanceté est dans leur demeure, au milieu d'eux.\n\nEt moi, je crie à Dieu, et l'Éternel me sauvera.\n\nLe soir, le matin, et à midi, je soupire et je gémis, et il entendra ma voix.\n\nIl me délivrera de leur approche et me rendra la paix, car ils sont nombreux contre moi.\n\nDieu entendra, et il les humiliera, lui qui de toute éternité est assis sur son trône ; car il n'y a point en eux de changement, et ils ne craignent point Dieu.\n\nIl porte la main sur ceux qui étaient en paix avec lui, il viole son alliance ;\n\nsa bouche est plus douce que la crème, mais la guerre est dans son cœur ; ses paroles sont plus onctueuses que l'huile, mais ce sont des épées nues.\n\nRemets ton sort à l'Éternel, et il te soutiendra, il ne laissera jamais chanceler le juste.\n\nEt toi, ô Dieu ! tu les feras descendre au fond de la fosse ; les hommes de sang et de fraude n'atteindront pas la moitié de leurs jours. C'est en toi que je me confie.\n", "56": "Psaume 56.\n\nAu chef des chantres. Sur colombe des térébinthes lointains. Hymne de David. Lorsque les Philistins le saisirent à Gath. Aie pitié de moi, ô Dieu ! car des hommes me harcèlent ; tout le jour ils me font la guerre, ils me tourmentent.\n\nTout le jour mes adversaires me harcèlent ; ils sont nombreux, ils me font la guerre comme des hautains.\n\nQuand je suis dans la crainte, en toi je me confie.\n\nJe me glorifierai en Dieu, en sa parole ; je me confie en Dieu, je ne crains rien : que peuvent me faire des hommes ?\n\nSans cesse ils portent atteinte à mes droits, ils n'ont à mon égard que de mauvaises pensées.\n\nIls complotent, ils épient, ils observent mes traces, parce qu'ils en veulent à ma vie.\n\nC'est par l'iniquité qu'ils espèrent échapper : dans ta colère, ô Dieu, précipite les peuples !\n\nTu comptes les pas de ma vie errante ; recueille mes larmes dans ton outre : ne sont-elles pas inscrites dans ton livre ?\n\nMes ennemis reculent, au jour où je crie ; je sais que Dieu est pour moi.\n\nJe me glorifierai en Dieu, en sa parole ; je me glorifierai en l'Éternel, en sa parole ;\n\nje me confie en Dieu, je ne crains rien : que peuvent me faire des hommes ?\n\nÔ Dieu ! je dois accomplir les vœux que je t'ai faits ; je t'offrirai des actions de grâces.\n\nCar tu as délivré mon âme de la mort, tu as garanti mes pieds de la chute, afin que je marche devant Dieu, à la lumière des vivants.\n", "57": "Psaume 57.\n\nAu chef des chantres. Ne détruis pas. Hymne de David. Lorsqu'il se réfugia dans la caverne, poursuivi par Saül. Aie pitié de moi, ô Dieu, aie pitié de moi ! Car en toi mon âme cherche un refuge ; je cherche un refuge à l'ombre de tes ailes, jusqu'à ce que les calamités soient passées.\n\nJe crie au Dieu Très-Haut, au Dieu qui agit en ma faveur.\n\nIl m'enverra du ciel le salut, tandis que mon persécuteur se répand en outrages ; Dieu enverra sa bonté et sa fidélité.\n\nMon âme est parmi des lions ; je suis couché au milieu de gens qui vomissent la flamme, au milieu d'hommes qui ont pour dents la lance et les flèches, et dont la langue est un glaive tranchant.\n\nÉlève-toi sur les cieux, ô Dieu ! Que ta gloire soit sur toute la terre !\n\nIls avaient tendu un filet sous mes pas : mon âme se courbait ; ils avaient creusé une fosse devant moi : ils y sont tombés.\n\nMon cœur est affermi, ô Dieu ! mon cœur est affermi ; je chanterai, je ferai retentir mes instruments.\n\nRéveille-toi, mon âme ! réveillez-vous, mon luth et ma harpe ! Je réveillerai l'aurore.\n\nJe te louerai parmi les peuples, Seigneur ! Je te chanterai parmi les nations.\n\nCar ta bonté atteint jusqu'aux cieux, et ta fidélité jusqu'aux nues.\n\nÉlève-toi sur les cieux, ô Dieu ! Que ta gloire soit sur toute la terre !\n", "58": "Psaume 58.\n\nAu chef des chantres. Ne détruis pas. Hymne de David. Est-ce donc en vous taisant que vous rendez la justice ? Est-ce ainsi que vous jugez avec droiture, fils de l'homme ?\n\nLoin de là ! Dans le cœur, vous consommez des iniquités ; dans le pays, c'est la violence de vos mains que vous placez sur la balance.\n\nLes méchants sont pervertis dès le sein maternel, les menteurs s'égarent au sortir du ventre de leur mère.\n\nIls ont un venin pareil au venin d'un serpent, d'un aspic sourd qui ferme son oreille,\n\nqui n'entend pas la voix des enchanteurs, du magicien le plus habile.\n\nÔ Dieu, brise-leur les dents dans la bouche ! Éternel, arrache les mâchoires des lionceaux !\n\nQu'ils se dissipent comme des eaux qui s'écoulent ! Qu'ils ne lancent que des traits émoussés !\n\nQu'ils périssent en se fondant, comme un limaçon ; sans voir le soleil, comme l'avorton d'une femme !\n\nAvant que vos chaudières sentent l'épine, verte ou enflammée, le tourbillon l'emportera.\n\nLe juste sera dans la joie, à la vue de la vengeance ; il baignera ses pieds dans le sang des méchants.\n\nEt les hommes diront : Oui, il est une récompense pour le juste ; oui, il est un Dieu qui juge sur la terre.\n", "59": "Psaume 59.\n\nAu chef des chantres. Ne détruis pas. Hymne de David. Lorsque Saül envoya cerner la maison, pour le faire mourir. Mon Dieu ! délivre-moi de mes ennemis, protège-moi contre mes adversaires !\n\nDélivre-moi des malfaiteurs, et sauve-moi des hommes de sang !\n\nCar voici, ils sont aux aguets pour m'ôter la vie ; des hommes violents complotent contre moi, sans que je sois coupable, sans que j'aie péché, ô Éternel !\n\nMalgré mon innocence, ils courent, ils se préparent : réveille-toi, viens à ma rencontre, et regarde !\n\nToi, Éternel, Dieu des armées, Dieu d'Israël, lève-toi, pour châtier toutes les nations ! N'aie pitié d'aucun de ces méchants infidèles !\n\nIls reviennent chaque soir, ils hurlent comme des chiens, ils font le tour de la ville.\n\nVoici, de leur bouche ils font jaillir le mal, des glaives sont sur leurs lèvres ; car, qui est-ce qui entend ?\n\nEt toi, Éternel, tu te ris d'eux, tu te moques de toutes les nations.\n\nQuelle que soit leur force, c'est en toi que j'espère, car Dieu est ma haute retraite.\n\nMon Dieu vient au-devant de moi dans sa bonté, Dieu me fait contempler avec joie ceux qui me persécutent.\n\nNe les tue pas, de peur que mon peuple ne l'oublie ; fais-les errer par ta puissance, et précipite-les, Seigneur, notre bouclier !\n\nLeur bouche pèche à chaque parole de leurs lèvres : qu'ils soient pris dans leur propre orgueil ! Ils ne profèrent que malédictions et mensonges.\n\nDétruis-les, dans ta fureur, détruis-les, et qu'ils ne soient plus ! Qu'ils sachent que Dieu règne sur Jacob, jusqu'aux extrémités de la terre !\n\nIls reviennent chaque soir, ils hurlent comme des chiens, ils font le tour de la ville.\n\nIls errent çà et là, cherchant leur nourriture, et ils passent la nuit sans être rassasiés.\n\nEt moi, je chanterai ta force ; dès le matin, je célébrerai ta bonté. Car tu es pour moi une haute retraite, un refuge au jour de ma détresse.\n\nÔ ma force ! c'est toi que je célébrerai, car Dieu, mon Dieu tout bon, est ma haute retraite.\n", "60": "Psaume 60.\n\nAu chef des chantres. Sur le lis lyrique. Hymne de David, pour enseigner. Lorsqu'il fit la guerre aux Syriens de Mésopotamie et aux Syriens de Tsoba, et que Joab revint et battit dans la vallée du sel douze mille Édomites. Ô Dieu ! tu nous as repoussés, dispersés, tu t'es irrité : relève-nous !\n\nTu as ébranlé la terre, tu l'as déchirée : répare ses brèches, car elle chancelle !\n\nTu as fait voir à ton peuple des choses dures, tu nous as abreuvés d'un vin d'étourdissement.\n\nTu as donné à ceux qui te craignent une bannière, pour qu'elle s'élève à cause de la vérité.\n\nAfin que tes bien-aimés soient délivrés, sauve par ta droite, et exauce-nous !\n\nDieu a dit dans sa sainteté : je triompherai, je partagerai Sichem, je mesurerai la vallée de Succoth ;\n\nà moi Galaad, à moi Manassé ; Éphraïm est le rempart de ma tête, et Juda, mon sceptre ;\n\nMoab est le bassin où je me lave ; je jette mon soulier sur Édom ; pays des Philistins, pousse à mon sujet des cris de joie !\n\nQui me mènera dans la ville forte ? Qui me conduira à Édom ?\n\nN'est-ce pas toi, ô Dieu, qui nous as repoussés, et qui ne sortais plus, ô Dieu, avec nos armées ?\n\nDonne-nous du secours contre la détresse ! Le secours de l'homme n'est que vanité.\n\nAvec Dieu, nous ferons des exploits ; il écrasera nos ennemis.\n", "61": "Psaume 61.\n\nAu chef des chantres. Sur instruments à cordes. De David. Ô Dieu ! écoute mes cris, sois attentif à ma prière !\n\nDu bout de la terre je crie à toi, le cœur abattu ; conduis-moi sur le rocher que je ne puis atteindre !\n\nCar tu es pour moi un refuge, une tour forte, en face de l'ennemi.\n\nJe voudrais séjourner éternellement dans ta tente, me réfugier à l'abri de tes ailes.\n\nCar toi, ô Dieu ! tu exauces mes vœux, tu me donnes l'héritage de ceux qui craignent ton nom.\n\nAjoute des jours aux jours du roi ; que ses années se prolongent à jamais !\n\nQu'il reste sur le trône éternellement devant Dieu ! Fais que ta bonté et ta fidélité veillent sur lui !\n\nAlors je chanterai sans cesse ton nom, en accomplissant chaque jour mes vœux.\n", "62": "Psaume 62.\n\nAu chef des chantres. D'après Jeduthun. Psaume de David. Oui, c'est en Dieu que mon âme se confie ; de lui vient mon salut.\n\nOui, c'est lui qui est mon rocher et mon salut ; ma haute retraite : je ne chancellerai guère.\n\nJusqu'à quand vous jetterez-vous sur un homme, chercherez-vous tous à l'abattre, comme une muraille qui penche, comme une clôture qu'on renverse ?\n\nIls conspirent pour le précipiter de son poste élevé ; ils prennent plaisir au mensonge ; ils bénissent de leur bouche, et ils maudissent dans leur cœur.\n\nOui, mon âme, confie-toi en Dieu ! Car de lui vient mon espérance.\n\nOui, c'est lui qui est mon rocher et mon salut ; ma haute retraite : je ne chancellerai pas.\n\nSur Dieu reposent mon salut et ma gloire ; le rocher de ma force, mon refuge, est en Dieu.\n\nEn tout temps, peuples, confiez-vous en lui, répandez vos cœurs en sa présence ! Dieu est notre refuge,\n\noui, vanité, les fils de l'homme ! Mensonge, les fils de l'homme ! Dans une balance ils monteraient tous ensemble, plus légers qu'un souffle.\n\nNe vous confiez pas dans la violence, et ne mettez pas un vain espoir dans la rapine ; quand les richesses s'accroissent, n'y attachez pas votre cœur.\n\nDieu a parlé une fois ; deux fois j'ai entendu ceci : c'est que la force est à Dieu.\n\nÀ toi aussi, Seigneur ! la bonté ; car tu rends à chacun selon ses œuvres.\n", "63": "Psaume 63.\n\nPsaume de David. Lorsqu'il était dans le désert de Juda. Ô Dieu ! tu es mon Dieu, je te cherche ; mon âme a soif de toi, mon corps soupire après toi, dans une terre aride, desséchée, sans eau.\n\nAinsi je te contemple dans le sanctuaire, pour voir ta puissance et ta gloire.\n\nCar ta bonté vaut mieux que la vie : mes lèvres célèbrent tes louanges.\n\nJe te bénirai donc toute ma vie, j'élèverai mes mains en ton nom.\n\nMon âme sera rassasiée comme de mets gras et succulents, et, avec des cris de joie sur les lèvres, ma bouche te célébrera.\n\nLorsque je pense à toi sur ma couche, je médite sur toi pendant les veilles de la nuit.\n\nCar tu es mon secours, et je suis dans l'allégresse à l'ombre de tes ailes.\n\nMon âme est attachée à toi ; ta droite me soutient.\n\nMais ceux qui cherchent à m'ôter la vie Iront dans les profondeurs de la terre ;\n\nils seront livrés au glaive, ils seront la proie des chacals.\n\nEt le roi se réjouira en Dieu ; quiconque jure par lui s'en glorifiera, car la bouche des menteurs sera fermée.\n", "64": "Psaume 64.\n\nAu chef des chantres. Psaume de David. Ô Dieu, écoute ma voix, quand je gémis ! Protège ma vie contre l'ennemi que je crains !\n\nGarantis-moi des complots des méchants, de la troupe bruyante des hommes iniques !\n\nIls aiguisent leur langue comme un glaive, ils lancent comme des traits leurs paroles amères,\n\npour tirer en cachette sur l'innocent ; ils tirent sur lui à l'improviste, et n'ont aucune crainte.\n\nIls se fortifient dans leur méchanceté : ils se concertent pour tendre des pièges, ils disent : Qui les verra ?\n\nIls méditent des crimes : nous voici prêts, le plan est conçu ! La pensée intime, le cœur de chacun est un abîme.\n\nDieu lance contre eux ses traits : soudain les voilà frappés.\n\nLeur langue a causé leur chute ; tous ceux qui les voient secouent la tête.\n\nTous les hommes sont saisis de crainte, ils publient ce que Dieu fait, et prennent garde à son œuvre.\n\nLe juste se réjouit en l'Éternel et cherche en lui son refuge, tous ceux qui ont le cœur droit se glorifient.\n", "65": "Psaume 65.\n\nAu chef des chantres. Psaume de David. Cantique. Avec confiance, ô Dieu ! on te louera dans Sion, et l'on accomplira les vœux qu'on t'a faits.\n\nÔ toi, qui écoutes la prière ! Tous les hommes viendront à toi.\n\nLes iniquités m'accablent : tu pardonneras nos transgressions.\n\nHeureux celui que tu choisis et que tu admets en ta présence, pour qu'il habite dans tes parvis ! Nous nous rassasierons du bonheur de ta maison, de la sainteté de ton temple.\n\nDans ta bonté, tu nous exauces par des prodiges, Dieu de notre salut, espoir de toutes les extrémités lointaines de la terre et de la mer !\n\nIl affermit les montagnes par sa force, il est ceint de puissance ;\n\nil apaise le mugissement des mers, le mugissement de leurs flots, et le tumulte des peuples.\n\nCeux qui habitent aux extrémités du monde s'effraient de tes prodiges ; tu remplis d'allégresse l'orient et l'occident.\n\nTu visites la terre et tu lui donnes l'abondance, tu la combles de richesses ; le ruisseau de Dieu est plein d'eau ; tu prépares le blé, quand tu la fertilises ainsi.\n\nEn arrosant ses sillons, en aplanissant ses mottes, tu la détrempes par des pluies, tu bénis son germe.\n\nTu couronnes l'année de tes biens, et tes pas versent l'abondance ;\n\nles plaines du désert sont abreuvées, et les collines sont ceintes d'allégresse ;\n\nles pâturages se couvrent de brebis, et les vallées se revêtent de froment. Les cris de joie et les chants retentissent.\n", "66": "Psaume 66.\n\nAu chef des chantres. Cantique. Psaume. Poussez vers Dieu des cris de joie, vous tous, habitants de la terre !\n\nChantez la gloire de son nom, célébrez sa gloire par vos louanges !\n\nDites à Dieu : Que tes œuvres sont redoutables ! À cause de la grandeur de ta force, tes ennemis te flattent.\n\nToute la terre se prosterne devant toi et chante en ton honneur ; elle chante ton nom.\n\nVenez et contemplez les œuvres de Dieu ! Il est redoutable quand il agit sur les fils de l'homme.\n\nIl changea la mer en une terre sèche, on traversa le fleuve à pied : alors nous nous réjouîmes en lui.\n\nIl domine éternellement par sa puissance, ses yeux observent les nations : que les rebelles ne s'élèvent pas !\n\nPeuples, bénissez notre Dieu, faites retentir sa louange !\n\nIl a conservé la vie à notre âme, et il n'a pas permis que notre pied chancelât.\n\nCar tu nous as éprouvés, ô Dieu ! Tu nous as fait passer au creuset comme l'argent.\n\nTu nous as amenés dans le filet, tu as mis sur nos reins un pesant fardeau,\n\ntu as fait monter des hommes sur nos têtes ; nous avons passé par le feu et par l'eau. Mais tu nous en as tirés pour nous donner l'abondance.\n\nJ'irai dans ta maison avec des holocaustes, j'accomplirai mes vœux envers toi :\n\npour eux mes lèvres se sont ouvertes, et ma bouche les a prononcés dans ma détresse.\n\nJe t'offrirai des brebis grasses en holocauste, avec la graisse des béliers ; je sacrifierai des brebis avec des boucs.\n\nVenez, écoutez, vous tous qui craignez Dieu, et je raconterai ce qu'il a fait à mon âme.\n\nJ'ai crié à lui de ma bouche, et la louange a été sur ma langue.\n\nSi j'avais conçu l'iniquité dans mon cœur, le Seigneur ne m'aurait pas exaucé.\n\nMais Dieu m'a exaucé, il a été attentif à la voix de ma prière.\n\nBéni soit Dieu, qui n'a pas rejeté ma prière, et qui ne m'a pas retiré sa bonté !\n", "67": "Psaume 67.\n\nAu chef des chantres. Avec instruments à cordes. Psaume. Cantique. Que Dieu ait pitié de nous et qu'il nous bénisse, qu'il fasse luire sur nous sa face,\n\nafin que l'on connaisse sur la terre ta voie, et parmi toutes les nations ton salut !\n\nLes peuples te louent, ô Dieu ! Tous les peuples te louent.\n\nLes nations se réjouissent et sont dans l'allégresse ; car tu juges les peuples avec droiture, et tu conduis les nations sur la terre.\n\nLes peuples te louent, ô Dieu ! Tous les peuples te louent.\n\nLa terre donne ses produits ; Dieu, notre Dieu, nous bénit.\n\nDieu, nous bénit, et toutes les extrémités de la terre le craignent.\n", "68": "Psaume 68.\n\nAu chef des chantres. De David. Psaume. Cantique. Dieu se lève, ses ennemis se dispersent, et ses adversaires fuient devant sa face.\n\nComme la fumée se dissipe, tu les dissipes ; comme la cire se fond au feu, les méchants disparaissent devant Dieu.\n\nMais les justes se réjouissent, ils triomphent devant Dieu, ils ont des transports d'allégresse.\n\nChantez à Dieu, célébrez son nom ! Frayez le chemin à celui qui s'avance à travers les plaines ! L'Éternel est son nom : réjouissez-vous devant lui !\n\nLe père des orphelins, le défenseur des veuves, c'est Dieu dans sa demeure sainte.\n\nDieu donne une famille à ceux qui étaient abandonnés, il délivre les captifs et les rend heureux ; les rebelles seuls habitent des lieux arides.\n\nÔ Dieu ! quand tu sortis à la tête de ton peuple, quand tu marchais dans le désert,\n\nla terre trembla, les cieux se fondirent devant Dieu, le Sinaï s'ébranla devant Dieu, le Dieu d'Israël.\n\nTu fis tomber une pluie bienfaisante, ô Dieu ! Tu fortifias ton héritage épuisé.\n\nTon peuple établit sa demeure dans le pays que par ta bonté, ô Dieu ! tu avais préparé pour les malheureux.\n\nLe Seigneur dit une parole, et les messagères de bonnes nouvelles sont une grande armée :\n\nles rois des armées fuient, fuient, et celle qui reste à la maison partage le butin.\n\nTandis que vous reposez au milieu des étables, les ailes de la colombe sont couvertes d'argent, et son plumage est d'un jaune d'or.\n\nLorsque le Tout-Puissant dispersa les rois dans le pays, la terre devint blanche comme la neige du Tsalmon.\n\nMontagnes de Dieu, montagnes de Basan, montagnes aux cimes nombreuses, montagnes de Basan,\n\npourquoi, montagnes aux cimes nombreuses, avez-vous de l'envie contre la montagne que Dieu a voulue pour résidence ? L'Éternel n'en fera pas moins sa demeure à perpétuité.\n\nLes chars de l'Éternel se comptent par vingt mille, par milliers et par milliers ; le Seigneur est au milieu d'eux, le Sinaï est dans le sanctuaire.\n\nTu es monté dans les hauteurs, tu as emmené des captifs, tu as pris en don des hommes ; les rebelles habiteront aussi près de l'Éternel Dieu.\n\nBéni soit le Seigneur chaque jour ! Quand on nous accable, Dieu nous délivre.\n\nDieu est pour nous le Dieu des délivrances, et l'Éternel, le Seigneur, peut nous garantir de la mort.\n\nOui, Dieu brisera la tête de ses ennemis, le sommet de la tête de ceux qui vivent dans le péché.\n\nLe Seigneur dit : Je les ramènerai de Basan, je les ramènerai du fond de la mer,\n\nafin que tu plonges ton pied dans le sang, et que la langue de tes chiens ait sa part des ennemis.\n\nIls voient ta marche, ô Dieu ! La marche de mon Dieu, de mon roi, dans le sanctuaire.\n\nEn tête vont les chanteurs, puis ceux qui jouent des instruments, au milieu de jeunes filles battant du tambourin.\n\nBénissez Dieu dans les assemblées, bénissez le Seigneur, descendants d'Israël !\n\nLà sont Benjamin, le plus jeune, qui domine sur eux, les chefs de Juda et leur troupe, les chefs de Zabulon, les chefs de Nephthali.\n\nTon Dieu ordonne que tu sois puissant ; affermis, ô Dieu, ce que tu as fait pour nous !\n\nDe ton temple tu règnes sur Jérusalem ; les rois t'apporteront des présents.\n\nÉpouvante l'animal des roseaux, la troupe des taureaux avec les veaux des peuples, qui se prosternent avec des pièces d'argent ! Disperse les peuples qui prennent plaisir à combattre !\n\nDes grands viennent de l'Égypte ; l'Éthiopie accourt, les mains tendues vers Dieu.\n\nRoyaumes de la terre, chantez à Dieu, célébrez le Seigneur !\n\nChantez à celui qui s'avance dans les cieux, les cieux éternels ! Voici, il fait entendre sa voix, sa voix puissante.\n\nRendez gloire à Dieu ! Sa majesté est sur Israël, et sa force dans les cieux.\n\nDe ton sanctuaire, ô Dieu ! tu es redoutable. Le Dieu d'Israël donne à son peuple la force et la puissance. Béni soit Dieu !\n", "69": "Psaume 69.\n\nAu chef des chantres. Sur les lis. De David. Sauve-moi, ô Dieu ! Car les eaux menacent ma vie.\n\nJ'enfonce dans la boue, sans pouvoir me tenir ; je suis tombé dans un gouffre, et les eaux m'inondent.\n\nJe m'épuise à crier, mon gosier se dessèche, mes yeux se consument, tandis que je regarde vers mon Dieu.\n\nIls sont plus nombreux que les cheveux de ma tête, ceux qui me haïssent sans cause ; ils sont puissants, ceux qui veulent me perdre, qui sont à tort mes ennemis. Ce que je n'ai pas dérobé, il faut que je le restitue.\n\nÔ Dieu ! tu connais ma folie, et mes fautes ne te sont point cachées.\n\nQue ceux qui espèrent en toi ne soient pas confus à cause de moi, Seigneur, Éternel des armées ! Que ceux qui te cherchent ne soient pas dans la honte à cause de moi, Dieu d'Israël !\n\nCar c'est pour toi que je porte l'opprobre, que la honte couvre mon visage ;\n\nje suis devenu un étranger pour mes frères, un inconnu pour les fils de ma mère.\n\nCar le zèle de ta maison me dévore, et les outrages de ceux qui t'insultent tombent sur moi.\n\nJe verse des larmes et je jeûne, et c'est ce qui m'attire l'opprobre ;\n\nje prends un sac pour vêtement, et je suis l'objet de leurs sarcasmes.\n\nCeux qui sont assis à la porte parlent de moi, et les buveurs de liqueurs fortes me mettent en chansons.\n\nMais je t'adresse ma prière, ô Éternel ! Que ce soit le temps favorable, ô Dieu, par ta grande bonté ! Réponds-moi, en m'assurant ton secours !\n\nRetire-moi de la boue, et que je n'enfonce plus ! Que je sois délivré de mes ennemis et du gouffre !\n\nQue les flots ne m'inondent plus, que l'abîme ne m'engloutisse pas, et que la fosse ne se ferme pas sur moi !\n\nExauce-moi, Éternel ! car ta bonté est immense. Dans tes grandes compassions, tourne vers moi les regards,\n\net ne cache pas ta face à ton serviteur ! Puisque je suis dans la détresse, hâte-toi de m'exaucer !\n\nApproche-toi de mon âme, délivre-la ! Sauve-moi, à cause de mes ennemis !\n\nTu connais mon opprobre, ma honte, mon ignominie ; tous mes adversaires sont devant toi.\n\nL'opprobre me brise le cœur, et je suis malade ; j'attends de la pitié, mais en vain, des consolateurs, et je n'en trouve aucun.\n\nIls mettent du fiel dans ma nourriture, et, pour apaiser ma soif, ils m'abreuvent de vinaigre.\n\nQue leur table soit pour eux un piège, et un filet au sein de leur sécurité !\n\nQue leurs yeux s'obscurcissent et ne voient plus, et fais continuellement chanceler leurs reins !\n\nRépands sur eux ta colère, et que ton ardente fureur les atteigne !\n\nQue leur demeure soit dévastée, qu'il n'y ait plus d'habitants dans leurs tentes !\n\nCar ils persécutent celui que tu frappes, ils racontent les souffrances de ceux que tu blesses.\n\nAjoute des iniquités à leurs iniquités, et qu'ils n'aient point part à ta miséricorde !\n\nQu'ils soient effacés du livre de vie, et qu'ils ne soient point inscrits avec les justes !\n\nMoi, je suis malheureux et souffrant : Ô Dieu, que ton secours me relève !\n\nJe célébrerai le nom de Dieu par des cantiques, je l'exalterai par des louanges.\n\nCela est agréable à l'Éternel, plus qu'un taureau avec des cornes et des sabots.\n\nLes malheureux le voient et se réjouissent ; vous qui cherchez Dieu, que votre cœur vive !\n\nCar l'Éternel écoute les pauvres, et il ne méprise point ses captifs.\n\nQue les cieux et la terre le célèbrent, les mers et tout ce qui s'y meut !\n\nCar Dieu sauvera Sion, et bâtira les villes de Juda ; on s'y établira, et l'on en prendra possession ;\n\nla postérité de ses serviteurs en fera son héritage, et ceux qui aiment son nom y auront leur demeure.\n", "70": "Psaume 70.\n\nAu chef des chantres. De David. Pour souvenir. Ô Dieu, hâte-toi de me délivrer ! Éternel, hâte-toi de me secourir !\n\nQu'ils soient honteux et confus, ceux qui en veulent à ma vie ! Qu'ils reculent et rougissent, ceux qui désirent ma perte !\n\nQu'ils retournent en arrière par l'effet de leur honte, ceux qui disent : Ah ! ah !\n\nQue tous ceux qui te cherchent soient dans l'allégresse et se réjouissent en toi ! Que ceux qui aiment ton salut disent sans cesse : exalté soit Dieu !\n\nMoi, je suis pauvre et indigent : Ô Dieu, hâte-toi en ma faveur ! Tu es mon aide et mon libérateur : Éternel, ne tarde pas !\n", "71": "Psaume 71.\n\nÉternel ! je cherche en toi mon refuge : que jamais je ne sois confondu !\n\nDans ta justice, sauve-moi et délivre-moi ! Incline vers moi ton oreille, et secours-moi !\n\nSois pour moi un rocher qui me serve d'asile, où je puisse toujours me retirer ! Tu as résolu de me sauver, car tu es mon rocher et ma forteresse.\n\nMon Dieu, délivre-moi de la main du méchant, de la main de l'homme inique et violent !\n\nCar tu es mon espérance, Seigneur Éternel ! En toi je me confie dès ma jeunesse.\n\nDès le ventre de ma mère je m'appuie sur toi ; c'est toi qui m'as fait sortir du sein maternel ; tu es sans cesse l'objet de mes louanges.\n\nJe suis pour plusieurs comme un prodige, et toi, tu es mon puissant refuge.\n\nQue ma bouche soit remplie de tes louanges, que chaque jour elle te glorifie !\n\nNe me rejette pas au temps de la vieillesse ; quand mes forces s'en vont, ne m'abandonne pas !\n\nCar mes ennemis parlent de moi, et ceux qui guettent ma vie se consultent entre eux,\n\ndisant : Dieu l'abandonne ; poursuivez, saisissez-le ; il n'y a personne pour le délivrer.\n\nÔ Dieu, ne t'éloigne pas de moi ! Mon Dieu, viens en hâte à mon secours !\n\nQu'ils soient confus, anéantis, ceux qui en veulent à ma vie ! Qu'ils soient couverts de honte et d'opprobre, ceux qui cherchent ma perte !\n\nEt moi, j'espérerai toujours, je te louerai de plus en plus.\n\nMa bouche publiera ta justice, ton salut, chaque jour, car j'ignore quelles en sont les bornes.\n\nJe dirai tes œuvres puissantes, Seigneur Éternel ! Je rappellerai ta justice, la tienne seule.\n\nÔ Dieu ! tu m'as instruit dès ma jeunesse, et jusqu'à présent j'annonce tes merveilles.\n\nNe m'abandonne pas, ô Dieu ! même dans la blanche vieillesse, afin que j'annonce ta force à la génération présente, ta puissance à la génération future !\n\nTa justice, ô Dieu ! atteint jusqu'au ciel ; tu as accompli de grandes choses : ô Dieu ! qui est semblable à toi ?\n\nTu nous as fait éprouver bien des détresses et des malheurs ; mais tu nous redonneras la vie, tu nous feras remonter des abîmes de la terre.\n\nRelève ma grandeur, console-moi de nouveau !\n\nEt je te louerai au son du luth, je chanterai ta fidélité, mon Dieu, je te célébrerai avec la harpe, Saint d'Israël !\n\nEn te célébrant, j'aurai la joie sur les lèvres, la joie dans mon âme que tu as délivrée ;\n\nma langue chaque jour publiera ta justice, car ceux qui cherchent ma perte sont honteux et confus.\n", "72": "Psaume 72.\n\nDe salomon. Ô Dieu, donne tes jugements au roi, et ta justice au fils du roi !\n\nIl jugera ton peuple avec justice, et tes malheureux avec équité.\n\nLes montagnes porteront la paix pour le peuple, et les collines aussi, par l'effet de ta justice.\n\nIl fera droit aux malheureux du peuple, il sauvera les enfants du pauvre, et il écrasera l'oppresseur.\n\nOn te craindra, tant que subsistera le soleil, tant que paraîtra la lune, de génération en génération.\n\nIl sera comme une pluie qui tombe sur un terrain fauché, comme des ondées qui arrosent la campagne.\n\nEn ses jours le juste fleurira, et la paix sera grande jusqu'à ce qu'il n'y ait plus de lune.\n\nIl dominera d'une mer à l'autre, et du fleuve aux extrémités de la terre.\n\nDevant lui, les habitants du désert fléchiront le genou, et ses ennemis lécheront la poussière.\n\nLes rois de Tarsis et des îles paieront des tributs, les rois de Séba et de Saba offriront des présents.\n\nTous les rois se prosterneront devant lui, toutes les nations le serviront.\n\nCar il délivrera le pauvre qui crie, et le malheureux qui n'a point d'aide.\n\nIl aura pitié du misérable et de l'indigent, et il sauvera la vie des pauvres ;\n\nil les affranchira de l'oppression et de la violence, et leur sang aura du prix à ses yeux.\n\nIls vivront, et lui donneront de l'or de Séba ; ils prieront pour lui sans cesse, ils le béniront chaque jour.\n\nLes blés abonderont dans le pays, au sommet des montagnes, et leurs épis s'agiteront comme les arbres du Liban ; les hommes fleuriront dans les villes comme l'herbe de la terre.\n\nSon nom subsistera toujours, aussi longtemps que le soleil son nom se perpétuera ; par lui on se bénira mutuellement, et toutes les nations le diront heureux.\n\nBéni soit l'Éternel Dieu, le Dieu d'Israël, qui seul fait des prodiges !\n\nBéni soit à jamais son nom glorieux ! Que toute la terre soit remplie de sa gloire ! Amen ! Amen !\n\nFin des prières de David, fils d'Isaï.\n", "73": "Psaume 73.\n\nPsaume d'Asaph. Oui, Dieu est bon pour Israël, pour ceux qui ont le cœur pur.\n\nToutefois, mon pied allait fléchir, mes pas étaient sur le point de glisser ;\n\ncar je portais envie aux insensés, en voyant le bonheur des méchants.\n\nRien ne les tourmente jusqu'à leur mort, et leur corps est chargé d'embonpoint ;\n\nils n'ont aucune part aux souffrances humaines, ils ne sont point frappés comme le reste des hommes.\n\nAussi l'orgueil leur sert de collier, la violence est le vêtement qui les enveloppe ;\n\nl'iniquité sort de leurs entrailles, les pensées de leur cœur se font jour.\n\nIls raillent, et parlent méchamment d'opprimer ; ils profèrent des discours hautains,\n\nils élèvent leur bouche jusqu'aux cieux, et leur langue se promène sur la terre.\n\nVoilà pourquoi son peuple se tourne de leur côté, il avale l'eau abondamment,\n\net il dit : Comment Dieu saurait-il, comment le Très-Haut connaîtrait-il ?\n\nAinsi sont les méchants : toujours heureux, ils accroissent leurs richesses.\n\nC'est donc en vain que j'ai purifié mon cœur, et que j'ai lavé mes mains dans l'innocence :\n\nchaque jour je suis frappé, tous les matins mon châtiment est là.\n\nSi je disais : Je veux parler comme eux, voici, je trahirais la race de tes enfants.\n\nQuand j'ai réfléchi là-dessus pour m'éclairer, la difficulté fut grande à mes yeux,\n\njusqu'à ce que j'eusse pénétré dans les sanctuaires de Dieu, et que j'eusse pris garde au sort final des méchants.\n\nOui, tu les places sur des voies glissantes, tu les fais tomber et les mets en ruines.\n\nEh quoi ! en un instant les voilà détruits ! Ils sont enlevés, anéantis par une fin soudaine !\n\nComme un songe au réveil, Seigneur, à ton réveil, tu repousses leur image.\n\nLorsque mon cœur s'aigrissait, et que je me sentais percé dans les entrailles,\n\nj'étais stupide et sans intelligence, j'étais à ton égard comme les bêtes.\n\nCependant je suis toujours avec toi, tu m'as saisi la main droite ;\n\ntu me conduiras par ton conseil, puis tu me recevras dans la gloire.\n\nQuel autre ai-je au ciel que toi ! Et sur la terre je ne prends plaisir qu'en toi.\n\nMa chair et mon cœur peuvent se consumer : Dieu sera toujours le rocher de mon cœur et mon partage.\n\nCar voici, ceux qui s'éloignent de toi périssent ; tu anéantis tous ceux qui te sont infidèles.\n\nPour moi, m'approcher de Dieu, c'est mon bien : je place mon refuge dans le Seigneur, l'Éternel, afin de raconter toutes tes œuvres.\n", "74": "Psaume 74.\n\nCantique d'Asaph. Pourquoi, ô Dieu ! rejettes-tu pour toujours ? Pourquoi t'irrites-tu contre le troupeau de ton pâturage ?\n\nSouviens-toi de ton peuple que tu as acquis autrefois, que tu as racheté comme la tribu de ton héritage ! Souviens-toi de la montagne de Sion, où tu faisais ta résidence ;\n\nporte tes pas vers ces lieux constamment dévastés ! L'ennemi a tout ravagé dans le sanctuaire.\n\nTes adversaires ont rugi au milieu de ton temple ; ils ont établi pour signes leurs signes.\n\nOn les a vus, pareils à celui qui lève la cognée dans une épaisse forêt ;\n\net bientôt ils ont brisé toutes les sculptures, à coups de haches et de marteaux.\n\nIls ont mis le feu à ton sanctuaire ; ils ont abattu, profané la demeure de ton nom.\n\nIls disaient en leur cœur : traitons-les tous avec violence ! Ils ont brûlé dans le pays tous les lieux saints.\n\nNous ne voyons plus nos signes ; il n'y a plus de prophète, et personne parmi nous qui sache jusqu'à quand...\n\nJusqu'à quand, ô Dieu ! l'oppresseur outragera-t-il, l'ennemi méprisera-t-il sans cesse ton nom ?\n\nPourquoi retires-tu ta main et ta droite ? Sors-la de ton sein ! détruis !\n\nDieu est mon roi dès les temps anciens, lui qui opère des délivrances au milieu de la terre.\n\nTu as fendu la mer par ta puissance, tu as brisé les têtes des monstres sur les eaux ;\n\ntu as écrasé la tête du crocodile, tu l'as donné pour nourriture au peuple du désert.\n\nTu as fait jaillir des sources et des torrents. Tu as mis à sec des fleuves qui ne tarissent point.\n\nÀ toi est le jour, à toi est la nuit ; tu as créé la lumière et le soleil.\n\nTu as fixé toutes les limites de la terre, tu as établi l'été et l'hiver.\n\nSouviens-toi que l'ennemi outrage l'Éternel, et qu'un peuple insensé méprise ton nom !\n\nNe livre pas aux bêtes l'âme de ta tourterelle, n'oublie pas à toujours la vie de tes malheureux !\n\nAie égard à l'alliance ! Car les lieux sombres du pays sont pleins de repaires de brigands.\n\nQue l'opprimé ne retourne pas confus ! Que le malheureux et le pauvre célèbrent ton nom !\n\nLève-toi, ô Dieu ! défends ta cause ! Souviens-toi des outrages que te fait chaque jour l'insensé !\n\nN'oublie pas les clameurs de tes adversaires, le tumulte sans cesse croissant de ceux qui s'élèvent contre toi !\n", "75": "Psaume 75.\n\nAu chef des chantres. Ne détruis pas. Psaume d'Asaph. Cantique. Nous te louons, ô Dieu ! nous te louons ; ton nom est dans nos bouches ; nous publions tes merveilles.\n\nAu temps que j'aurai fixé, je jugerai avec droiture.\n\nLa terre tremble avec tous ceux qui l'habitent : moi, j'affermis ses colonnes.\n\nJe dis à ceux qui se glorifient : ne vous glorifiez pas ! Et aux méchants : n'élevez pas la tête !\n\nN'élevez pas si haut votre tête, ne parlez pas avec tant d'arrogance !\n\nCar ce n'est ni de l'orient, ni de l'occident, ni du désert, que vient l'élévation.\n\nMais Dieu est celui qui juge : il abaisse l'un, et il élève l'autre.\n\nIl y a dans la main de l'Éternel une coupe, où fermente un vin plein de mélange, et il en verse : tous les méchants de la terre sucent, boivent jusqu'à la lie.\n\nJe publierai ces choses à jamais ; je chanterai en l'honneur du Dieu de Jacob.\n\nEt j'abattrai toutes les forces des méchants ; les forces du juste seront élevées.\n", "76": "Psaume 76.\n\nAu chef des chantres. Avec instruments à cordes. Psaume d'Asaph. Cantique. Dieu est connu en Juda, son nom est grand en Israël.\n\nSa tente est à Salem, et sa demeure à Sion.\n\nC'est là qu'il a brisé les flèches, le bouclier, l'épée et les armes de guerre.\n\nTu es plus majestueux, plus puissant que les montagnes des ravisseurs.\n\nIls ont été dépouillés, ces héros pleins de courage, ils se sont endormis de leur dernier sommeil ; ils n'ont pas su se défendre, tous ces vaillants hommes.\n\nÀ ta menace, Dieu de Jacob ! Ils se sont endormis, cavaliers et chevaux.\n\nTu es redoutable, ô toi ! Qui peut te résister, quand ta colère éclate ?\n\nDu haut des cieux tu as proclamé la sentence ; la terre effrayée s'est tenue tranquille,\n\nlorsque Dieu s'est levé pour faire justice, pour sauver tous les malheureux de la terre.\n\nL'homme te célèbre même dans sa fureur, quand tu te revêts de tout ton courroux.\n\nFaites des vœux à l'Éternel, votre Dieu, et accomplissez-les ! Que tous ceux qui l'environnent apportent des dons au Dieu terrible !\n\nIl abat l'orgueil des princes, il est redoutable aux rois de la terre.\n", "77": "Psaume 77.\n\nAu chef des chantres. D'après Jeduthun. Psaume d'Asaph. Ma voix s'élève à Dieu, et je crie ; ma voix s'élève à Dieu, et il m'écoutera.\n\nAu jour de ma détresse, je cherche le Seigneur ; la nuit, mes mains sont étendues sans se lasser ; mon âme refuse toute consolation.\n\nJe me souviens de Dieu, et je gémis ; je médite, et mon esprit est abattu.\n\nTu tiens mes paupières en éveil ; et, dans mon trouble, je ne puis parler.\n\nJe pense aux jours anciens, aux années d'autrefois.\n\nJe pense à mes cantiques pendant la nuit, je fais des réflexions au dedans de mon cœur, et mon esprit médite.\n\nLe Seigneur rejettera-t-il pour toujours ? Ne sera-t-il plus favorable ?\n\nSa bonté est-elle à jamais épuisée ? Sa parole est-elle anéantie pour l'éternité ?\n\nDieu a-t-il oublié d'avoir compassion ? À-t-il, dans sa colère, retiré sa miséricorde ?\n\nJe dis : Ce qui fait ma souffrance, c'est que la droite du Très-Haut n'est plus la même...\n\nJe rappellerai les œuvres de l'Éternel, car je me souviens de tes merveilles d'autrefois ;\n\nje parlerai de toutes tes œuvres, je raconterai tes hauts faits.\n\nÔ Dieu ! tes voies sont saintes ; quel dieu est grand comme Dieu ?\n\nTu es le Dieu qui fait des prodiges ; tu as manifesté parmi les peuples ta puissance.\n\nPar ton bras tu as délivré ton peuple, les fils de Jacob et de Joseph.\n\nLes eaux t'ont vu, ô Dieu ! Les eaux t'ont vu, elles ont tremblé ; les abîmes se sont émus.\n\nLes nuages versèrent de l'eau par torrents, le tonnerre retentit dans les nues, et tes flèches volèrent de toutes parts.\n\nTon tonnerre éclata dans le tourbillon, les éclairs illuminèrent le monde ; la terre s'émut et trembla.\n\nTu te frayas un chemin par la mer, un sentier par les grandes eaux, et tes traces ne furent plus reconnues.\n\nTu as conduit ton peuple comme un troupeau, par la main de Moïse et d'Aaron.\n", "78": "Psaume 78.\n\nCantique d'Asaph. Mon peuple, écoute mes instructions ! Prêtez l'oreille aux paroles de ma bouche !\n\nJ'ouvre la bouche par des sentences, je publie la sagesse des temps anciens.\n\nCe que nous avons entendu, ce que nous savons, ce que nos pères nous ont raconté,\n\nnous ne le cacherons point à leurs enfants ; nous dirons à la génération future les louanges de l'Éternel, et sa puissance, et les prodiges qu'il a opérés.\n\nIl a établi un témoignage en Jacob, il a mis une loi en Israël, et il a ordonné à nos pères de l'enseigner à leurs enfants,\n\npour qu'elle fût connue de la génération future, des enfants qui naîtraient, et que, devenus grands, ils en parlassent à leurs enfants,\n\nafin qu'ils missent en Dieu leur confiance, qu'ils n'oubliassent pas les œuvres de Dieu, et qu'ils observassent ses commandements,\n\nafin qu'ils ne fussent pas, comme leurs pères, une race indocile et rebelle, une race dont le cœur n'était pas ferme, et dont l'esprit n'était pas fidèle à Dieu.\n\nLes fils d'Éphraïm, armés et tirant de l'arc, tournèrent le dos le jour du combat.\n\nIls ne gardèrent point l'alliance de Dieu, et ils refusèrent de marcher selon sa loi.\n\nIls mirent en oubli ses œuvres, ses merveilles qu'il leur avait fait voir.\n\nDevant leurs pères il avait fait des prodiges, au pays d'Égypte, dans les campagnes de Tsoan.\n\nIl fendit la mer et leur ouvrit un passage, il fit dresser les eaux comme une muraille.\n\nIl les conduisit le jour par la nuée, et toute la nuit par un feu éclatant.\n\nIl fendit des rochers dans le désert, et il donna à boire comme des flots abondants ;\n\ndu rocher il fit jaillir des sources, et couler des eaux comme des fleuves.\n\nMais ils continuèrent à pécher contre lui, à se révolter contre le Très-Haut dans le désert.\n\nIls tentèrent Dieu dans leur cœur, en demandant de la nourriture selon leur désir.\n\nIls parlèrent contre Dieu, ils dirent : Dieu pourrait-il dresser une table dans le désert ?\n\nVoici, il a frappé le rocher, et des eaux ont coulé, et des torrents se sont répandus ; pourra-t-il aussi donner du pain, ou fournir de la viande à son peuple ?\n\nL'Éternel entendit, et il fut irrité ; un feu s'alluma contre Jacob, et la colère s'éleva contre Israël,\n\nparce qu'ils ne crurent pas en Dieu, parce qu'ils n'eurent pas confiance dans son secours.\n\nIl commanda aux nuages d'en haut, et il ouvrit les portes des cieux ;\n\nil fit pleuvoir sur eux la manne pour nourriture, il leur donna le blé du ciel.\n\nIls mangèrent tous le pain des grands, il leur envoya de la nourriture à satiété.\n\nIl fit souffler dans les cieux le vent d'orient, et il amena par sa puissance le vent du midi ;\n\nil fit pleuvoir sur eux la viande comme de la poussière, et comme le sable des mers les oiseaux ailés ;\n\nil les fit tomber au milieu de leur camp, tout autour de leurs demeures.\n\nIls mangèrent et se rassasièrent abondamment : Dieu leur donna ce qu'ils avaient désiré.\n\nIls n'avaient pas satisfait leur désir, ils avaient encore leur nourriture dans la bouche,\n\nlorsque la colère de Dieu s'éleva contre eux ; il frappa de mort les plus vigoureux, il abattit les jeunes hommes d'Israël.\n\nMalgré tout cela, ils continuèrent à pécher, et ne crurent point à ses prodiges.\n\nIl consuma leurs jours par la vanité, et leurs années par une fin soudaine.\n\nQuand il les frappait de mort, ils le cherchaient, ils revenaient et se tournaient vers Dieu ;\n\nils se souvenaient que Dieu était leur rocher, que le Dieu Très-Haut était leur libérateur.\n\nMais ils le trompaient de la bouche, et ils lui mentaient de la langue ;\n\nleur cœur n'était pas ferme envers lui, et ils n'étaient pas fidèles à son alliance.\n\nToutefois, dans sa miséricorde, il pardonne l'iniquité et ne détruit pas ; il retient souvent sa colère et ne se livre pas à toute sa fureur.\n\nIl se souvint qu'ils n'étaient que chair, un souffle qui s'en va et ne revient pas.\n\nQue de fois ils se révoltèrent contre lui dans le désert ! Que de fois ils l'irritèrent dans la solitude !\n\nIls ne cessèrent de tenter Dieu, et de provoquer le Saint d'Israël.\n\nIls ne se souvinrent pas de sa puissance, du jour où il les délivra de l'ennemi,\n\ndes miracles qu'il accomplit en Égypte, et de ses prodiges dans les campagnes de Tsoan.\n\nIl changea leurs fleuves en sang, et ils ne purent en boire les eaux.\n\nIl envoya contre eux des mouches venimeuses qui les dévorèrent, et des grenouilles qui les détruisirent.\n\nIl livra leurs récoltes aux sauterelles, le produit de leur travail aux sauterelles.\n\nIl fit périr leurs vignes par la grêle, et leurs sycomores par la gelée.\n\nIl abandonna leur bétail à la grêle, et leurs troupeaux au feu du ciel.\n\nIl lança contre eux son ardente colère, la fureur, la rage et la détresse, une troupe de messagers de malheur.\n\nIl donna libre cours à sa colère, il ne sauva pas leur âme de la mort, il livra leur vie à la mortalité ;\n\nil frappa tous les premiers-nés en Égypte, les prémices de la force sous les tentes de Cham.\n\nIl fit partir son peuple comme des brebis, il les conduisit comme un troupeau dans le désert.\n\nIl les dirigea sûrement, pour qu'ils fussent sans crainte, et la mer couvrit leurs ennemis.\n\nIl les amena vers sa frontière sainte, vers cette montagne que sa droite a acquise.\n\nIl chassa devant eux les nations, leur distribua le pays en héritage, et fit habiter dans leurs tentes les tribus d'Israël.\n\nMais ils tentèrent le Dieu Très-Haut et se révoltèrent contre lui, et ils n'observèrent point ses ordonnances.\n\nIls s'éloignèrent et furent infidèles, comme leurs pères, ils tournèrent, comme un arc trompeur.\n\nIls l'irritèrent par leurs hauts lieux, et ils excitèrent sa jalousie par leurs idoles.\n\nDieu entendit, et il fut irrité ; il repoussa fortement Israël.\n\nIl abandonna la demeure de Silo, la tente où il habitait parmi les hommes ;\n\nil livra sa gloire à la captivité, et sa majesté entre les mains de l'ennemi.\n\nIl mit son peuple à la merci du glaive, et il s'indigna contre son héritage.\n\nLe feu dévora ses jeunes hommes, et ses vierges ne furent pas célébrées ;\n\nses sacrificateurs tombèrent par l'épée, et ses veuves ne pleurèrent pas.\n\nLe Seigneur s'éveilla comme celui qui a dormi, comme un héros qu'a subjugué le vin.\n\nIl frappa ses adversaires en fuite, il les couvrit d'un opprobre éternel.\n\nCependant il rejeta la tente de Joseph, et il ne choisit point la tribu d'Éphraïm ;\n\nil préféra la tribu de Juda, la montagne de Sion qu'il aimait.\n\nEt il bâtit son sanctuaire comme les lieux élevés, comme la terre qu'il a fondée pour toujours.\n\nIl choisit David, son serviteur, et il le tira des bergeries ;\n\nil le prit derrière les brebis qui allaitent, pour lui faire paître Jacob, son peuple, et Israël, son héritage.\n\nEt David les dirigea avec un cœur intègre, et les conduisit avec des mains intelligentes.\n", "79": "Psaume 79.\n\nPsaume d'Asaph. Ô Dieu ! les nations ont envahi ton héritage, elles ont profané ton saint temple, elles ont fait de Jérusalem un monceau de pierres.\n\nElles ont livré les cadavres de tes serviteurs en pâture aux oiseaux du ciel, la chair de tes fidèles aux bêtes de la terre ;\n\nelles ont versé leur sang comme de l'eau tout autour de Jérusalem, et il n'y a eu personne pour les enterrer.\n\nNous sommes devenus un objet d'opprobre pour nos voisins, de moquerie et de risée pour ceux qui nous entourent.\n\nJusques à quand, Éternel ! t'irriteras-tu sans cesse, et ta colère s'embrasera-t-elle comme le feu ?\n\nRépands ta fureur sur les nations qui ne te connaissent pas, et sur les royaumes qui n'invoquent pas ton nom !\n\nCar on a dévoré Jacob, et ravagé sa demeure.\n\nNe te souviens plus de nos iniquités passées ! Que tes compassions viennent en hâte au-devant de nous ! Car nous sommes bien malheureux.\n\nSecours-nous, Dieu de notre salut, pour la gloire de ton nom ! Délivre-nous, et pardonne nos péchés, à cause de ton nom !\n\nPourquoi les nations diraient-elles : où est leur Dieu ? Qu'on sache, en notre présence, parmi les nations, que tu venges le sang de tes serviteurs, le sang répandu !\n\nQue les gémissements des captifs parviennent jusqu'à toi ! Par ton bras puissant sauve ceux qui vont périr !\n\nRends à nos voisins sept fois dans leur sein les outrages qu'ils t'ont faits, Seigneur !\n\nEt nous, ton peuple, le troupeau de ton pâturage, nous te célébrerons éternellement ; de génération en génération nous publierons tes louanges.\n", "80": "Psaume 80.\n\nAu chef des chantres. Sur les lis lyriques. D'Asaph. Psaume. Prête l'oreille, berger d'Israël, toi qui conduis Joseph comme un troupeau ! Parais dans ta splendeur, toi qui es assis sur les chérubins !\n\nDevant Éphraïm, Benjamin et Manassé, réveille ta force, et viens à notre secours !\n\nÔ Dieu, relève-nous ! Fais briller ta face, et nous serons sauvés !\n\nÉternel, Dieu des armées ! Jusques à quand t'irriteras-tu contre la prière de ton peuple ?\n\nTu les nourris d'un pain de larmes. Tu les abreuves de larmes à pleine mesure.\n\nTu fais de nous un objet de discorde pour nos voisins, et nos ennemis se raillent de nous.\n\nDieu des armées, relève-nous ! Fais briller ta face, et nous serons sauvés !\n\nTu avais arraché de l'Égypte une vigne ; tu as chassé des nations, et tu l'as plantée.\n\nTu as fait place devant elle : elle a jeté des racines et rempli la terre ;\n\nles montagnes étaient couvertes de son ombre, et ses rameaux étaient comme des cèdres de Dieu ;\n\nelle étendait ses branches jusqu'à la mer, et ses rejetons jusqu'au fleuve.\n\nPourquoi as-tu rompu ses clôtures, en sorte que tous les passants la dépouillent ?\n\nLe sanglier de la forêt la ronge, et les bêtes des champs en font leur pâture.\n\nDieu des armées, reviens donc ! Regarde du haut des cieux, et vois ! considère cette vigne !\n\nProtège ce que ta droite a planté, et le fils que tu t'es choisi !...\n\nElle est brûlée par le feu, elle est coupée ! Ils périssent devant ta face menaçante.\n\nQue ta main soit sur l'homme de ta droite, sur le fils de l'homme que tu t'es choisi !\n\nEt nous ne nous éloignerons plus de toi. Fais-nous revivre, et nous invoquerons ton nom.\n\nÉternel, Dieu des armées, relève-nous ! Fais briller ta face, et nous serons sauvés !\n", "81": "Psaume 81.\n\nAu chef des chantres. Sur la guitthith. D'Asaph. Chantez avec allégresse à Dieu, notre force ! Poussez des cris de joie vers le Dieu de Jacob !\n\nEntonnez des cantiques, faites résonner le tambourin, la harpe mélodieuse et le luth !\n\nSonnez de la trompette à la nouvelle lune, à la pleine lune, au jour de notre fête !\n\nCar c'est une loi pour Israël, une ordonnance du Dieu de Jacob.\n\nIl en fit un statut pour Joseph, quand il marcha contre le pays d'Égypte... J'entends une voix qui m'est inconnue :\n\nj'ai déchargé son épaule du fardeau, et ses mains ont lâché la corbeille.\n\nTu as crié dans la détresse, et je t'ai délivré ; je t'ai répondu dans la retraite du tonnerre ; je t'ai éprouvé près des eaux de Meriba.\n\nÉcoute, mon peuple ! et je t'avertirai ; Israël, puisses-tu m'écouter !\n\nQu'il n'y ait au milieu de toi point de dieu étranger ! Ne te prosterne pas devant des dieux étrangers !\n\nJe suis l'Éternel, ton Dieu, qui t'ai fait monter du pays d'Égypte ; ouvre ta bouche, et je la remplirai.\n\nMais mon peuple n'a point écouté ma voix, Israël ne m'a point obéi.\n\nAlors je les ai livrés aux penchants de leur cœur, et ils ont suivi leurs propres conseils.\n\nOh ! si mon peuple m'écoutait, si Israël marchait dans mes voies !\n\nEn un instant je confondrais leurs ennemis, je tournerais ma main contre leurs adversaires ;\n\nceux qui haïssent l'Éternel le flatteraient, et le bonheur d'Israël durerait toujours ;\n\nje le nourrirais du meilleur froment, et je le rassasierais du miel du rocher.\n", "82": "Psaume 82.\n\nPsaume d'Asaph. Dieu se tient dans l'assemblée de Dieu ; il juge au milieu des dieux.\n\nJusques à quand jugerez-vous avec iniquité, et aurez-vous égard à la personne des méchants ?\n\nRendez justice au faible et à l'orphelin, faites droit au malheureux et au pauvre,\n\nsauvez le misérable et l'indigent, délivrez-les de la main des méchants.\n\nIls n'ont ni savoir ni intelligence, ils marchent dans les ténèbres ; tous les fondements de la terre sont ébranlés.\n\nJ'avais dit : Vous êtes des dieux, vous êtes tous des fils du Très-Haut.\n\nCependant vous mourrez comme des hommes, vous tomberez comme un prince quelconque.\n\nLève-toi, ô Dieu, juge la terre ! Car toutes les nations t'appartiennent.\n", "83": "Psaume 83.\n\nCantique. Psaume d'Asaph. Ô Dieu, ne reste pas dans le silence ! Ne te tais pas, et ne te repose pas, ô Dieu !\n\nCar voici, tes ennemis s'agitent, ceux qui te haïssent lèvent la tête.\n\nIls forment contre ton peuple des projets pleins de ruse, et ils délibèrent contre ceux que tu protèges.\n\nVenez, disent-ils, exterminons-les du milieu des nations, et qu'on ne se souvienne plus du nom d'Israël !\n\nIls se concertent tous d'un même cœur, ils font une alliance contre toi ;\n\nles tentes d'Édom et les Ismaélites, Moab et les Hagaréniens,\n\nGuebal, Ammon, Amalek, les Philistins avec les habitants de Tyr ;\n\nl'Assyrie aussi se joint à eux, elle prête son bras aux enfants de Lot.\n\nTraite-les comme Madian, comme sisera, comme Jabin au torrent de Kison !\n\nIls ont été détruits à En-Dor, ils sont devenus du fumier pour la terre.\n\nTraite leurs chefs comme Oreb et Zeeb, et tous leurs princes comme Zébach et Tsalmunna !\n\nCar ils disent : Emparons-nous des demeures de Dieu !\n\nMon Dieu ! rends-les semblables au tourbillon, au chaume qu'emporte le vent,\n\nau feu qui brûle la forêt, à la flamme qui embrase les montagnes !\n\nPoursuis-les ainsi de ta tempête, et fais-les trembler par ton ouragan !\n\nCouvre leur face d'ignominie, afin qu'ils cherchent ton nom, ô Éternel !\n\nQu'ils soient confus et épouvantés pour toujours, qu'ils soient honteux et qu'ils périssent !\n\nQu'ils sachent que toi seul, dont le nom est l'Éternel, tu es le Très-Haut sur toute la terre !\n", "84": "Psaume 84.\n\nAu chef des chantres. Sur la guitthith. Des fils de Koré. Psaume. Que tes demeures sont aimables, Éternel des armées !\n\nMon âme soupire et languit après les parvis de l'Éternel, mon cœur et ma chair poussent des cris vers le Dieu vivant.\n\nLe passereau même trouve une maison, et l'hirondelle un nid où elle dépose ses petits... Tes autels, Éternel des armées ! Mon roi et mon Dieu !\n\nHeureux ceux qui habitent ta maison ! Ils peuvent te célébrer encore.\n\nHeureux ceux qui placent en toi leur appui ! Ils trouvent dans leur cœur des chemins tout tracés.\n\nLorsqu'ils traversent la vallée de Baca, ils la transforment en un lieu plein de sources, et la pluie la couvre aussi de bénédictions.\n\nLeur force augmente pendant la marche, et ils se présentent devant Dieu à Sion.\n\nÉternel, Dieu des armées, écoute ma prière ! Prête l'oreille, Dieu de Jacob !\n\nToi qui es notre bouclier, vois, ô Dieu ! Et regarde la face de ton oint !\n\nMieux vaut un jour dans tes parvis que mille ailleurs ; je préfère me tenir sur le seuil de la maison de mon Dieu, plutôt que d'habiter sous les tentes de la méchanceté.\n\nCar l'Éternel Dieu est un soleil et un bouclier, l'Éternel donne la grâce et la gloire, il ne refuse aucun bien à ceux qui marchent dans l'intégrité.\n\nÉternel des armées ! Heureux l'homme qui se confie en toi !\n", "85": "Psaume 85.\n\nAu chef des chantres. Des fils de Koré. Psaume. Tu as été favorable à ton pays, ô Éternel ! Tu as ramené les captifs de Jacob ;\n\ntu as pardonné l'iniquité de ton peuple, tu as couvert tous ses péchés ;\n\ntu as retiré toute ta fureur, tu es revenu de l'ardeur de ta colère.\n\nRétablis-nous, Dieu de notre salut ! Cesse ton indignation contre nous !\n\nT'irriteras-tu contre nous à jamais ? Prolongeras-tu ta colère éternellement ?\n\nNe nous rendras-tu pas à la vie, afin que ton peuple se réjouisse en toi ?\n\nÉternel ! fais-nous voir ta bonté, et accorde-nous ton salut !\n\nJ'écouterai ce que dit Dieu, l'Éternel ; car il parle de paix à son peuple et à ses fidèles, pourvu qu'ils ne retombent pas dans la folie.\n\nOui, son salut est près de ceux qui le craignent, afin que la gloire habite dans notre pays.\n\nLa bonté et la fidélité se rencontrent, la justice et la paix s'embrassent ;\n\nla fidélité germe de la terre, et la justice regarde du haut des cieux.\n\nL'Éternel aussi accordera le bonheur, et notre terre donnera ses fruits.\n\nLa justice marchera devant lui, et imprimera ses pas sur le chemin.\n", "86": "Psaume 86.\n\nPrière de David. Éternel, prête l'oreille, exauce-moi ! Car je suis malheureux et indigent.\n\nGarde mon âme, car je suis pieux ! Mon Dieu, sauve ton serviteur qui se confie en toi !\n\nAie pitié de moi, Seigneur ! Car je crie à toi tout le jour.\n\nRéjouis l'âme de ton serviteur, car à toi, Seigneur, j'élève mon âme.\n\nCar tu es bon, Seigneur, tu pardonnes, tu es plein d'amour pour tous ceux qui t'invoquent.\n\nÉternel, prête l'oreille à ma prière, sois attentif à la voix de mes supplications !\n\nJe t'invoque au jour de ma détresse, car tu m'exauces.\n\nNul n'est comme toi parmi les dieux, Seigneur, et rien ne ressemble à tes œuvres.\n\nToutes les nations que tu as faites viendront se prosterner devant ta face, Seigneur, et rendre gloire à ton nom.\n\nCar tu es grand, et tu opères des prodiges ; toi seul, tu es Dieu.\n\nEnseigne-moi tes voies, ô Éternel ! Je marcherai dans ta fidélité. Dispose mon cœur à la crainte de ton nom.\n\nJe te louerai de tout mon cœur, Seigneur, mon Dieu ! Et je glorifierai ton nom à perpétuité.\n\nCar ta bonté est grande envers moi, et tu délivres mon âme du séjour profond des morts.\n\nÔ Dieu ! des orgueilleux se sont levés contre moi, une troupe d'hommes violents en veulent à ma vie ; ils ne portent pas leurs pensées sur toi.\n\nMais toi, Seigneur, tu es un Dieu miséricordieux et compatissant, lent à la colère, riche en bonté et en fidélité ;\n\ntourne vers moi les regards et aie pitié de moi, donne la force à ton serviteur, et sauve le fils de ta servante !\n\nOpère un signe en ma faveur ! Que mes ennemis le voient et soient confus ! Car tu me secours et tu me consoles, ô Éternel !\n", "87": "Psaume 87.\n\nDes fils de Koré. Psaume. Cantique. Elle est fondée sur les montagnes saintes.\n\nL'Éternel aime les portes de Sion plus que toutes les demeures de Jacob.\n\nDes choses glorieuses ont été dites sur toi, ville de Dieu !\n\nJe proclame l'Égypte et Babylone parmi ceux qui me connaissent ; voici, le pays des Philistins, Tyr, avec l'Éthiopie : c'est dans Sion qu'ils sont nés.\n\nEt de Sion il est dit : Tous y sont nés, et c'est le Très-Haut qui l'affermit.\n\nL'Éternel compte en inscrivant les peuples : c'est là qu'ils sont nés.\n\nEt ceux qui chantent et ceux qui dansent s'écrient : Toutes mes sources sont en toi.\n", "88": "Psaume 88.\n\nCantique. Psaume des fils de Koré. Au chef des chantres. Pour chanter sur la flûte. Cantique d'Héman, l'Ézrachite. Éternel, Dieu de mon salut ! Je crie jour et nuit devant toi.\n\nQue ma prière parvienne en ta présence ! Prête l'oreille à mes supplications !\n\nCar mon âme est rassasiée de maux, et ma vie s'approche du séjour des morts.\n\nJe suis mis au rang de ceux qui descendent dans la fosse, je suis comme un homme qui n'a plus de force.\n\nJe suis étendu parmi les morts, semblable à ceux qui sont tués et couchés dans le sépulcre, à ceux dont tu n'as plus le souvenir, et qui sont séparés de ta main.\n\nTu m'as jeté dans une fosse profonde, dans les ténèbres, dans les abîmes.\n\nTa fureur s'appesantit sur moi, et tu m'accables de tous tes flots.\n\nTu as éloigné de moi mes amis, tu m'as rendu pour eux un objet d'horreur ; je suis enfermé et je ne puis sortir.\n\nMes yeux se consument dans la souffrance ; je t'invoque tous les jours, ô Éternel ! J'étends vers toi les mains.\n\nEst-ce pour les morts que tu fais des miracles ? Les morts se lèvent-ils pour te louer ?\n\nParle-t-on de ta bonté dans le sépulcre, de ta fidélité dans l'abîme ?\n\nTes prodiges sont-ils connus dans les ténèbres, et ta justice dans la terre de l'oubli ?\n\nÔ Éternel ! j'implore ton secours, et le matin ma prière s'élève à toi.\n\nPourquoi, Éternel, repousses-tu mon âme ? Pourquoi me caches-tu ta face ?\n\nJe suis malheureux et moribond dès ma jeunesse, je suis chargé de tes terreurs, je suis troublé.\n\nTes fureurs passent sur moi, tes terreurs m'anéantissent ;\n\nelles m'environnent tout le jour comme des eaux, elles m'enveloppent toutes à la fois.\n\nTu as éloigné de moi amis et compagnons ; mes intimes ont disparu.\n", "89": "Psaume 89.\n\nCantique d'Éthan, l'Ézrachite. Je chanterai toujours les bontés de l'Éternel ; ma bouche fera connaître à jamais ta fidélité.\n\nCar je dis : La bonté a des fondements éternels ; tu établis ta fidélité dans les cieux.\n\nJ'ai fait alliance avec mon élu ; voici ce que j'ai juré à David, mon serviteur :\n\nj'affermirai ta postérité pour toujours, et j'établirai ton trône à perpétuité.\n\nLes cieux célèbrent tes merveilles, ô Éternel ! Et ta fidélité dans l'assemblée des saints.\n\nCar qui, dans le ciel, peut se comparer à l'Éternel ? Qui est semblable à toi parmi les fils de Dieu ?\n\nDieu est terrible dans la grande assemblée des saints, il est redoutable pour tous ceux qui l'entourent.\n\nÉternel, Dieu des armées ! qui est comme toi puissant, ô Éternel ? Ta fidélité t'environne.\n\nTu domptes l'orgueil de la mer ; quand ses flots se soulèvent, tu les apaises.\n\nTu écrasas l'Égypte comme un cadavre, tu dispersas tes ennemis par la puissance de ton bras.\n\nC'est à toi qu'appartiennent les cieux et la terre, c'est toi qui as fondé le monde et ce qu'il renferme.\n\nTu as créé le nord et le midi ; le thabor et l'Hermon se réjouissent à ton nom.\n\nTon bras est puissant, ta main forte, ta droite élevée.\n\nLa justice et l'équité sont la base de ton trône. La bonté et la fidélité sont devant ta face.\n\nHeureux le peuple qui connaît le son de la trompette ; il marche à la clarté de ta face, ô Éternel !\n\nIl se réjouit sans cesse de ton nom, et il se glorifie de ta justice.\n\nCar tu es la gloire de sa puissance ; c'est ta faveur qui relève notre force.\n\nCar l'Éternel est notre bouclier, le Saint d'Israël est notre roi.\n\nAlors tu parlas dans une vision à ton bien-aimé, et tu dis : J'ai prêté mon secours à un héros, j'ai élevé du milieu du peuple un jeune homme ;\n\nj'ai trouvé David, mon serviteur, je l'ai oint de mon huile sainte.\n\nMa main le soutiendra, et mon bras le fortifiera.\n\nL'ennemi ne le surprendra pas, et le méchant ne l'opprimera point ;\n\nj'écraserai devant lui ses adversaires, et je frapperai ceux qui le haïssent.\n\nMa fidélité et ma bonté seront avec lui, et sa force s'élèvera par mon nom.\n\nJe mettrai sa main sur la mer, et sa droite sur les fleuves.\n\nLui, il m'invoquera : tu es mon père, mon Dieu et le rocher de mon salut !\n\nEt moi, je ferai de lui le premier-né, le plus élevé des rois de la terre.\n\nJe lui conserverai toujours ma bonté, et mon alliance lui sera fidèle ;\n\nje rendrai sa postérité éternelle, et son trône comme les jours des cieux.\n\nSi ses fils abandonnent ma loi et ne marchent pas selon ses ordonnances,\n\ns'ils violent mes préceptes et n'observent pas mes commandements,\n\nje punirai de la verge leurs transgressions, et par des coups leurs iniquités ;\n\nmais je ne lui retirerai point ma bonté et je ne trahirai pas ma fidélité,\n\nje ne violerai point mon alliance et je ne changerai pas ce qui est sorti de mes lèvres.\n\nJ'ai juré une fois par ma sainteté : mentirai-je à David ?\n\nSa postérité subsistera toujours ; son trône sera devant moi comme le soleil,\n\ncomme la lune il aura une éternelle durée. Le témoin qui est dans le ciel est fidèle.\n\nEt pourtant, tu as rejeté, tu as repoussé ! Tu t'es irrité contre ton oint !\n\nTu as dédaigné l'alliance avec ton serviteur ; tu as abattu, profané sa couronne.\n\nTu as détruit toutes ses murailles, tu as mis en ruines ses forteresses.\n\nTous les passants le dépouillent ; il est un objet d'opprobre pour ses voisins.\n\nTu as élevé la droite de ses adversaires, tu as réjoui tous ses ennemis ;\n\ntu as fait reculer le tranchant de son glaive, et tu ne l'as pas soutenu dans le combat.\n\nTu as mis un terme à sa splendeur, et tu as jeté son trône à terre ;\n\ntu as abrégé les jours de sa jeunesse, tu l'as couvert de honte.\n\nJusques à quand, Éternel ! te cacheras-tu sans cesse, et ta fureur s'embrasera-t-elle comme le feu ?\n\nRappelle-toi ce qu'est la durée de ma vie, et pour quel néant tu as créé tous les fils de l'homme.\n\nY a-t-il un homme qui puisse vivre et ne pas voir la mort, qui puisse sauver son âme du séjour des morts ?\n\nOù sont, Seigneur ! tes bontés premières, que tu juras à David dans ta fidélité ?\n\nSouviens-toi, Seigneur ! de l'opprobre de tes serviteurs, souviens-toi que je porte en mon sein tous les peuples nombreux ;\n\nsouviens-toi des outrages de tes ennemis, ô Éternel ! De leurs outrages contre les pas de ton oint.\n\nBéni soit à jamais l'Éternel ! Amen ! Amen !\n", "90": "Psaume 90.\n\nPrière de Moïse, homme de Dieu. Seigneur ! tu as été pour nous un refuge, de génération en génération.\n\nAvant que les montagnes fussent nées, et que tu eusses créé la terre et le monde, d'éternité en éternité tu es Dieu.\n\nTu fais rentrer les hommes dans la poussière, et tu dis : Fils de l'homme, retournez !\n\nCar mille ans sont, à tes yeux, comme le jour d'hier, quand il n'est plus, et comme une veille de la nuit.\n\nTu les emportes, semblables à un songe, qui, le matin, passe comme l'herbe :\n\nelle fleurit le matin, et elle passe, on la coupe le soir, et elle sèche.\n\nNous sommes consumés par ta colère, et ta fureur nous épouvante.\n\nTu mets devant toi nos iniquités, et à la lumière de ta face nos fautes cachées.\n\nTous nos jours disparaissent par ton courroux ; nous voyons nos années s'évanouir comme un son.\n\nLes jours de nos années s'élèvent à soixante-dix ans, et, pour les plus robustes, à quatre-vingts ans ; et l'orgueil qu'ils en tirent n'est que peine et misère, car il passe vite, et nous nous envolons.\n\nQui prend garde à la force de ta colère, et à ton courroux, selon la crainte qui t'est due ?\n\nEnseigne-nous à bien compter nos jours, afin que nous appliquions notre cœur à la sagesse.\n\nReviens, Éternel ! Jusques à quand ?... Aie pitié de tes serviteurs !\n\nRassasie-nous chaque matin de ta bonté, et nous serons toute notre vie dans la joie et l'allégresse.\n\nRéjouis-nous autant de jours que tu nous as humiliés, autant d'années que nous avons vu le malheur.\n\nQue ton œuvre se manifeste à tes serviteurs, et ta gloire sur leurs enfants !\n\nQue la grâce de l'Éternel, notre Dieu, soit sur nous ! Affermis l'ouvrage de nos mains, oui, affermis l'ouvrage de nos mains !\n", "91": "Psaume 91.\n\nCelui qui demeure sous l'abri du Très-Haut repose à l'ombre du tout puissant.\n\nJe dis à l'Éternel : mon refuge et ma forteresse, mon Dieu en qui je me confie !\n\nCar c'est lui qui te délivre du filet de l'oiseleur, de la peste et de ses ravages.\n\nIl te couvrira de ses plumes, et tu trouveras un refuge sous ses ailes ; sa fidélité est un bouclier et une cuirasse.\n\nTu ne craindras ni les terreurs de la nuit, ni la flèche qui vole de jour,\n\nni la peste qui marche dans les ténèbres, ni la contagion qui frappe en plein midi.\n\nQue mille tombent à ton côté, et dix mille à ta droite, tu ne seras pas atteint ;\n\nde tes yeux seulement tu regarderas, et tu verras la rétribution des méchants.\n\nCar tu es mon refuge, ô Éternel ! Tu fais du Très-Haut ta retraite.\n\nAucun malheur ne t'arrivera, aucun fléau n'approchera de ta tente.\n\nCar il ordonnera à ses anges de te garder dans toutes tes voies ;\n\nils te porteront sur les mains, de peur que ton pied ne heurte contre une pierre.\n\nTu marcheras sur le lion et sur l'aspic, tu fouleras le lionceau et le dragon.\n\nPuisqu'il m'aime, je le délivrerai ; je le protégerai, puisqu'il connaît mon nom.\n\nIl m'invoquera, et je lui répondrai ; je serai avec lui dans la détresse, je le délivrerai et je le glorifierai.\n\nJe le rassasierai de longs jours, et je lui ferai voir mon salut.\n", "92": "Psaume 92.\n\nPsaume. Cantique pour le jour du sabbat. Il est beau de louer l'Éternel, et de célébrer ton nom, ô Très-Haut !\n\nD'annoncer le matin ta bonté, et ta fidélité pendant les nuits,\n\nsur l'instrument à dix cordes et sur le luth, aux sons de la harpe.\n\nTu me réjouis par tes œuvres, ô Éternel ! Et je chante avec allégresse l'ouvrage de tes mains.\n\nQue tes œuvres sont grandes, ô Éternel ! Que tes pensées sont profondes !\n\nL'homme stupide n'y connaît rien, et l'insensé n'y prend point garde.\n\nSi les méchants croissent comme l'herbe, si tous ceux qui font le mal fleurissent, c'est pour être anéantis à jamais.\n\nMais toi, tu es le Très-Haut, à perpétuité, ô Éternel !\n\nCar voici, tes ennemis, ô Éternel ! Car voici, tes ennemis périssent ; tous ceux qui font le mal sont dispersés.\n\nEt tu me donnes la force du buffle ; je suis arrosé avec une huile fraîche.\n\nMon œil se plaît à contempler mes ennemis, et mon oreille à entendre mes méchants adversaires.\n\nLes justes croissent comme le palmier, ils s'élèvent comme le cèdre du Liban.\n\nPlantés dans la maison de l'Éternel, ils prospèrent dans les parvis de notre Dieu ;\n\nils portent encore des fruits dans la vieillesse, ils sont pleins de sève et verdoyants,\n\npour faire connaître que l'Éternel est juste. Il est mon rocher, et il n'y a point en lui d'iniquité.\n", "93": "Psaume 93.\n\nL'Éternel règne, il est revêtu de majesté, l'Éternel est revêtu, il est ceint de force. Aussi le monde est ferme, il ne chancelle pas.\n\nTon trône est établi dès les temps anciens ; tu existes de toute éternité.\n\nLes fleuves élèvent, ô Éternel ! Les fleuves élèvent leur voix, les fleuves élèvent leurs ondes retentissantes.\n\nPlus que la voix des grandes, des puissantes eaux, des flots impétueux de la mer, l'Éternel est puissant dans les lieux célestes.\n\nTes témoignages sont entièrement véritables ; la sainteté convient à ta maison, Ô Éternel ! pour toute la durée des temps.\n", "94": "Psaume 94.\n\nDieu des vengeances, Éternel ! Dieu des vengeances, parais !\n\nLève-toi, juge de la terre ! Rends aux superbes selon leurs œuvres !\n\nJusques à quand les méchants, ô Éternel ! Jusques à quand les méchants triompheront-ils ?\n\nIls discourent, ils parlent avec arrogance ; tous ceux qui font le mal se glorifient.\n\nÉternel ! ils écrasent ton peuple, ils oppriment ton héritage ;\n\nils égorgent la veuve et l'étranger, ils assassinent les orphelins.\n\nEt ils disent : L'Éternel ne regarde pas, le Dieu de Jacob ne fait pas attention !\n\nPrenez-y garde, hommes stupides ! Insensés, quand serez-vous sages ?\n\nCelui qui a planté l'oreille n'entendrait-il pas ? Celui qui a formé l'œil ne verrait-il pas ?\n\nCelui qui châtie les nations ne punirait-il point, lui qui donne à l'homme l'intelligence ?\n\nL'Éternel connaît les pensées de l'homme, il sait qu'elles sont vaines.\n\nHeureux l'homme que tu châties, ô Éternel ! Et que tu instruis par ta loi,\n\npour le calmer aux jours du malheur, jusqu'à ce que la fosse soit creusée pour le méchant !\n\nCar l'Éternel ne délaisse pas son peuple, il n'abandonne pas son héritage ;\n\ncar le jugement sera conforme à la justice, et tous ceux dont le cœur est droit l'approuveront.\n\nQui se lèvera pour moi contre les méchants ? Qui me soutiendra contre ceux qui font le mal ?\n\nSi l'Éternel n'était pas mon secours, mon âme serait bien vite dans la demeure du silence.\n\nQuand je dis : Mon pied chancelle ! Ta bonté, ô Éternel ! me sert d'appui.\n\nQuand les pensées s'agitent en foule au dedans de moi, tes consolations réjouissent mon âme.\n\nLes méchants te feraient-ils siéger sur leur trône, eux qui forment des desseins iniques en dépit de la loi ?\n\nIls se rassemblent contre la vie du juste, et ils condamnent le sang innocent.\n\nMais l'Éternel est ma retraite, mon Dieu est le rocher de mon refuge.\n\nIl fera retomber sur eux leur iniquité, il les anéantira par leur méchanceté ; l'Éternel, notre Dieu, les anéantira.\n", "95": "Psaume 95.\n\nVenez, chantons avec allégresse à l'Éternel ! Poussons des cris de joie vers le rocher de notre salut.\n\nAllons au-devant de lui avec des louanges, faisons retentir des cantiques en son honneur !\n\nCar l'Éternel est un grand Dieu, il est un grand roi au-dessus de tous les dieux.\n\nIl tient dans sa main les profondeurs de la terre, et les sommets des montagnes sont à lui.\n\nLa mer est à lui, c'est lui qui l'a faite ; la terre aussi, ses mains l'ont formée.\n\nVenez, prosternons-nous et humilions-nous, fléchissons le genou devant l'Éternel, notre créateur !\n\nCar il est notre Dieu, et nous sommes le peuple de son pâturage, le troupeau que sa main conduit... Oh ! si vous pouviez écouter aujourd'hui sa voix !\n\nN'endurcissez pas votre cœur, comme à Meriba, comme à la journée de Massa, dans le désert,\n\noù vos pères me tentèrent, m'éprouvèrent, quoiqu'ils vissent mes œuvres.\n\nPendant quarante ans j'eus cette race en dégoût, et je dis : C'est un peuple dont le cœur est égaré ; ils ne connaissent pas mes voies.\n\nAussi je jurai dans ma colère : ils n'entreront pas dans mon repos !\n", "96": "Psaume 96.\n\nChantez à l'Éternel un cantique nouveau ! Chantez à l'Éternel, vous tous, habitants de la terre !\n\nChantez à l'Éternel, bénissez son nom, annoncez de jour en jour son salut !\n\nRacontez parmi les nations sa gloire, parmi tous les peuples ses merveilles !\n\nCar l'Éternel est grand et très digne de louange, il est redoutable par-dessus tous les dieux ;\n\ncar tous les dieux des peuples sont des idoles, et l'Éternel a fait les cieux.\n\nLa splendeur et la magnificence sont devant sa face, la gloire et la majesté sont dans son sanctuaire.\n\nFamilles des peuples, rendez à l'Éternel, rendez à l'Éternel gloire et honneur !\n\nRendez à l'Éternel gloire pour son nom ! Apportez des offrandes, et entrez dans ses parvis !\n\nProsternez-vous devant l'Éternel avec des ornements sacrés. Tremblez devant lui, vous tous, habitants de la terre !\n\nDites parmi les nations : l'Éternel règne ; aussi le monde est ferme, il ne chancelle pas ; l'Éternel juge les peuples avec droiture.\n\nQue les cieux se réjouissent, et que la terre soit dans l'allégresse, que la mer retentisse avec tout ce qu'elle contient,\n\nque la campagne s'égaie avec tout ce qu'elle renferme, que tous les arbres des forêts poussent des cris de joie,\n\ndevant l'Éternel ! Car il vient, car il vient pour juger la terre ; il jugera le monde avec justice, et les peuples selon sa fidélité.\n", "97": "Psaume 97.\n\nL'Éternel règne : que la terre soit dans l'allégresse, que les îles nombreuses se réjouissent !\n\nLes nuages et l'obscurité l'environnent, la justice et l'équité sont la base de son trône.\n\nLe feu marche devant lui, et embrase à l'entour ses adversaires.\n\nSes éclairs illuminent le monde, la terre le voit et tremble ;\n\nles montagnes se fondent comme la cire devant l'Éternel, devant le Seigneur de toute la terre.\n\nLes cieux publient sa justice, et tous les peuples voient sa gloire.\n\nIls sont confus, tous ceux qui servent les images, qui se font gloire des idoles. Tous les dieux
