se prosternent devant lui.\n\nSion l'entend et se réjouit, les filles de Juda sont dans l'allégresse, à cause de tes jugements, ô Éternel !\n\nCar toi, Éternel ! tu es le Très-Haut sur toute la terre, tu es souverainement élevé au-dessus de tous les dieux.\n\nVous qui aimez l'Éternel, haïssez le mal ! Il garde les âmes de ses fidèles, il les délivre de la main des méchants.\n\nLa lumière est semée pour le juste, et la joie pour ceux dont le cœur est droit.\n\nJustes, réjouissez-vous en l'Éternel, et célébrez par vos louanges sa sainteté !\n", "98": "Psaume 98.\n\nPsaume. Chantez à l'Éternel un cantique nouveau ! Car il a fait des prodiges. Sa droite et son bras saint lui sont venus en aide.\n\nL'Éternel a manifesté son salut, il a révélé sa justice aux yeux des nations.\n\nIl s'est souvenu de sa bonté et de sa fidélité envers la maison d'Israël, toutes les extrémités de la terre ont vu le salut de notre Dieu.\n\nPoussez vers l'Éternel des cris de joie, vous tous, habitants de la terre ! Faites éclater votre allégresse, et chantez !\n\nChantez à l'Éternel avec la harpe ; avec la harpe chantez des cantiques !\n\nAvec les trompettes et au son du cor, poussez des cris de joie devant le roi, l'Éternel !\n\nQue la mer retentisse avec tout ce qu'elle contient, que le monde et ceux qui l'habitent éclatent d'allégresse,\n\nque les fleuves battent des mains, que toutes les montagnes poussent des cris de joie,\n\ndevant l'Éternel ! Car il vient pour juger la terre ; il jugera le monde avec justice, et les peuples avec équité.\n", "99": "Psaume 99.\n\nL'Éternel règne : les peuples tremblent ; il est assis sur les chérubins : la terre chancelle.\n\nL'Éternel est grand dans Sion, il est élevé au-dessus de tous les peuples.\n\nQu'on célèbre ton nom grand et redoutable ! Il est saint !\n\nQu'on célèbre la force du roi qui aime la justice ! Tu affermis la droiture, tu exerces en Jacob la justice et l'équité.\n\nExaltez l'Éternel, notre Dieu, et prosternez-vous devant son marchepied ! Il est saint !\n\nMoïse et Aaron parmi ses sacrificateurs, et samuel parmi ceux qui invoquaient son nom, invoquèrent l'Éternel, et il les exauça.\n\nIl leur parla dans la colonne de nuée ; ils observèrent ses commandements et la loi qu'il leur donna.\n\nÉternel, notre Dieu, tu les exauças, tu fus pour eux un Dieu qui pardonne, mais tu les as punis de leurs fautes.\n\nExaltez l'Éternel, notre Dieu, et prosternez-vous sur sa montagne sainte ! Car il est saint, l'Éternel, notre Dieu !\n", "100": "Psaume 100.\n\nPsaume de louange. Poussez vers l'Éternel des cris de joie, vous tous, habitants de la terre !\n\nServez l'Éternel, avec joie, venez avec allégresse en sa présence !\n\nSachez que l'Éternel est Dieu ! C'est lui qui nous a faits, et nous lui appartenons ; nous sommes son peuple, et le troupeau de son pâturage.\n\nEntrez dans ses portes avec des louanges, dans ses parvis avec des cantiques ! Célébrez-le, bénissez son nom !\n\nCar l'Éternel est bon ; sa bonté dure toujours, et sa fidélité de génération en génération.\n", "101": "Psaume 101.\n\nDe David. Psaume. Je chanterai la bonté et la justice ; c'est à toi, Éternel ! que je chanterai.\n\nJe prendrai garde à la voie droite. Quand viendras-tu à moi ? Je marcherai dans l'intégrité de mon cœur, au milieu de ma maison.\n\nJe ne mettrai rien de mauvais devant mes yeux ; je hais la conduite des pécheurs ; elle ne s'attachera point à moi.\n\nLe cœur pervers s'éloignera de moi ; je ne veux pas connaître le méchant.\n\nCelui qui calomnie en secret son prochain, je l'anéantirai ; celui qui a des regards hautains et un cœur enflé, je ne le supporterai pas.\n\nJ'aurai les yeux sur les fidèles du pays, pour qu'ils demeurent auprès de moi ; celui qui marche dans une voie intègre sera mon serviteur.\n\nCelui qui se livre à la fraude n'habitera pas dans ma maison ; celui qui dit des mensonges ne subsistera pas en ma présence.\n\nChaque matin j'anéantirai tous les méchants du pays, afin d'exterminer de la ville de l'Éternel tous ceux qui commettent l'iniquité.\n", "102": "Psaume 102.\n\nPrière d'un malheureux, lorsqu'il est abattu et qu'il répand sa plainte devant l'Éternel. Éternel, écoute ma prière, et que mon cri parvienne jusqu'à toi !\n\nNe me cache pas ta face au jour de ma détresse ! Incline vers moi ton oreille quand je crie ! Hâte-toi de m'exaucer !\n\nCar mes jours s'évanouissent en fumée, et mes os sont enflammés comme un tison.\n\nMon cœur est frappé et se dessèche comme l'herbe ; j'oublie même de manger mon pain.\n\nMes gémissements sont tels que mes os s'attachent à ma chair.\n\nJe ressemble au pélican du désert, je suis comme le chat-huant des ruines ;\n\nje n'ai plus de sommeil, et je suis comme l'oiseau solitaire sur un toit.\n\nChaque jour mes ennemis m'outragent, et c'est par moi que jurent mes adversaires en fureur.\n\nJe mange la poussière au lieu de pain, et je mêle des larmes à ma boisson,\n\nà cause de ta colère et de ta fureur ; car tu m'as soulevé et jeté au loin.\n\nMes jours sont comme l'ombre à son déclin, et je me dessèche comme l'herbe.\n\nMais toi, Éternel ! tu règnes à perpétuité, et ta mémoire dure de génération en génération.\n\nTu te lèveras, tu auras pitié de Sion ; car le temps d'avoir pitié d'elle, le temps fixé est à son terme ;\n\ncar tes serviteurs en aiment les pierres, ils en chérissent la poussière.\n\nAlors les nations craindront le nom de l'Éternel, et tous les rois de la terre ta gloire.\n\nOui, l'Éternel rebâtira Sion, il se montrera dans sa gloire.\n\nIl est attentif à la prière du misérable, il ne dédaigne pas sa prière.\n\nQue cela soit écrit pour la génération future, et que le peuple qui sera créé célèbre l'Éternel !\n\nCar il regarde du lieu élevé de sa sainteté ; du haut des cieux l'Éternel regarde sur la terre,\n\npour écouter les gémissements des captifs, pour délivrer ceux qui vont périr,\n\nafin qu'ils publient dans Sion le nom de l'Éternel, et ses louanges dans Jérusalem,\n\nquand tous les peuples s'assembleront, et tous les royaumes, pour servir l'Éternel.\n\nIl a brisé ma force dans la route, il a abrégé mes jours.\n\nJe dis : Mon Dieu, ne m'enlève pas au milieu de mes jours, toi, dont les années durent éternellement !\n\nTu as anciennement fondé la terre, et les cieux sont l'ouvrage de tes mains.\n\nIls périront, mais tu subsisteras ; ils s'useront tous comme un vêtement ; tu les changeras comme un habit, et ils seront changés.\n\nMais toi, tu restes le même, et tes années ne finiront point.\n\nLes fils de tes serviteurs habiteront leur pays, et leur postérité s'affermira devant toi.\n", "103": "Psaume 103.\n\nDe David. Mon âme, bénis l'Éternel ! Que tout ce qui est en moi bénisse son saint nom !\n\nMon âme, bénis l'Éternel, et n'oublie aucun de ses bienfaits !\n\nC'est lui qui pardonne toutes tes iniquités, qui guérit toutes tes maladies ;\n\nc'est lui qui délivre ta vie de la fosse, qui te couronne de bonté et de miséricorde ;\n\nc'est lui qui rassasie de biens ta vieillesse, qui te fait rajeunir comme l'aigle.\n\nL'Éternel fait justice, il fait droit à tous les opprimés.\n\nIl a manifesté ses voies à Moïse, ses œuvres aux enfants d'Israël.\n\nL'Éternel est miséricordieux et compatissant, lent à la colère et riche en bonté ;\n\nil ne conteste pas sans cesse, il ne garde pas sa colère à toujours ;\n\nil ne nous traite pas selon nos péchés, il ne nous punit pas selon nos iniquités.\n\nMais autant les cieux sont élevés au-dessus de la terre, autant sa bonté est grande pour ceux qui le craignent ;\n\nautant l'orient est éloigné de l'occident, autant il éloigne de nous nos transgressions.\n\nComme un père a compassion de ses enfants, l'Éternel a compassion de ceux qui le craignent.\n\nCar il sait de quoi nous sommes formés, il se souvient que nous sommes poussière.\n\nL'homme ! ses jours sont comme l'herbe, il fleurit comme la fleur des champs.\n\nLorsqu'un vent passe sur elle, elle n'est plus, et le lieu qu'elle occupait ne la reconnaît plus.\n\nMais la bonté de l'Éternel dure à jamais pour ceux qui le craignent, et sa miséricorde pour les enfants de leurs enfants,\n\npour ceux qui gardent son alliance, et se souviennent de ses commandements afin de les accomplir.\n\nL'Éternel a établi son trône dans les cieux, et son règne domine sur toutes choses.\n\nBénissez l'Éternel, vous ses anges, qui êtes puissants en force, et qui exécutez ses ordres, en obéissant à la voix de sa parole !\n\nBénissez l'Éternel, vous toutes ses armées, qui êtes ses serviteurs, et qui faites sa volonté !\n\nBénissez l'Éternel, vous toutes ses œuvres, dans tous les lieux de sa domination ! Mon âme, bénis l'Éternel !\n", "104": "Psaume 104.\n\nMon âme, bénis l'Éternel ! Éternel, mon Dieu, tu es infiniment grand ! Tu es revêtu d'éclat et de magnificence !\n\nIl s'enveloppe de lumière comme d'un manteau ; il étend les cieux comme un pavillon.\n\nIl forme avec les eaux le faîte de sa demeure ; il prend les nuées pour son char, il s'avance sur les ailes du vent.\n\nIl fait des vents ses messagers, des flammes de feu ses serviteurs.\n\nIl a établi la terre sur ses fondements, elle ne sera jamais ébranlée.\n\nTu l'avais couverte de l'abîme comme d'un vêtement, les eaux s'arrêtaient sur les montagnes ;\n\nelles ont fui devant ta menace, elles se sont précipitées à la voix de ton tonnerre.\n\nDes montagnes se sont élevées, des vallées se sont abaissées, au lieu que tu leur avais fixé.\n\nTu as posé une limite que les eaux ne doivent point franchir, afin qu'elles ne reviennent plus couvrir la terre.\n\nIl conduit les sources dans des torrents qui coulent entre les montagnes.\n\nElles abreuvent tous les animaux des champs ; les ânes sauvages y étanchent leur soif.\n\nLes oiseaux du ciel habitent sur leurs bords, et font résonner leur voix parmi les rameaux.\n\nDe sa haute demeure, il arrose les montagnes ; la terre est rassasiée du fruit de tes œuvres.\n\nIl fait germer l'herbe pour le bétail, et les plantes pour les besoins de l'homme, afin que la terre produise de la nourriture,\n\nle vin qui réjouit le cœur de l'homme, et fait plus que l'huile resplendir son visage, et le pain qui soutient le cœur de l'homme.\n\nLes arbres de l'Éternel se rassasient, les cèdres du Liban, qu'il a plantés.\n\nC'est là que les oiseaux font leurs nids ; la cigogne a sa demeure dans les cyprès,\n\nles montagnes élevées sont pour les boucs sauvages, les rochers servent de retraite aux damans.\n\nIl a fait la lune pour marquer les temps ; le soleil sait quand il doit se coucher.\n\nTu amènes les ténèbres, et il est nuit : alors tous les animaux des forêts sont en mouvement ;\n\nles lionceaux rugissent après la proie, et demandent à Dieu leur nourriture.\n\nLe soleil se lève : ils se retirent, et se couchent dans leurs tanières.\n\nL'homme sort pour se rendre à son ouvrage, et à son travail, jusqu'au soir.\n\nQue tes œuvres sont en grand nombre, ô Éternel ! Tu les as toutes faites avec sagesse. La terre est remplie de tes biens.\n\nVoici la grande et vaste mer : là se meuvent sans nombre des animaux petits et grands ;\n\nlà se promènent les navires, et ce léviathan que tu as formé pour se jouer dans les flots.\n\nTous ces animaux espèrent en toi, pour que tu leur donnes la nourriture en son temps.\n\nTu la leur donnes, et ils la recueillent ; tu ouvres ta main, et ils se rassasient de biens.\n\nTu caches ta face : ils sont tremblants ; tu leur retires le souffle : ils expirent, et retournent dans leur poussière.\n\nTu envoies ton souffle : ils sont créés, et tu renouvelles la face de la terre.\n\nQue la gloire de l'Éternel subsiste à jamais ! Que l'Éternel se réjouisse de ses œuvres !\n\nIl regarde la terre, et elle tremble ; il touche les montagnes, et elles sont fumantes.\n\nJe chanterai l'Éternel tant que je vivrai, je célébrerai mon Dieu tant que j'existerai.\n\nQue mes paroles lui soient agréables ! Je veux me réjouir en l'Éternel.\n\nQue les pécheurs disparaissent de la terre, et que les méchants ne soient plus ! Mon âme, bénis l'Éternel ! Louez l'Éternel !\n", "105": "Psaume 105.\n\nLouez l'Éternel, invoquez son nom ! Faites connaître parmi les peuples ses hauts faits !\n\nChantez, chantez en son honneur ! Parlez de toutes ses merveilles !\n\nGlorifiez-vous de son saint nom ! Que le cœur de ceux qui cherchent l'Éternel se réjouisse !\n\nAyez recours à l'Éternel et à son appui, cherchez continuellement sa face !\n\nSouvenez-vous des prodiges qu'il a faits, de ses miracles et des jugements de sa bouche,\n\npostérité d'Abraham, son serviteur, enfants de Jacob, ses élus !\n\nL'Éternel est notre Dieu ; ses jugements s'exercent sur toute la terre.\n\nIl se rappelle à toujours son alliance, ses promesses pour mille générations,\n\nl'alliance qu'il a traitée avec Abraham, et le serment qu'il a fait à Isaac ;\n\nil l'a érigée pour Jacob en loi, pour Israël en alliance éternelle,\n\ndisant : Je te donnerai le pays de Canaan comme héritage qui vous est échu.\n\nIls étaient alors peu nombreux, très peu nombreux, et étrangers dans le pays,\n\net ils allaient d'une nation à l'autre et d'un royaume vers un autre peuple ;\n\nmais il ne permit à personne de les opprimer, et il châtia des rois à cause d'eux :\n\nne touchez pas à mes oints, et ne faites pas de mal à mes prophètes !\n\nIl appela sur le pays la famine, il coupa tout moyen de subsistance.\n\nIl envoya devant eux un homme : Joseph fut vendu comme esclave.\n\nOn serra ses pieds dans des liens, on le mit aux fers,\n\njusqu'au temps où arriva ce qu'il avait annoncé, et où la parole de l'Éternel l'éprouva.\n\nLe roi fit ôter ses liens, le dominateur des peuples le délivra.\n\nIl l'établit seigneur sur sa maison, et gouverneur de tous ses biens,\n\nafin qu'il pût à son gré enchaîner ses princes, et qu'il enseignât la sagesse à ses anciens.\n\nAlors Israël vint en Égypte, et Jacob séjourna dans le pays de Cham.\n\nIl rendit son peuple très fécond, et plus puissant que ses adversaires.\n\nIl changea leur cœur, au point qu'ils haïrent son peuple et qu'ils traitèrent ses serviteurs avec perfidie.\n\nIl envoya Moïse, son serviteur, et Aaron, qu'il avait choisi.\n\nIls accomplirent par son pouvoir des prodiges au milieu d'eux, ils firent des miracles dans le pays de Cham.\n\nIl envoya des ténèbres et amena l'obscurité, et ils ne furent pas rebelles à sa parole.\n\nIl changea leurs eaux en sang, et fit périr leurs poissons.\n\nLe pays fourmilla de grenouilles, jusque dans les chambres de leurs rois.\n\nIl dit, et parurent les mouches venimeuses, les poux sur tout leur territoire.\n\nIl leur donna pour pluie de la grêle, des flammes de feu dans leur pays.\n\nIl frappa leurs vignes et leurs figuiers, et brisa les arbres de leur contrée.\n\nIl dit, et parurent les sauterelles, des sauterelles sans nombre,\n\nqui dévorèrent toute l'herbe du pays, qui dévorèrent les fruits de leurs champs.\n\nIl frappa tous les premiers-nés dans leur pays, toutes les prémices de leur force.\n\nIl fit sortir son peuple avec de l'argent et de l'or, et nul ne chancela parmi ses tribus.\n\nLes Égyptiens se réjouirent de leur départ, car la terreur qu'ils avaient d'eux les saisissait.\n\nIl étendit la nuée pour les couvrir, et le feu pour éclairer la nuit.\n\nÀ leur demande, il fit venir des cailles, et il les rassasia du pain du ciel.\n\nIl ouvrit le rocher, et des eaux coulèrent ; elles se répandirent comme un fleuve dans les lieux arides.\n\nCar il se souvint de sa parole sainte, et d'Abraham, son serviteur.\n\nIl fit sortir son peuple dans l'allégresse, ses élus au milieu des cris de joie.\n\nIl leur donna les terres des nations, et ils possédèrent le fruit du travail des peuples,\n\nafin qu'ils gardassent ses ordonnances, et qu'ils observassent ses lois. Louez l'Éternel !\n", "106": "Psaume 106.\n\nLouez l'Éternel ! Louez l'Éternel, car il est bon, car sa miséricorde dure à toujours !\n\nQui dira les hauts faits de l'Éternel ? Qui publiera toute sa louange ?\n\nHeureux ceux qui observent la loi, qui pratiquent la justice en tout temps !\n\nÉternel, souviens-toi de moi dans ta bienveillance pour ton peuple ! Souviens-toi de moi en lui accordant ton secours,\n\nafin que je voie le bonheur de tes élus, que je me réjouisse de la joie de ton peuple, et que je me glorifie avec ton héritage !\n\nNous avons péché comme nos pères, nous avons commis l'iniquité, nous avons fait le mal.\n\nNos pères en Égypte ne furent pas attentifs à tes miracles, ils ne se rappelèrent pas la multitude de tes grâces, ils furent rebelles près de la mer, près de la mer Rouge.\n\nMais il les sauva à cause de son nom, pour manifester sa puissance.\n\nIl menaça la mer Rouge, et elle se dessécha ; et il les fit marcher à travers les abîmes comme dans un désert.\n\nIl les sauva de la main de celui qui les haïssait, il les délivra de la main de l'ennemi.\n\nLes eaux couvrirent leurs adversaires : il n'en resta pas un seul.\n\nEt ils crurent à ses paroles, ils chantèrent ses louanges.\n\nMais ils oublièrent bientôt ses œuvres, ils n'attendirent pas l'exécution de ses desseins.\n\nIls furent saisis de convoitise dans le désert, et ils tentèrent Dieu dans la solitude.\n\nIl leur accorda ce qu'ils demandaient ; puis il envoya le dépérissement dans leur corps.\n\nIls se montrèrent, dans le camp, jaloux contre Moïse, contre Aaron, le saint de l'Éternel.\n\nLa terre s'ouvrit et engloutit Dathan, et elle se referma sur la troupe d'Abiram ;\n\nle feu embrasa leur troupe, la flamme consuma les méchants.\n\nIls firent un veau en Horeb, ils se prosternèrent devant une image de fonte,\n\nils échangèrent leur gloire contre la figure d'un bœuf qui mange l'herbe.\n\nIls oublièrent Dieu, leur sauveur, qui avait fait de grandes choses en Égypte,\n\ndes miracles dans le pays de Cham, des prodiges sur la mer Rouge.\n\nEt il parla de les exterminer ; mais Moïse, son élu, se tint à la brèche devant lui, pour détourner sa fureur et l'empêcher de les détruire.\n\nIls méprisèrent le pays des délices ; ils ne crurent pas à la parole de l'Éternel,\n\nils murmurèrent dans leurs tentes, ils n'obéirent point à sa voix.\n\nEt il leva la main pour jurer de les faire tomber dans le désert,\n\nde faire tomber leur postérité parmi les nations, et de les disperser au milieu des pays.\n\nIls s'attachèrent à Baal-Peor, et mangèrent des victimes sacrifiées aux morts.\n\nIls irritèrent l'Éternel par leurs actions, et une plaie fit irruption parmi eux.\n\nPhinées se leva pour intervenir, et la plaie s'arrêta ;\n\ncela lui fut imputé à justice, de génération en génération pour toujours.\n\nIls irritèrent l'Éternel près des eaux de Meriba ; et Moïse fut puni à cause d'eux,\n\ncar ils aigrirent son esprit, et il s'exprima légèrement des lèvres.\n\nIls ne détruisirent point les peuples que l'Éternel leur avait ordonné de détruire.\n\nIls se mêlèrent avec les nations, et ils apprirent leurs œuvres.\n\nIls servirent leurs idoles, qui furent pour eux un piège ;\n\nils sacrifièrent leurs fils et leurs filles aux idoles,\n\nils répandirent le sang innocent, le sang de leurs fils et de leurs filles, qu'ils sacrifièrent aux idoles de Canaan, et le pays fut profané par des meurtres.\n\nIls se souillèrent par leurs œuvres, ils se prostituèrent par leurs actions.\n\nLa colère de l'Éternel s'enflamma contre son peuple, et il prit en horreur son héritage.\n\nIl les livra entre les mains des nations ; ceux qui les haïssaient dominèrent sur eux ;\n\nleurs ennemis les opprimèrent, et ils furent humiliés sous leur puissance.\n\nPlusieurs fois il les délivra ; mais ils se montrèrent rebelles dans leurs desseins, et ils devinrent malheureux par leur iniquité.\n\nIl vit leur détresse, lorsqu'il entendit leurs supplications.\n\nIl se souvint en leur faveur de son alliance ;\n\nil eut pitié selon sa grande bonté, et il excita pour eux la compassion de tous ceux qui les retenaient captifs.\n\nSauve-nous, Éternel, notre Dieu ! Et rassemble-nous du milieu des nations, afin que nous célébrions ton saint nom, et que nous mettions notre gloire à te louer !\n\nBéni soit l'Éternel, le Dieu d'Israël, d'éternité en éternité ! Et que tout le peuple dise : Amen ! Louez l'Éternel !\n", "107": "Psaume 107.\n\nLouez l'Éternel, car il est bon, car sa miséricorde dure à toujours !\n\nQu'ainsi disent les rachetés de l'Éternel, ceux qu'il a délivrés de la main de l'ennemi,\n\net qu'il a rassemblés de tous les pays, de l'orient et de l'occident, du nord et de la mer !\n\nIls erraient dans le désert, ils marchaient dans la solitude, sans trouver une ville où ils pussent habiter.\n\nIls souffraient de la faim et de la soif ; leur âme était languissante.\n\nDans leur détresse, ils crièrent à l'Éternel, et il les délivra de leurs angoisses ;\n\nil les conduisit par le droit chemin, pour qu'ils arrivassent dans une ville habitable.\n\nQu'ils louent l'Éternel pour sa bonté, et pour ses merveilles en faveur des fils de l'homme !\n\nCar il a satisfait l'âme altérée, il a comblé de biens l'âme affamée.\n\nCeux qui avaient pour demeure les ténèbres et l'ombre de la mort Vivaient captifs dans la misère et dans les chaînes,\n\nparce qu'ils s'étaient révoltés contre les paroles de Dieu, parce qu'ils avaient méprisé le conseil du Très-Haut.\n\nIl humilia leur cœur par la souffrance ; ils succombèrent, et personne ne les secourut.\n\nDans leur détresse, ils crièrent à l'Éternel, et il les délivra de leurs angoisses ;\n\nil les fit sortir des ténèbres et de l'ombre de la mort, et il rompit leurs liens.\n\nQu'ils louent l'Éternel pour sa bonté, et pour ses merveilles en faveur des fils de l'homme !\n\nCar il a brisé les portes d'airain, il a rompu les verrous de fer.\n\nLes insensés, par leur conduite coupable et par leurs iniquités, s'étaient rendus malheureux.\n\nLeur âme avait en horreur toute nourriture, et ils touchaient aux portes de la mort.\n\nDans leur détresse, ils crièrent à l'Éternel, et il les délivra de leurs angoisses ;\n\nil envoya sa parole et les guérit, il les fit échapper de la fosse.\n\nQu'ils louent l'Éternel pour sa bonté, et pour ses merveilles en faveur des fils de l'homme !\n\nQu'ils offrent des sacrifices d'actions de grâces, et qu'ils publient ses œuvres avec des cris de joie !\n\nCeux qui étaient descendus sur la mer dans des navires, et qui travaillaient sur les grandes eaux,\n\nceux-là virent les œuvres de l'Éternel et ses merveilles au milieu de l'abîme.\n\nIl dit, et il fit souffler la tempête, qui souleva les flots de la mer.\n\nIls montaient vers les cieux, ils descendaient dans l'abîme ; leur âme était éperdue en face du danger ;\n\nsaisis de vertige, ils chancelaient comme un homme ivre, et toute leur habileté était anéantie.\n\nDans leur détresse, ils crièrent à l'Éternel, et il les délivra de leurs angoisses ;\n\nil arrêta la tempête, ramena le calme, et les ondes se turent.\n\nIls se réjouirent de ce qu'elles s'étaient apaisées, et l'Éternel les conduisit au port désiré.\n\nQu'ils louent l'Éternel pour sa bonté, et pour ses merveilles en faveur des fils de l'homme !\n\nQu'ils l'exaltent dans l'assemblée du peuple, et qu'ils le célèbrent dans la réunion des anciens !\n\nIl change les fleuves en désert, et les sources d'eaux en terre desséchée,\n\nle pays fertile en pays salé, à cause de la méchanceté de ses habitants.\n\nIl change le désert en étang, et la terre aride en sources d'eaux,\n\net il y établit ceux qui sont affamés. Ils fondent une ville pour l'habiter ;\n\nils ensemencent des champs, plantent des vignes, et ils en recueillent les produits.\n\nIl les bénit, et ils deviennent très nombreux, et il ne diminue point leur bétail.\n\nSont-ils amoindris et humiliés par l'oppression, le malheur et la souffrance ;\n\nverse-t-il le mépris sur les grands, les fait-il errer dans des déserts sans chemin,\n\nil relève l'indigent et le délivre de la misère, il multiplie les familles comme des troupeaux.\n\nLes hommes droits le voient et se réjouissent, mais toute iniquité ferme la bouche.\n\nQue celui qui est sage prenne garde à ces choses, et qu'il soit attentif aux bontés de l'Éternel.\n", "108": "Psaume 108.\n\nCantique. Psaume de David. Mon cœur est affermi, ô Dieu ! Je chanterai, je ferai retentir mes instruments : c'est ma gloire !\n\nRéveillez-vous, mon luth et ma harpe ! Je réveillerai l'aurore.\n\nJe te louerai parmi les peuples, Éternel ! Je te chanterai parmi les nations.\n\nCar ta bonté s'élève au-dessus des cieux, et ta fidélité jusqu'aux nues.\n\nÉlève-toi sur les cieux, ô Dieu ! Et que ta gloire soit sur toute la terre !\n\nAfin que tes bien-aimés soient délivrés, sauve par ta droite, et exauce-nous !\n\nDieu a dit dans sa sainteté : je triompherai, je partagerai Sichem, je mesurerai la vallée de Succoth ;\n\nà moi Galaad, à moi Manassé ; Éphraïm est le rempart de ma tête, et Juda, mon sceptre ;\n\nMoab est le bassin où je me lave ; je jette mon soulier sur Édom ; je pousse des cris de joie sur le pays des Philistins !\n\nQui me mènera dans la ville forte ? Qui me conduit à Édom ?\n\nN'est-ce pas toi, ô Dieu, qui nous as repoussés, et qui ne sortais plus, ô Dieu, avec nos armées ?\n\nDonne-nous du secours contre la détresse ! Le secours de l'homme n'est que vanité.\n\nAvec Dieu, nous ferons des exploits ; il écrasera nos ennemis.\n", "109": "Psaume 109.\n\nAu chef des chantres. De David. Psaume. Dieu de ma louange, ne te tais point !\n\nCar ils ouvrent contre moi une bouche méchante et trompeuse, ils me parlent avec une langue mensongère,\n\nils m'environnent de discours haineux et ils me font la guerre sans cause.\n\nTandis que je les aime, ils sont mes adversaires ; mais moi je recours à la prière.\n\nIls me rendent le mal pour le bien, et de la haine pour mon amour.\n\nPlace-le sous l'autorité d'un méchant, et qu'un accusateur se tienne à sa droite !\n\nQuand on le jugera, qu'il soit déclaré coupable, et que sa prière passe pour un péché !\n\nQue ses jours soient peu nombreux, qu'un autre prenne sa charge !\n\nQue ses enfants deviennent orphelins, et sa femme veuve !\n\nQue ses enfants soient vagabonds et qu'ils mendient, qu'ils cherchent du pain loin de leur demeure en ruines !\n\nQue le créancier s'empare de tout ce qui est à lui, et que les étrangers pillent le fruit de son travail !\n\nQue nul ne conserve pour lui de l'affection, et que personne n'ait pitié de ses orphelins !\n\nQue ses descendants soient exterminés, et que leur nom s'éteigne dans la génération suivante !\n\nQue l'iniquité de ses pères reste en souvenir devant l'Éternel, et que le péché de sa mère ne soit point effacé !\n\nQu'ils soient toujours présents devant l'Éternel, et qu'il retranche de la terre leur mémoire,\n\nparce qu'il ne s'est pas souvenu d'exercer la miséricorde, parce qu'il a persécuté le malheureux et l'indigent, jusqu'à faire mourir l'homme au cœur brisé !\n\nIl aimait la malédiction : qu'elle tombe sur lui ! Il ne se plaisait pas à la bénédiction : qu'elle s'éloigne de lui !\n\nQu'il revête la malédiction comme son vêtement, qu'elle pénètre comme de l'eau dans son intérieur, comme de l'huile dans ses os !\n\nQu'elle lui serve de vêtement pour se couvrir, de ceinture dont il soit toujours ceint !\n\nTel soit, de la part de l'Éternel, le salaire de mes ennemis, et de ceux qui parlent méchamment de moi !\n\nEt toi, Éternel, Seigneur ! agis en ma faveur à cause de ton nom, car ta bonté est grande ; délivre-moi !\n\nJe suis malheureux et indigent, et mon cœur est blessé au dedans de moi.\n\nJe m'en vais comme l'ombre à son déclin, je suis chassé comme la sauterelle.\n\nMes genoux sont affaiblis par le jeûne, et mon corps est épuisé de maigreur.\n\nJe suis pour eux un objet d'opprobre ; ils me regardent, et secouent la tête.\n\nSecours-moi, Éternel, mon Dieu ! Sauve-moi par ta bonté !\n\nEt qu'ils sachent que c'est ta main, que c'est toi, Éternel, qui l'as fait !\n\nS'ils maudissent, toi tu béniras ; s'ils se lèvent, ils seront confus, et ton serviteur se réjouira.\n\nQue mes adversaires revêtent l'ignominie, qu'ils se couvrent de leur honte comme d'un manteau !\n\nJe louerai de ma bouche hautement l'Éternel, je le célébrerai au milieu de la multitude ;\n\ncar il se tient à la droite du pauvre, pour le délivrer de ceux qui le condamnent.\n", "110": "Psaume 110.\n\nDe David. Psaume. Parole de l'Éternel à mon Seigneur : assieds-toi à ma droite, jusqu'à ce que je fasse de tes ennemis ton marchepied.\n\nL'Éternel étendra de Sion le sceptre de ta puissance : domine au milieu de tes ennemis !\n\nTon peuple est plein d'ardeur, quand tu rassembles ton armée ; avec des ornements sacrés, du sein de l'aurore ta jeunesse vient à toi comme une rosée.\n\nL'Éternel l'a juré, et il ne s'en repentira point : tu es sacrificateur pour toujours, à la manière de Melchisédek.\n\nLe Seigneur, à ta droite, brise des rois au jour de sa colère.\n\nIl exerce la justice parmi les nations : tout est plein de cadavres ; il brise des têtes sur toute l'étendue du pays.\n\nIl boit au torrent pendant la marche : c'est pourquoi il relève la tête.\n", "111": "Psaume 111.\n\nLouez l'Éternel ! Je louerai l'Éternel de tout mon cœur, dans la réunion des hommes droits et dans l'assemblée.\n\nLes œuvres de l'Éternel sont grandes, recherchées par tous ceux qui les aiment.\n\nSon œuvre n'est que splendeur et magnificence, et sa justice subsiste à jamais.\n\nIl a laissé la mémoire de ses prodiges, l'Éternel miséricordieux et compatissant.\n\nIl a donné de la nourriture à ceux qui le craignent ; il se souvient toujours de son alliance.\n\nIl a manifesté à son peuple la puissance de ses œuvres, en lui livrant l'héritage des nations.\n\nLes œuvres de ses mains sont fidélité et justice ; toutes ses ordonnances sont véritables,\n\naffermies pour l'éternité, faites avec fidélité et droiture.\n\nIl a envoyé la délivrance à son peuple, il a établi pour toujours son alliance ; son nom est saint et redoutable.\n\nLa crainte de l'Éternel est le commencement de la sagesse ; tous ceux qui l'observent ont une raison saine. Sa gloire subsiste à jamais.\n", "112": "Psaume 112.\n\nLouez l'Éternel ! Heureux l'homme qui craint l'Éternel, qui trouve un grand plaisir à ses commandements.\n\nSa postérité sera puissante sur la terre, la génération des hommes droits sera bénie.\n\nIl a dans sa maison bien-être et richesse, et sa justice subsiste à jamais.\n\nLa lumière se lève dans les ténèbres pour les hommes droits, pour celui qui est miséricordieux, compatissant et juste.\n\nHeureux l'homme qui exerce la miséricorde et qui prête. Qui règle ses actions d'après la justice.\n\nCar il ne chancelle jamais ; la mémoire du juste dure toujours.\n\nIl ne craint point les mauvaises nouvelles ; son cœur est ferme, confiant en l'Éternel.\n\nSon cœur est affermi ; il n'a point de crainte, jusqu'à ce qu'il mette son plaisir à regarder ses adversaires.\n\nIl fait des largesses, il donne aux indigents ; sa justice subsiste à jamais ; sa tête s'élève avec gloire,\n\nle méchant le voit et s'irrite, il grince les dents et se consume ; les désirs des méchants périssent.\n", "113": "Psaume 113.\n\nLouez l'Éternel ! Serviteurs de l'Éternel, louez, louez le nom de l'Éternel !\n\nQue le nom de l'Éternel soit béni, dès maintenant et à jamais !\n\nDu lever du soleil jusqu'à son couchant, que le nom de l'Éternel soit célébré !\n\nL'Éternel est élevé au-dessus de toutes les nations, sa gloire est au-dessus des cieux.\n\nQui est semblable à l'Éternel, notre Dieu ? Il a sa demeure en haut ;\n\nil abaisse les regards sur les cieux et sur la terre.\n\nDe la poussière il retire le pauvre, du fumier il relève l'indigent,\n\npour les faire asseoir avec les grands, avec les grands de son peuple.\n\nIl donne une maison à celle qui était stérile, il en fait une mère joyeuse au milieu de ses enfants. Louez l'Éternel !\n", "114": "Psaume 114.\n\nQuand Israël sortit d'Égypte, quand la maison de Jacob s'éloigna d'un peuple barbare,\n\nJuda devint son sanctuaire, Israël fut son domaine.\n\nLa mer le vit et s'enfuit, le Jourdain retourna en arrière ;\n\nles montagnes sautèrent comme des béliers, les collines comme des agneaux.\n\nQu'as-tu, mer, pour t'enfuir, Jourdain, pour retourner en arrière ?\n\nQu'avez-vous, montagnes, pour sauter comme des béliers, et vous, collines, comme des agneaux ?\n\nTremble devant le Seigneur, ô terre ! Devant le Dieu de Jacob,\n\nqui change le rocher en étang, le roc en source d'eaux.\n", "115": "Psaume 115.\n\nNon pas à nous, Éternel, non pas à nous, mais à ton nom donne gloire, à cause de ta bonté, à cause de ta fidélité !\n\nPourquoi les nations diraient-elles : où donc est leur Dieu ?\n\nNotre Dieu est au ciel, il fait tout ce qu'il veut.\n\nLeurs idoles sont de l'argent et de l'or, elles sont l'ouvrage de la main des hommes.\n\nElles ont une bouche et ne parlent point, elles ont des yeux et ne voient point,\n\nelles ont des oreilles et n'entendent point, elles ont un nez et ne sentent point,\n\nelles ont des mains et ne touchent point, des pieds et ne marchent point, elles ne produisent aucun son dans leur gosier.\n\nIls leur ressemblent, ceux qui les fabriquent, tous ceux qui se confient en elles.\n\nIsraël, confie-toi en l'Éternel ! Il est leur secours et leur bouclier.\n\nMaison d'Aaron, confie-toi en l'Éternel ! Il est leur secours et leur bouclier.\n\nVous qui craignez l'Éternel, confiez-vous en l'Éternel ! Il est leur secours et leur bouclier.\n\nL'Éternel se souvient de nous : il bénira, il bénira la maison d'Israël, il bénira la maison d'Aaron,\n\nil bénira ceux qui craignent l'Éternel, les petits et les grands ;\n\nl'Éternel vous multipliera ses faveurs, à vous et à vos enfants.\n\nSoyez bénis par l'Éternel, qui a fait les cieux et la terre !\n\nLes cieux sont les cieux de l'Éternel, mais il a donné la terre aux fils de l'homme.\n\nCe ne sont pas les morts qui célèbrent l'Éternel, ce n'est aucun de ceux qui descendent dans le lieu du silence ;\n\nmais nous, nous bénirons l'Éternel, dès maintenant et à jamais. Louez l'Éternel !\n", "116": "Psaume 116.\n\nJ'aime l'Éternel, car il entend ma voix, mes supplications ;\n\ncar il a penché son oreille vers moi ; et je l'invoquerai toute ma vie.\n\nLes liens de la mort m'avaient environné, et les angoisses du sépulcre m'avaient saisi ; j'étais en proie à la détresse et à la douleur.\n\nMais j'invoquai le nom de l'Éternel : Ô Éternel, sauve mon âme !\n\nL'Éternel est miséricordieux et juste, notre Dieu est plein de compassion ;\n\nl'Éternel garde les simples ; j'étais malheureux, et il m'a sauvé.\n\nMon âme, retourne à ton repos, car l'Éternel t'a fait du bien.\n\nOui, tu as délivré mon âme de la mort, mes yeux des larmes, mes pieds de la chute.\n\nJe marcherai devant l'Éternel, sur la terre des vivants.\n\nJ'avais confiance, lorsque je disais : Je suis bien malheureux !\n\nJe disais dans mon angoisse : tout homme est trompeur.\n\nComment rendrai-je à l'Éternel tous ses bienfaits envers moi ?\n\nJ'élèverai la coupe des délivrances, et j'invoquerai le nom de l'Éternel ;\n\nj'accomplirai mes vœux envers l'Éternel, en présence de tout son peuple.\n\nElle a du prix aux yeux de l'Éternel, la mort de ceux qui l'aiment.\n\nÉcoute-moi, ô Éternel ! car je suis ton serviteur, ton serviteur, fils de ta servante. Tu as détaché mes liens.\n\nJe t'offrirai un sacrifice d'actions de grâces, et j'invoquerai le nom de l'Éternel ;\n\nj'accomplirai mes vœux envers l'Éternel, en présence de tout son peuple,\n\ndans les parvis de la maison de l'Éternel, au milieu de toi, Jérusalem ! Louez l'Éternel !\n", "117": "Psaume 117.\n\nLouez l'Éternel, vous toutes les nations, célébrez-le, vous tous les peuples !\n\nCar sa bonté pour nous est grande, et sa fidélité dure à toujours. Louez l'Éternel !\n", "118": "Psaume 118.\n\nLouez l'Éternel, car il est bon, car sa miséricorde dure à toujours !\n\nQu'Israël dise : Car sa miséricorde dure à toujours !\n\nQue la maison d'Aaron dise : Car sa miséricorde dure à toujours !\n\nQue ceux qui craignent l'Éternel disent : Car sa miséricorde dure à toujours !\n\nDu sein de la détresse j'ai invoqué l'Éternel : l'Éternel m'a exaucé, m'a mis au large.\n\nL'Éternel est pour moi, je ne crains rien : que peuvent me faire des hommes ?\n\nL'Éternel est mon secours, et je me réjouis à la vue de mes ennemis.\n\nMieux vaut chercher un refuge en l'Éternel que de se confier à l'homme ;\n\nmieux vaut chercher un refuge en l'Éternel que de se confier aux grands.\n\nToutes les nations m'environnaient : au nom de l'Éternel, je les taille en pièces.\n\nElles m'environnaient, m'enveloppaient : au nom de l'Éternel, je les taille en pièces.\n\nElles m'environnaient comme des abeilles ; elles s'éteignent comme un feu d'épines ; au nom de l'Éternel, je les taille en pièces.\n\nTu me poussais pour me faire tomber ; mais l'Éternel m'a secouru.\n\nL'Éternel est ma force et le sujet de mes louanges ; c'est lui qui m'a sauvé.\n\nDes cris de triomphe et de salut s'élèvent dans les tentes des justes : la droite de l'Éternel manifeste sa puissance !\n\nLa droite de l'Éternel est élevée ! La droite de l'Éternel manifeste sa puissance !\n\nJe ne mourrai pas, je vivrai, et je raconterai les œuvres de l'Éternel.\n\nL'Éternel m'a châtié, mais il ne m'a pas livré à la mort.\n\nOuvrez-moi les portes de la justice : j'entrerai, je louerai l'Éternel.\n\nVoici la porte de l'Éternel : c'est par elle qu'entrent les justes.\n\nJe te loue, parce que tu m'as exaucé, parce que tu m'as sauvé.\n\nLa pierre qu'ont rejetée ceux qui bâtissaient est devenue la principale de l'angle.\n\nC'est de l'Éternel que cela est venu : c'est un prodige à nos yeux.\n\nC'est ici la journée que l'Éternel a faite : qu'elle soit pour nous un sujet d'allégresse et de joie !\n\nÔ Éternel, accorde le salut ! Ô Éternel, donne la prospérité !\n\nBéni soit celui qui vient au nom de l'Éternel ! Nous vous bénissons de la maison de l'Éternel.\n\nL'Éternel est Dieu, et il nous éclaire. Attachez la victime avec des liens, amenez-la jusqu'aux cornes de l'autel !\n\nTu es mon Dieu, et je te louerai ; mon Dieu ! je t'exalterai.\n\nLouez l'Éternel, car il est bon, car sa miséricorde dure à toujours !\n", "119": "Psaume 119.\n\nHeureux ceux qui sont intègres dans leur voie, qui marchent selon la loi de l'Éternel !\n\nHeureux ceux qui gardent ses préceptes, qui le cherchent de tout leur cœur,\n\nqui ne commettent point d'iniquité, et qui marchent dans ses voies !\n\nTu as prescrit tes ordonnances, pour qu'on les observe avec soin.\n\nPuissent mes actions être bien réglées, afin que je garde tes statuts !\n\nAlors je ne rougirai point, à la vue de tous tes commandements.\n\nJe te louerai dans la droiture de mon cœur, en apprenant les lois de ta justice.\n\nJe veux garder tes statuts : ne m'abandonne pas entièrement !\n\nComment le jeune homme rendra-t-il pur son sentier ? En se dirigeant d'après ta parole.\n\nJe te cherche de tout mon cœur : ne me laisse pas égarer loin de tes commandements !\n\nJe serre ta parole dans mon cœur, afin de ne pas pécher contre toi.\n\nBéni sois-tu, ô Éternel ! Enseigne-moi tes statuts !\n\nDe mes lèvres j'énumère toutes les sentences de ta bouche.\n\nJe me réjouis en suivant tes préceptes, comme si je possédais tous les trésors.\n\nJe médite tes ordonnances, j'ai tes sentiers sous les yeux.\n\nJe fais mes délices de tes statuts, je n'oublie point ta parole.\n\nFais du bien à ton serviteur, pour que je vive et que j'observe ta parole !\n\nOuvre mes yeux, pour que je contemple les merveilles de ta loi !\n\nJe suis un étranger sur la terre : ne me cache pas tes commandements !\n\nMon âme est brisée par le désir qui toujours la porte vers tes lois.\n\nTu menaces les orgueilleux, ces maudits, qui s'égarent loin de tes commandements.\n\nDécharge-moi de l'opprobre et du mépris ! Car j'observe tes préceptes.\n\nDes princes ont beau s'asseoir et parler contre moi, ton serviteur médite tes statuts.\n\nTes préceptes font mes délices, ce sont mes conseillers.\n\nMon âme est attachée à la poussière : rends-moi la vie selon ta parole !\n\nJe raconte mes voies, et tu m'exauces : enseigne-moi tes statuts !\n\nFais-moi comprendre la voie de tes ordonnances, et je méditerai sur tes merveilles !\n\nMon âme pleure de chagrin : relève-moi selon ta parole !\n\nÉloigne de moi la voie du mensonge, et accorde-moi la grâce de suivre ta loi !\n\nJe choisis la voie de la vérité, je place tes lois sous mes yeux.\n\nJe m'attache à tes préceptes : Éternel, ne me rends point confus !\n\nJe cours dans la voie de tes commandements, car tu élargis mon cœur.\n\nEnseigne-moi, Éternel, la voie de tes statuts, pour que je la retienne jusqu'à la fin !\n\nDonne-moi l'intelligence, pour que je garde ta loi et que je l'observe de tout mon cœur !\n\nConduis-moi dans le sentier de tes commandements ! Car je l'aime.\n\nIncline mon cœur vers tes préceptes, et non vers le gain !\n\nDétourne mes yeux de la vue des choses vaines, fais-moi vivre dans ta voie !\n\nAccomplis envers ton serviteur ta promesse, qui est pour ceux qui te craignent !\n\nÉloigne de moi l'opprobre que je redoute ! Car tes jugements sont pleins de bonté.\n\nVoici, je désire pratiquer tes ordonnances : fais-moi vivre dans ta justice !\n\nÉternel, que ta miséricorde vienne sur moi, ton salut selon ta promesse !\n\nEt je pourrai répondre à celui qui m'outrage, car je me confie en ta parole.\n\nN'ôte pas entièrement de ma bouche la parole de la vérité ! Car j'espère en tes jugements.\n\nJe garderai ta loi constamment, à toujours et à perpétuité.\n\nJe marcherai au large, car je recherche tes ordonnances.\n\nJe parlerai de tes préceptes devant les rois, et je ne rougirai point.\n\nJe fais mes délices de tes commandements. Je les aime.\n\nJe lève mes mains vers tes commandements que j'aime, et je veux méditer tes statuts.\n\nSouviens-toi de ta promesse à ton serviteur, puisque tu m'as donné l'espérance !\n\nC'est ma consolation dans ma misère, car ta promesse me rend la vie.\n\nDes orgueilleux me chargent de railleries ; je ne m'écarte point de ta loi.\n\nJe pense à tes jugements d'autrefois, ô Éternel ! Et je me console.\n\nUne colère ardente me saisit à la vue des méchants qui abandonnent ta loi.\n\nTes statuts sont le sujet de mes cantiques, dans la maison où je suis étranger.\n\nLa nuit je me rappelle ton nom, ô Éternel ! Et je garde ta loi.\n\nC'est là ce qui m'est propre, car j'observe tes ordonnances.\n\nMa part, ô Éternel ! je le dis, c'est de garder tes paroles.\n\nJe t'implore de tout mon cœur : aie pitié de moi, selon ta promesse !\n\nJe réfléchis à mes voies, et je dirige mes pieds vers tes préceptes.\n\nJe me hâte, je ne diffère point d'observer tes commandements.\n\nLes pièges des méchants m'environnent ; je n'oublie point ta loi.\n\nAu milieu de la nuit je me lève pour te louer, à cause des jugements de ta justice.\n\nJe suis l'ami de tous ceux qui te craignent, et de ceux qui gardent tes ordonnances.\n\nLa terre, ô Éternel ! est pleine de ta bonté ; enseigne-moi tes statuts !\n\nTu fais du bien à ton serviteur, Ô Éternel ! selon ta promesse.\n\nEnseigne-moi le bon sens et l'intelligence ! Car je crois à tes commandements.\n\nAvant d'avoir été humilié, je m'égarais ; maintenant j'observe ta parole.\n\nTu es bon et bienfaisant ; enseigne-moi tes statuts !\n\nDes orgueilleux imaginent contre moi des faussetés ; moi, je garde de tout mon cœur tes ordonnances.\n\nLeur cœur est insensible comme la graisse ; moi, je fais mes délices de ta loi.\n\nIl m'est bon d'être humilié, afin que j'apprenne tes statuts.\n\nMieux vaut pour moi la loi de ta bouche que mille objets d'or et d'argent.\n\nTes mains m'ont créé, elles m'ont formé ; donne-moi l'intelligence, pour que j'apprenne tes commandements !\n\nCeux qui te craignent me voient et se réjouissent, car j'espère en tes promesses.\n\nJe sais, ô Éternel ! que tes jugements sont justes ; c'est par fidélité que tu m'as humilié.\n\nQue ta bonté soit ma consolation, comme tu l'as promis à ton serviteur !\n\nQue tes compassions viennent sur moi, pour que je vive ! Car ta loi fait mes délices.\n\nQu'ils soient confondus, les orgueilleux qui m'oppriment sans cause ! Moi, je médite sur tes ordonnances.\n\nQu'ils reviennent à moi, ceux qui te craignent, et ceux qui connaissent tes préceptes !\n\nQue mon cœur soit sincère dans tes statuts, afin que je ne sois pas couvert de honte !\n\nMon âme languit après ton salut ; j'espère en ta promesse.\n\nMes yeux languissent après ta promesse ; je dis : Quand me consoleras-tu ?\n\nCar je suis comme une outre dans la fumée ; je n'oublie point tes statuts.\n\nQuel est le nombre des jours de ton serviteur ? Quand feras-tu justice de ceux qui me persécutent ?\n\nDes orgueilleux creusent des fosses devant moi ; ils n'agissent point selon ta loi.\n\nTous tes commandements ne sont que fidélité ; ils me persécutent sans cause : secours-moi !\n\nIls ont failli me terrasser et m'anéantir ; et moi, je n'abandonne point tes ordonnances.\n\nRends-moi la vie selon ta bonté, afin que j'observe les préceptes de ta bouche !\n\nÀ toujours, ô Éternel ! Ta parole subsiste dans les cieux.\n\nDe génération en génération ta fidélité subsiste ; tu as fondé la terre, et elle demeure ferme.\n\nC'est d'après tes lois que tout subsiste aujourd'hui, car toutes choses te sont assujetties.\n\nSi ta loi n'eût fait mes délices, j'eusse alors péri dans ma misère.\n\nJe n'oublierai jamais tes ordonnances, car c'est par elles que tu me rends la vie.\n\nJe suis à toi : sauve-moi ! Car je recherche tes ordonnances.\n\nDes méchants m'attendent pour me faire périr ; je suis attentif à tes préceptes.\n\nJe vois des bornes à tout ce qui est parfait : tes commandements n'ont point de limite.\n\nCombien j'aime ta loi ! Elle est tout le jour l'objet de ma méditation.\n\nTes commandements me rendent plus sage que mes ennemis, car je les ai toujours avec moi.\n\nJe suis plus instruit que tous mes maîtres, car tes préceptes sont l'objet de ma méditation.\n\nJ'ai plus d'intelligence que les vieillards, car j'observe tes ordonnances.\n\nJe retiens mon pied loin de tout mauvais chemin, afin de garder ta parole.\n\nJe ne m'écarte pas de tes lois, car c'est toi qui m'enseignes.\n\nQue tes paroles sont douces à mon palais, plus que le miel à ma bouche !\n\nPar tes ordonnances je deviens intelligent, aussi je hais toute voie de mensonge.\n\nTa parole est une lampe à mes pieds, et une lumière sur mon sentier.\n\nJe jure, et je le tiendrai, d'observer les lois de ta justice.\n\nJe suis bien humilié : Éternel, rends-moi la vie selon ta parole !\n\nAgrée, ô Éternel ! les sentiments que ma bouche exprime, et enseigne-moi tes lois !\n\nMa vie est continuellement exposée, et je n'oublie point ta loi.\n\nDes méchants me tendent des pièges, et je ne m'égare pas loin de tes ordonnances.\n\nTes préceptes sont pour toujours mon héritage, car ils sont la joie de mon cœur.\n\nJ'incline mon cœur à pratiquer tes statuts, toujours, jusqu'à la fin.\n\nJe hais les hommes indécis, et j'aime ta loi.\n\nTu es mon asile et mon bouclier ; j'espère en ta promesse.\n\nÉloignez-vous de moi, méchants, afin que j'observe les commandements de mon Dieu !\n\nSoutiens-moi selon ta promesse, afin que je vive, et ne me rends point confus dans mon espérance !\n\nSois mon appui, pour que je sois sauvé, et que je m'occupe sans cesse de tes statuts !\n\nTu méprises tous ceux qui s'écartent de tes statuts, car leur tromperie est sans effet.\n\nTu enlèves comme de l'écume tous les méchants de la terre ; c'est pourquoi j'aime tes préceptes.\n\nMa chair frissonne de l'effroi que tu m'inspires, et je crains tes jugements.\n\nJ'observe la loi et la justice : ne m'abandonne pas à mes oppresseurs !\n\nPrends sous ta garantie le bien de ton serviteur, ne me laisse pas opprimer par des orgueilleux !\n\nMes yeux languissent après ton salut, et après la promesse de ta justice.\n\nAgis envers ton serviteur selon ta bonté, et enseigne-moi tes statuts !\n\nJe suis ton serviteur : donne-moi l'intelligence, pour que je connaisse tes préceptes !\n\nIl est temps que l'Éternel agisse : ils transgressent ta loi.\n\nC'est pourquoi j'aime tes commandements, plus que l'or et que l'or fin ;\n\nc'est pourquoi je trouve justes toutes tes ordonnances, je hais toute voie de mensonge.\n\nTes préceptes sont admirables : aussi mon âme les observe.\n\nLa révélation de tes paroles éclaire, elle donne de l'intelligence aux simples.\n\nJ'ouvre la bouche et je soupire, car je suis avide de tes commandements.\n\nTourne vers moi ta face, et aie pitié de moi, selon ta coutume à l'égard de ceux qui aiment ton nom !\n\nAffermis mes pas dans ta parole, et ne laisse aucune iniquité dominer sur moi !\n\nDélivre-moi de l'oppression des hommes, afin que je garde tes ordonnances !\n\nFais luire ta face sur ton serviteur, et enseigne-moi tes statuts !\n\nMes yeux répandent des torrents d'eaux, parce qu'on n'observe point ta loi.\n\nTu es juste, ô Éternel ! Et tes jugements sont équitables ;\n\ntu fondes tes préceptes sur la justice et sur la plus grande fidélité.\n\nMon zèle me consume, parce que mes adversaires oublient tes paroles.\n\nTa parole est entièrement éprouvée, et ton serviteur l'aime.\n\nJe suis petit et méprisé ; je n'oublie point tes ordonnances.\n\nTa justice est une justice éternelle, et ta loi est la vérité.\n\nLa détresse et l'angoisse m'atteignent : tes commandements font mes délices.\n\nTes préceptes sont éternellement justes : donne-moi l'intelligence, pour que je vive !\n\nJe t'invoque de tout mon cœur : exauce-moi, Éternel, afin que je garde tes statuts !\n\nJe t'invoque : sauve-moi, afin que j'observe tes préceptes !\n\nJe devance l'aurore et je crie ; j'espère en tes promesses.\n\nJe devance les veilles et j'ouvre les yeux, pour méditer ta parole.\n\nÉcoute ma voix selon ta bonté ! Rends-moi la vie selon ton jugement !\n\nIls s'approchent, ceux qui poursuivent le crime, ils s'éloignent de la loi.\n\nTu es proche, ô Éternel ! Et tous tes commandements sont la vérité.\n\nDès longtemps je sais par tes préceptes que tu les as établis pour toujours.\n\nVois ma misère, et délivre-moi ! Car je n'oublie point ta loi.\n\nDéfends ma cause, et rachète-moi ; rends-moi la vie selon ta promesse !\n\nLe salut est loin des méchants, car ils ne recherchent pas tes statuts.\n\nTes compassions sont grandes, ô Éternel ! Rends-moi la vie selon tes jugements !\n\nMes persécuteurs et mes adversaires sont nombreux ; je ne m'écarte point de tes préceptes,\n\nje vois avec dégoût des traîtres qui n'observent pas ta parole.\n\nConsidère que j'aime tes ordonnances : Éternel, rends-moi la vie selon ta bonté !\n\nLe fondement de ta parole est la vérité, et toutes les lois de ta justice sont éternelles.\n\nDes princes me persécutent sans cause ; mais mon cœur ne tremble qu'à tes paroles.\n\nJe me réjouis de ta parole, comme celui qui trouve un grand butin.\n\nJe hais, je déteste le mensonge ; j'aime ta loi.\n\nSept fois le jour je te célèbre, à cause des lois de ta justice.\n\nIl y a beaucoup de paix pour ceux qui aiment ta loi, et il ne leur arrive aucun malheur.\n\nJ'espère en ton salut, ô Éternel ! Et je pratique tes commandements.\n\nMon âme observe tes préceptes, et je les aime beaucoup.\n\nJe garde tes ordonnances et tes préceptes, car toutes mes voies sont devant toi.\n\nQue mon cri parvienne jusqu'à toi, ô Éternel ! Donne-moi l'intelligence, selon ta promesse !\n\nQue ma supplication arrive jusqu'à toi ! Délivre-moi, selon ta promesse !\n\nQue mes lèvres publient ta louange ! Car tu m'enseignes tes statuts.\n\nQue ma langue chante ta parole ! Car tous tes commandements sont justes.\n\nQue ta main me soit en aide ! Car j'ai choisi tes ordonnances.\n\nJe soupire après ton salut, ô Éternel ! Et ta loi fait mes délices.\n\nQue mon âme vive et qu'elle te loue ! Et que tes jugements me soutiennent !\n\nJe suis errant comme une brebis perdue ; cherche ton serviteur, car je n'oublie point tes commandements.\n", "120": "Psaume 120.\n\nCantique des degrés. Dans ma détresse, c'est à l'Éternel que je crie, et il m'exauce.\n\nÉternel, délivre mon âme de la lèvre mensongère, de la langue trompeuse !\n\nQue te donne, que te rapporte une langue trompeuse ?\n\nLes traits aigus du guerrier, avec les charbons ardents du genêt.\n\nMalheureux que je suis de séjourner à Méschec, d'habiter parmi les tentes de Kédar !\n\nAssez longtemps mon âme a demeuré auprès de ceux qui haïssent la paix.\n\nJe suis pour la paix ; mais dès que je parle, ils sont pour la guerre.\n", "121": "Psaume 121.\n\nCantique des degrés. Je lève mes yeux vers les montagnes... D'où me viendra le secours ?\n\nLe secours me vient de l'Éternel, qui a fait les cieux et la terre.\n\nIl ne permettra point que ton pied chancelle ; celui qui te garde ne sommeillera point.\n\nVoici, il ne sommeille ni ne dort, celui qui garde Israël.\n\nL'Éternel est celui qui te garde, l'Éternel est ton ombre à ta main droite.\n\nPendant le jour le soleil ne te frappera point, ni la lune pendant la nuit.\n\nL'Éternel te gardera de tout mal, il gardera ton âme ;\n\nl'Éternel gardera ton départ et ton arrivée, dès maintenant et à jamais.\n", "122": "Psaume 122.\n\nCantique des degrés. De David. Je suis dans la joie quand on me dit : Allons à la maison de l'Éternel !\n\nNos pieds s'arrêtent dans tes portes, Jérusalem !\n\nJérusalem, tu es bâtie comme une ville dont les parties sont liées ensemble.\n\nC'est là que montent les tribus, les tribus de l'Éternel, selon la loi d'Israël, pour louer le nom de l'Éternel.\n\nCar là sont les trônes pour la justice, les trônes de la maison de David.\n\nDemandez la paix de Jérusalem. Que ceux qui t'aiment jouissent du repos !\n\nQue la paix soit dans tes murs, et la tranquillité dans tes palais !\n\nÀ cause de mes frères et de mes amis, je désire la paix dans ton sein ;\n\nà cause de la maison de l'Éternel, notre Dieu, je fais des vœux pour ton bonheur.\n", "123": "Psaume 123.\n\nCantique des degrés, je lève mes yeux vers toi, qui sièges dans les cieux.\n\nVoici, comme les yeux des serviteurs sont fixés sur la main de leurs maîtres, et les yeux de la servante sur la main de sa maîtresse, ainsi nos yeux se tournent vers l'Éternel, notre Dieu, jusqu'à ce qu'il ait pitié de nous.\n\nAie pitié de nous, Éternel, aie pitié de nous ! Car nous sommes assez rassasiés de mépris ;\n\nnotre âme est assez rassasiée des moqueries des orgueilleux, du mépris des hautains.\n", "124": "Psaume 124.\n\nCantique des degrés. De David. Sans l'Éternel qui nous protégea, qu'Israël le dise !\n\nSans l'Éternel qui nous protégea, quand les hommes s'élevèrent contre nous,\n\nils nous auraient engloutis tout vivants, quand leur colère s'enflamma contre nous ;\n\nalors les eaux nous auraient submergés, les torrents auraient passé sur notre âme ;\n\nalors auraient passé sur notre âme les flots impétueux.\n\nBéni soit l'Éternel, qui ne nous a pas livrés en proie à leurs dents !\n\nNotre âme s'est échappée comme l'oiseau du filet des oiseleurs ; le filet s'est rompu, et nous nous sommes échappés.\n\nNotre secours est dans le nom de l'Éternel, qui a fait les cieux et la terre.\n", "125": "Psaume 125.\n\nCantique des degrés. Ceux qui se confient en l'Éternel sont comme la montagne de Sion : elle ne chancelle point, elle est affermie pour toujours.\n\nDes montagnes entourent Jérusalem ; ainsi l'Éternel entoure son peuple, dès maintenant et à jamais.\n\nCar le sceptre de la méchanceté ne restera pas sur le lot des justes, afin que les justes ne tendent pas les mains vers l'iniquité.\n\nÉternel, répands tes bienfaits sur les bons et sur ceux dont le cœur est droit !\n\nMais ceux qui s'engagent dans des voies détournées, que l'Éternel les détruise avec ceux qui font le mal ! Que la paix soit sur Israël !\n", "126": "Psaume 126.\n\nCantique des degrés. Quand l'Éternel ramena les captifs de Sion, nous étions comme ceux qui font un rêve.\n\nAlors notre bouche était remplie de cris de joie, et notre langue de chants d'allégresse ; alors on disait parmi les nations : l'Éternel a fait pour eux de grandes choses !\n\nL'Éternel a fait pour nous de grandes choses ; nous sommes dans la joie.\n\nÉternel, ramène nos captifs, comme des ruisseaux dans le midi !\n\nCeux qui sèment avec larmes Moissonneront avec chants d'allégresse.\n\nCelui qui marche en pleurant, quand il porte la semence, revient avec allégresse, quand il porte ses gerbes.\n", "127": "Psaume 127.\n\nCantique des degrés. De salomon. Si l'Éternel ne bâtit la maison, ceux qui la bâtissent travaillent en vain ; si l'Éternel ne garde la ville, celui qui la garde veille en vain.\n\nEn vain vous levez-vous matin, vous couchez-vous tard, et mangez-vous le pain de douleur ; il en donne autant à ses bien-aimés pendant leur sommeil.\n\nVoici, des fils sont un héritage de l'Éternel, le fruit des entrailles est une récompense.\n\nComme les flèches dans la main d'un guerrier, ainsi sont les fils de la jeunesse.\n\nHeureux l'homme qui en a rempli son carquois ! Ils ne seront pas confus, quand ils parleront avec des ennemis à la porte.\n", "128": "Psaume 128.\n\nCantique des degrés. Heureux tout homme qui craint l'Éternel, qui marche dans ses voies !\n\nTu jouis alors du travail de tes mains, tu es heureux, tu prospères.\n\nTa femme est comme une vigne féconde dans l'intérieur de ta maison ; tes fils sont comme des plants d'olivier, autour de ta table.\n\nC'est ainsi qu'est béni l'homme qui craint l'Éternel.\n\nL'Éternel te bénira de Sion, et tu verras le bonheur de Jérusalem tous les jours de ta vie ;\n\ntu verras les fils de tes fils. Que la paix soit sur Israël !\n", "129": "Psaume 129.\n\nCantique des degrés. Ils m'ont assez opprimé dès ma jeunesse, qu'Israël le dise !\n\nIls m'ont assez opprimé dès ma jeunesse, mais ils ne m'ont pas vaincu.\n\nDes laboureurs ont labouré mon dos, ils y ont tracé de longs sillons.\n\nL'Éternel est juste : il a coupé les cordes des méchants.\n\nQu'ils soient confondus et qu'ils reculent, tous ceux qui haïssent Sion !\n\nQu'ils soient comme l'herbe des toits, qui sèche avant qu'on l'arrache !\n\nLe moissonneur n'en remplit point sa main, celui qui lie les gerbes n'en charge point son bras,\n\net les passants ne disent point : que la bénédiction de l'Éternel soit sur vous ! Nous vous bénissons au nom de l'Éternel !\n", "130": "Psaume 130.\n\nCantique des degrés. Du fond de l'abîme je t'invoque, ô Éternel !\n\nSeigneur, écoute ma voix ! Que tes oreilles soient attentives à la voix de mes supplications !\n\nSi tu gardais le souvenir des iniquités, Éternel, Seigneur, qui pourrait subsister ?\n\nMais le pardon se trouve auprès de toi, afin qu'on te craigne.\n\nJ'espère en l'Éternel, mon âme espère, et j'attends sa promesse.\n\nMon âme compte sur le Seigneur, plus que les gardes ne comptent sur le matin, que les gardes ne comptent sur le matin.\n\nIsraël, mets ton espoir en l'Éternel ! Car la miséricorde est auprès de l'Éternel, et la rédemption est auprès de lui en abondance.\n\nC'est lui qui rachètera Israël de toutes ses iniquités.\n", "131": "Psaume 131.\n\nCantique des degrés. De David. Éternel ! je n'ai ni un cœur qui s'enfle, ni des regards hautains ; je ne m'occupe pas de choses trop grandes et trop relevées pour moi.\n\nLoin de là, j'ai l'âme calme et tranquille, comme un enfant sevré qui est auprès de sa mère ; j'ai l'âme comme un enfant sevré.\n\nIsraël, mets ton espoir en l'Éternel, dès maintenant et à jamais !\n", "132": "Psaume 132.\n\nCantique des degrés. Éternel, souviens-toi de David, de toutes ses peines !\n\nIl jura à l'Éternel, il fit ce vœu au puissant de Jacob :\n\nje n'entrerai pas dans la tente où j'habite, je ne monterai pas sur le lit où je repose,\n\nje ne donnerai ni sommeil à mes yeux, ni assoupissement à mes paupières.\n\nJusqu'à ce que j'aie trouvé un lieu pour l'Éternel, une demeure pour le puissant de Jacob.\n\nVoici, nous en entendîmes parler à Éphrata, nous la trouvâmes dans les champs de Jaar...\n\nAllons à sa demeure, prosternons-nous devant son marchepied !...\n\nLève-toi, Éternel, viens à ton lieu de repos, toi et l'arche de ta majesté !\n\nQue tes sacrificateurs soient revêtus de justice, et que tes fidèles poussent des cris de joie !\n\nÀ cause de David, ton serviteur, ne repousse pas ton oint !\n\nL'Éternel a juré la vérité à David, il n'en reviendra pas ; je mettrai sur ton trône un fruit de tes entrailles.\n\nSi tes fils observent mon alliance et mes préceptes que je leur enseigne, leurs fils aussi pour toujours seront assis sur ton trône.\n\nOui, l'Éternel a choisi Sion, il l'a désirée pour sa demeure :\n\nc'est mon lieu de repos à toujours ; j'y habiterai, car je l'ai désirée.\n\nJe bénirai sa nourriture, je rassasierai de pain ses indigents ;\n\nje revêtirai de salut ses sacrificateurs, et ses fidèles pousseront des cris de joie.\n\nLà j'élèverai la puissance de David, je préparerai une lampe à mon oint,\n\nje revêtirai de honte ses ennemis, et sur lui brillera sa couronne.\n", "133": "Psaume 133.\n\nCantique des degrés. De David. Voici, oh ! qu'il est agréable, qu'il est doux pour des frères de demeurer ensemble !\n\nC'est comme l'huile précieuse qui, répandue sur la tête, descend sur la barbe, sur la barbe d'Aaron, qui descend sur le bord de ses vêtements.\n\nC'est comme la rosée de l'Hermon, qui descend sur les montagnes de Sion ; car c'est là que l'Éternel envoie la bénédiction, la vie, pour l'éternité.\n", "134": "Psaume 134.\n\nCantique des degrés. Voici, bénissez l'Éternel, vous tous, serviteurs de l'Éternel, qui vous tenez dans la maison de l'Éternel pendant les nuits !\n\nÉlevez vos mains vers le sanctuaire, et bénissez l'Éternel !\n\nQue l'Éternel te bénisse de Sion, lui qui a fait les cieux et la terre !\n", "135": "Psaume 135.\n\nLouez l'Éternel ! Louez le nom de l'Éternel, louez-le, serviteurs de l'Éternel,\n\nqui vous tenez dans la maison de l'Éternel, dans les parvis de la maison de notre Dieu !\n\nLouez l'Éternel ! car l'Éternel est bon. Chantez à son nom ! car il est favorable.\n\nCar l'Éternel s'est choisi Jacob, Israël, pour qu'il lui appartînt.\n\nJe sais que l'Éternel est grand, et que notre Seigneur est au-dessus de tous les dieux.\n\nTout ce que l'Éternel veut, il le fait, dans les cieux et sur la terre, dans les mers et dans tous les abîmes.\n\nIl fait monter les nuages des extrémités de la terre, il produit les éclairs et la pluie, il tire le vent de ses trésors.\n\nIl frappa les premiers-nés de l'Égypte, depuis les hommes jusqu'aux animaux.\n\nIl envoya des signes et des miracles au milieu de toi, Égypte ! Contre Pharaon et contre tous ses serviteurs.\n\nIl frappa des nations nombreuses, et tua des rois puissants,\n\nSihon, roi des Amoréens, Og, roi de Basan, et tous les rois de Canaan ;\n\net il donna leur pays en héritage, en héritage à Israël, son peuple.\n\nÉternel ! ton nom subsiste à toujours, Éternel ! ta mémoire dure de génération en génération.\n\nCar l'Éternel jugera son peuple, et il aura pitié de ses serviteurs.\n\nLes idoles des nations sont de l'argent et de l'or, elles sont l'ouvrage de la main des hommes.\n\nElles ont une bouche et ne parlent point, elles ont des yeux et ne voient point,\n\nelles ont des oreilles et n'entendent point, elles n'ont point de souffle dans leur bouche.\n\nIls leur ressemblent, ceux qui les fabriquent, tous ceux qui se confient en elles.\n\nMaison d'Israël, bénissez l'Éternel ! Maison d'Aaron, bénissez l'Éternel !\n\nMaison de Lévi, bénissez l'Éternel ! Vous qui craignez l'Éternel, bénissez l'Éternel !\n\nQue de Sion l'on bénisse l'Éternel, qui habite à Jérusalem ! Louez l'Éternel !\n", "136": "Psaume 136.\n\nLouez l'Éternel, car il est bon, car sa miséricorde dure à toujours !\n\nLouez le Dieu des dieux, car sa miséricorde dure à toujours !\n\nLouez le Seigneur des seigneurs, car sa miséricorde dure à toujours !\n\nCelui qui seul fait de grands prodiges, car sa miséricorde dure à toujours !\n\nCelui qui a fait les cieux avec intelligence, car sa miséricorde dure à toujours !\n\nCelui qui a étendu la terre sur les eaux, car sa miséricorde dure à toujours !\n\nCelui qui a fait les grands luminaires, car sa miséricorde dure à toujours !\n\nLe soleil pour présider au jour, car sa miséricorde dure à toujours !\n\nLa lune et les étoiles pour présider à la nuit, car sa miséricorde dure à toujours !\n\nCelui qui frappa les Égyptiens dans leurs premiers-nés, car sa miséricorde dure à toujours !\n\nEt fit sortir Israël du milieu d'eux, car sa miséricorde dure à toujours !\n\nÀ main forte et à bras étendu, car sa miséricorde dure à toujours !\n\nCelui qui coupa en deux la mer Rouge, car sa miséricorde dure à toujours !\n\nQui fit passer Israël au milieu d'elle, car sa miséricorde dure à toujours !\n\nEt précipita Pharaon et son armée dans la mer Rouge, car sa miséricorde dure à toujours !\n\nCelui qui conduisit son peuple dans le désert, car sa miséricorde dure à toujours !\n\nCelui qui frappa de grands rois, car sa miséricorde dure à toujours !\n\nQui tua des rois puissants, car sa miséricorde dure à toujours !\n\nSihon, roi des Amoréens, car sa miséricorde dure à toujours !\n\nEt Og, roi de Basan, car sa miséricorde dure à toujours !\n\nEt donna leur pays en héritage, car sa miséricorde dure à toujours !\n\nEn héritage à Israël, son serviteur, car sa miséricorde dure à toujours !\n\nCelui qui se souvint de nous quand nous étions humiliés, car sa miséricorde dure à toujours !\n\nEt nous délivra de nos oppresseurs, car sa miséricorde dure à toujours !\n\nCelui qui donne la nourriture à toute chair, car sa miséricorde dure à toujours !\n\nLouez le Dieu des cieux, car sa miséricorde dure à toujours !\n", "137": "Psaume 137.\n\nSur les bords des fleuves de Babylone, nous étions assis et nous pleurions, en nous souvenant de Sion.\n\nAux saules de la contrée nous avions suspendu nos harpes.\n\nLà, nos vainqueurs nous demandaient des chants, et nos oppresseurs de la joie : chantez-nous quelques-uns des cantiques de Sion !\n\nComment chanterions-nous les cantiques de l'Éternel sur une terre étrangère ?\n\nSi je t'oublie, Jérusalem, que ma droite m'oublie !\n\nQue ma langue s'attache à mon palais, si je ne me souviens de toi, si je ne fais de Jérusalem le principal sujet de ma joie !\n\nÉternel, souviens-toi des enfants d'Édom, qui, dans la journée de Jérusalem, disaient : Rasez, rasez jusqu'à ses fondements !\n\nFille de Babylone, la dévastée, heureux qui te rend la pareille, le mal que tu nous as fait !\n\nHeureux qui saisit tes enfants, et les écrase sur le roc !\n", "138": "Psaume 138.\n\nDe David. Je te célèbre de tout mon cœur, je chante tes louanges en la présence de Dieu.\n\nJe me prosterne dans ton saint temple, et je célèbre ton nom, à cause de ta bonté et de ta fidélité, car ta renommée s'est accrue par l'accomplissemen de tes promesses.\n\nLe jour où je t'ai invoqué, tu m'as exaucé, tu m'as rassuré, tu as fortifié mon âme.\n\nTous les rois de la terre te loueront, ô Éternel ! En entendant les paroles de ta bouche ;\n\nils célébreront les voies de l'Éternel, car la gloire de l'Éternel est grande.\n\nL'Éternel est élevé : il voit les humbles, et il reconnaît de loin les orgueilleux.\n\nQuand je marche au milieu de la détresse, tu me rends la vie, tu étends ta main sur la colère de mes ennemis, et ta droite me sauve.\n\nL'Éternel agira en ma faveur. Éternel, ta bonté dure toujours, n'abandonne pas les œuvres de tes mains !\n", "139": "Psaume 139.\n\nAu chef des chantres. De David. Psaume. Éternel ! tu me sondes et tu me connais,\n\ntu sais quand je m'assieds et quand je me lève, tu pénètres de loin ma pensée ;\n\ntu sais quand je marche et quand je me couche, et tu pénètres toutes mes voies.\n\nCar la parole n'est pas sur ma langue, que déjà, ô Éternel ! tu la connais entièrement.\n\nTu m'entoures par derrière et par devant, et tu mets ta main sur moi.\n\nUne science aussi merveilleuse est au-dessus de ma portée, elle est trop élevée pour que je puisse la saisir.\n\nOù irais-je loin de ton esprit, et où fuirais-je loin de ta face ?\n\nSi je monte aux cieux, tu y es ; si je me couche au séjour des morts, t'y voilà.\n\nSi je prends les ailes de l'aurore, et que j'aille habiter à l'extrémité de la mer,\n\nlà aussi ta main me conduira, et ta droite me saisira.\n\nSi je dis : Au moins les ténèbres me couvriront, la nuit devient lumière autour de moi ;\n\nmême les ténèbres ne sont pas obscures pour toi, la nuit brille comme le jour, et les ténèbres comme la lumière.\n\nC'est toi qui as formé mes reins, qui m'as tissé dans le sein de ma mère.\n\nJe te loue de ce que je suis une créature si merveilleuse. Tes œuvres sont admirables, et mon âme le reconnaît bien.\n\nMon corps n'était point caché devant toi, lorsque j'ai été fait dans un lieu secret, tissé dans les profondeurs de la terre.\n\nQuand je n'étais qu'une masse informe, tes yeux me voyaient ; et sur ton livre étaient tous inscrits les jours qui m'étaient destinés, avant qu'aucun d'eux existât.\n\nQue tes pensées, ô Dieu, me semblent impénétrables ! Que le nombre en est grand !\n\nSi je les compte, elles sont plus nombreuses que les grains de sable. Je m'éveille, et je suis encore avec toi.\n\nÔ Dieu, puisses-tu faire mourir le méchant ! Hommes de sang, éloignez-vous de moi !\n\nIls parlent de toi d'une manière criminelle, ils prennent ton nom pour mentir, eux, tes ennemis !\n\nÉternel, n'aurais-je pas de la haine pour ceux qui te haïssent, du dégoût pour ceux qui s'élèvent contre toi ?\n\nJe les hais d'une parfaite haine ; ils sont pour moi des ennemis.\n\nSonde-moi, ô Dieu, et connais mon cœur ! Éprouve-moi, et connais mes pensées !\n\nRegarde si je suis sur une mauvaise voie, et conduis-moi sur la voie de l'éternité !\n", "140": "Psaume 140.\n\nAu chef des chantres. Psaume de David. Éternel, délivre-moi des hommes méchants ! Préserve-moi des hommes violents.\n\nQui méditent de mauvais desseins dans leur cœur, et sont toujours prêts à faire la guerre !\n\nIls aiguisent leur langue comme un serpent, ils ont sous leurs lèvres un venin d'aspic.\n\nÉternel, garantis-moi des mains du méchant ! Préserve-moi des hommes violents, qui méditent de me faire tomber !\n\nDes orgueilleux me tendent un piège et des filets, ils placent des rets le long du chemin, ils me dressent des embûches.\n\nJe dis à l'Éternel : tu es mon Dieu ! Éternel, prête l'oreille à la voix de mes supplications !\n\nÉternel, Seigneur, force de mon salut ! Tu couvres ma tête au jour du combat.\n\nÉternel, n'accomplis pas les désirs du méchant, ne laisse pas réussir ses projets, de peur qu'il ne s'en glorifie !\n\nQue sur la tête de ceux qui m'environnent retombe l'iniquité de leurs lèvres !\n\nQue des charbons ardents soient jetés sur eux ! Qu'il les précipite dans le feu, dans des abîmes, d'où ils ne se relèvent plus !\n\nL'homme dont la langue est fausse ne s'affermit pas sur la terre ; et l'homme violent, le malheur l'entraîne à sa perte.\n\nJe sais que l'Éternel fait droit au misérable, justice aux indigents.\n\nOui, les justes célébreront ton nom, les hommes droits habiteront devant ta face.\n", "141": "Psaume 141.\n\nPsaume de David. Éternel, je t'invoque : viens en hâte auprès de moi ! Prête l'oreille à ma voix, quand je t'invoque !\n\nQue ma prière soit devant ta face comme l'encens, et l'élévation de mes mains comme l'offrande du soir !\n\nÉternel, mets une garde à ma bouche, veille sur la porte de mes lèvres !\n\nN'entraîne pas mon cœur à des choses mauvaises, à des actions coupables avec les hommes qui font le mal, et que je ne prenne aucune part à leurs festins !\n\nQue le juste me frappe, c'est une faveur ; qu'il me châtie, c'est de l'huile sur ma tête : ma tête ne se détournera pas ; mais de nouveau ma prière s'élèvera contre leur méchanceté.\n\nQue leurs juges soient précipités le long des rochers, et l'on écoutera mes paroles, car elles sont agréables.\n\nComme quand on laboure et qu'on fend la terre, ainsi nos os sont dispersés à l'entrée du séjour des morts.\n\nC'est vers toi, Éternel, Seigneur ! que se tournent mes yeux, c'est auprès de toi que je cherche un refuge : n'abandonne pas mon âme !\n\nGarantis-moi du piège qu'ils me tendent, et des embûches de ceux qui font le mal !\n\nQue les méchants tombent dans leurs filets, et que j'échappe en même temps !\n", "142": "Psaume 142.\n\nCantique de David. Lorsqu'il était dans la caverne. Prière. De ma voix je crie à l'Éternel, de ma voix j'implore l'Éternel.\n\nJe répands ma plainte devant lui, je lui raconte ma détresse.\n\nQuand mon esprit est abattu au dedans de moi, toi, tu connais mon sentier. Sur la route où je marche ils m'ont tendu un piège.\n\nJette les yeux à droite, et regarde ! Personne ne me reconnaît, tout refuge est perdu pour moi, nul ne prend souci de mon âme.\n\nÉternel ! c'est à toi que je crie. Je dis : Tu es mon refuge, mon partage sur la terre des vivants.\n\nSois attentif à mes cris ! Car je suis bien malheureux. Délivre-moi de ceux qui me poursuivent ! Car ils sont plus forts que moi.\n\nTire mon âme de sa prison, afin que je célèbre ton nom ! Les justes viendront m'entourer, quand tu m'auras fait du bien.\n", "143": "Psaume 143.\n\nPsaume de David. Éternel, écoute ma prière, prête l'oreille à mes supplications ! Exauce-moi dans ta fidélité, dans ta justice !\n\nN'entre pas en jugement avec ton serviteur ! Car aucun vivant n'est juste devant toi.\n\nL'ennemi poursuit mon âme, il foule à terre ma vie ; il me fait habiter dans les ténèbres, comme ceux qui sont morts depuis longtemps.\n\nMon esprit est abattu au dedans de moi, mon cœur est troublé dans mon sein.\n\nJe me souviens des jours d'autrefois, je médite sur toutes tes œuvres, je réfléchis sur l'ouvrage de tes mains.\n\nJ'étends mes mains vers toi ; mon âme soupire après toi, comme une terre desséchée.\n\nHâte-toi de m'exaucer, ô Éternel ! Mon esprit se consume. Ne me cache pas ta face ! Je serais semblable à ceux qui descendent dans la fosse.\n\nFais-moi dès le matin entendre ta bonté ! Car je me confie en toi. Fais-moi connaître le chemin où je dois marcher ! Car j'élève à toi mon âme.\n\nDélivre-moi de mes ennemis, ô Éternel ! Auprès de toi je cherche un refuge.\n\nEnseigne-moi à faire ta volonté ! Car tu es mon Dieu. Que ton bon esprit me conduise sur la voie droite !\n\nÀ cause de ton nom, Éternel, rends-moi la vie ! Dans ta justice, retire mon âme de la détresse !\n\nDans ta bonté, anéantis mes ennemis, et fais périr tous les oppresseurs de mon âme ! Car je suis ton serviteur.\n", "144": "Psaume 144.\n\nDe David. Béni soit l'Éternel, mon rocher, qui exerce mes mains au combat, mes doigts à la bataille,\n\nmon bienfaiteur et ma forteresse, ma haute retraite et mon libérateur, mon bouclier, celui qui est mon refuge, qui m'assujettit mon peuple !\n\nÉternel, qu'est-ce que l'homme, pour que tu le connaisses ? Le fils de l'homme, pour que tu prennes garde à lui ?\n\nL'homme est semblable à un souffle, ses jours sont comme l'ombre qui passe.\n\nÉternel, abaisse tes cieux, et descends ! Touche les montagnes, et qu'elles soient fumantes !\n\nFais briller les éclairs, et disperse mes ennemis ! Lance tes flèches, et mets-les en déroute !\n\nÉtends tes mains d'en haut ; délivre-moi et sauve-moi des grandes eaux, de la main des fils de l'étranger,\n\ndont la bouche profère la fausseté, et dont la droite est une droite mensongère.\n\nÔ Dieu ! je te chanterai un cantique nouveau, je te célébrerai sur le luth à dix cordes.\n\nToi, qui donnes le salut aux rois, qui sauvas du glaive meurtrier David, ton serviteur,\n\ndélivre-moi et sauve-moi de la main des fils de l'étranger, dont la bouche profère la fausseté, et dont la droite est une droite mensongère !...\n\nNos fils sont comme des plantes qui croissent dans leur jeunesse ; nos filles comme les colonnes sculptées qui font l'ornement des palais.\n\nNos greniers sont pleins, regorgeant de toute espèce de provisions ; nos troupeaux se multiplient par milliers, par dix milliers, dans nos campagnes ;\n\nnos génisses sont fécondes ; point de désastre, point de captivité, point de cris dans nos rues !\n\nHeureux le peuple pour qui il en est ainsi ! Heureux le peuple dont l'Éternel est le Dieu !\n", "145": "Psaume 145.\n\nLouange. De David. Je t'exalterai, ô mon Dieu, mon roi ! Et je bénirai ton nom à toujours et à perpétuité.\n\nChaque jour je te bénirai, et je célébrerai ton nom à toujours et à perpétuité.\n\nL'Éternel est grand et très digne de louange, et sa grandeur est insondable.\n\nQue chaque génération célèbre tes œuvres, et publie tes hauts faits !\n\nJe dirai la splendeur glorieuse de ta majesté ; je chanterai tes merveilles.\n\nOn parlera de ta puissance redoutable, et je raconterai ta grandeur.\n\nQu'on proclame le souvenir de ton immense bonté, et qu'on célèbre ta justice !\n\nL'Éternel est miséricordieux et compatissant, lent à la colère et plein de bonté.\n\nL'Éternel est bon envers tous, et ses compassions s'étendent sur toutes ses œuvres.\n\nToutes tes œuvres te loueront, ô Éternel ! Et tes fidèles te béniront.\n\nIls diront la gloire de ton règne, et ils proclameront ta puissance,\n\npour faire connaître aux fils de l'homme ta puissance et la splendeur glorieuse de ton règne.\n\nTon règne est un règne de tous les siècles, et ta domination subsiste dans tous les âges.\n\nL'Éternel soutient tous ceux qui tombent, et il redresse tous ceux qui sont courbés.\n\nLes yeux de tous espèrent en toi, et tu leur donnes la nourriture en son temps.\n\nTu ouvres ta main, et tu rassasies à souhait tout ce qui a vie.\n\nL'Éternel est juste dans toutes ses voies, et miséricordieux dans toutes ses œuvres.\n\nL'Éternel est près de tous ceux qui l'invoquent, de tous ceux qui l'invoquent avec sincérité ;\n\nil accomplit les désirs de ceux qui le craignent, il entend leur cri et il les sauve.\n\nL'Éternel garde tous ceux qui l'aiment, et il détruit tous les méchants.\n\nQue ma bouche publie la louange de l'Éternel, et que toute chair bénisse son saint nom, à toujours et à perpétuité !\n", "146": "Psaume 146.\n\nLouez l'Éternel ! Mon âme, loue l'Éternel !\n\nJe louerai l'Éternel tant que je vivrai, je célébrerai mon Dieu tant que j'existerai.\n\nNe vous confiez pas aux grands, aux fils de l'homme, qui ne peuvent sauver.\n\nLeur souffle s'en va, ils rentrent dans la terre, et ce même jour leurs desseins périssent.\n\nHeureux celui qui a pour secours le Dieu de Jacob, qui met son espoir en l'Éternel, son Dieu !\n\nIl a fait les cieux et la terre, la mer et tout ce qui s'y trouve. Il garde la fidélité à toujours.\n\nIl fait droit aux opprimés ; il donne du pain aux affamés ; l'Éternel délivre les captifs ;\n\nl'Éternel ouvre les yeux des aveugles ; l'Éternel redresse ceux qui sont courbés ; l'Éternel aime les justes.\n\nL'Éternel protège les étrangers, il soutient l'orphelin et la veuve, mais il renverse la voie des méchants.\n\nL'Éternel règne éternellement ; ton Dieu, ô Sion ! subsiste d'âge en âge ! Louez l'Éternel !\n", "147": "Psaume 147.\n\nLouez l'Éternel ! Car il est beau de célébrer notre Dieu, car il est doux, il est bienséant de le louer.\n\nL'Éternel rebâtit Jérusalem, il rassemble les exilés d'Israël ;\n\nil guérit ceux qui ont le cœur brisé, et il panse leurs blessures.\n\nIl compte le nombre des étoiles, il leur donne à toutes des noms.\n\nNotre Seigneur est grand, puissant par sa force, son intelligence n'a point de limite.\n\nL'Éternel soutient les malheureux, il abaisse les méchants jusqu'à terre.\n\nChantez à l'Éternel avec actions de grâces, célébrez notre Dieu avec la harpe !\n\nIl couvre les cieux de nuages, il prépare la pluie pour la terre ; il fait germer l'herbe sur les montagnes.\n\nIl donne la nourriture au bétail, aux petits du corbeau quand ils crient,\n\nce n'est pas dans la vigueur du cheval qu'il se complaît, ce n'est pas dans les jambes de l'homme qu'il met son plaisir ;\n\nl'Éternel aime ceux qui le craignent, ceux qui espèrent en sa bonté.\n\nJérusalem, célèbre l'Éternel ! Sion, loue ton Dieu !\n\nCar il affermit les barres de tes portes, il bénit tes fils au milieu de toi ;\n\nil rend la paix à ton territoire, il te rassasie du meilleur froment.\n\nIl envoie ses ordres sur la terre : sa parole court avec vitesse\n\nil donne la neige comme de la laine, il répand la gelée blanche comme de la cendre ;\n\nil lance sa glace
