par morceaux ; qui peut résister devant son froid ?\n\nIl envoie sa parole, et il les fond ; il fait souffler son vent, et les eaux coulent.\n\nIl révèle sa parole à Jacob, ses lois et ses ordonnances à Israël ;\n\nil n'a pas agi de même pour toutes les nations, et elles ne connaissent point ses ordonnances. Louez l'Éternel !\n", "148": "Psaume 148.\n\nLouez l'Éternel ! Louez l'Éternel du haut des cieux ! Louez-le dans les lieux élevés !\n\nLouez-le, vous tous ses anges ! Louez-le, vous toutes ses armées !\n\nLouez-le, soleil et lune ! Louez-le, vous toutes, étoiles lumineuses !\n\nLouez-le, cieux des cieux, et vous, eaux qui êtes au-dessus des cieux !\n\nQu'ils louent le nom de l'Éternel ! Car il a commandé, et ils ont été créés.\n\nIl les a affermis pour toujours et à perpétuité ; il a donné des lois, et il ne les violera point.\n\nLouez l'Éternel du bas de la terre, monstres marins, et vous tous, abîmes,\n\nfeu et grêle, neige et brouillards, vents impétueux, qui exécutez ses ordres,\n\nmontagnes et toutes les collines, arbres fruitiers et tous les cèdres,\n\nanimaux et tout le bétail, reptiles et oiseaux ailés,\n\nrois de la terre et tous les peuples, princes et tous les juges de la terre,\n\njeunes hommes et jeunes filles, vieillards et enfants !\n\nQu'ils louent le nom de l'Éternel ! Car son nom seul est élevé ; sa majesté est au-dessus de la terre et des cieux.\n\nIl a relevé la force de son peuple : sujet de louange pour tous ses fidèles, pour les enfants d'Israël, du peuple qui est près de lui. Louez l'Éternel !\n", "149": "Psaume 149.\n\nLouez l'Éternel ! Chantez à l'Éternel un cantique nouveau ! Chantez ses louanges dans l'assemblée des fidèles !\n\nQu'Israël se réjouisse en celui qui l'a créé ! Que les fils de Sion soient dans l'allégresse à cause de leur roi !\n\nQu'ils louent son nom avec des danses, qu'ils le célèbrent avec le tambourin et la harpe !\n\nCar l'Éternel prend plaisir à son peuple, il glorifie les malheureux en les sauvant.\n\nQue les fidèles triomphent dans la gloire, qu'ils poussent des cris de joie sur leur couche !\n\nQue les louanges de Dieu soient dans leur bouche, et le glaive à deux tranchants dans leur main,\n\npour exercer la vengeance sur les nations, pour châtier les peuples,\n\npour lier leurs rois avec des chaînes et leurs grands avec des ceps de fer,\n\npour exécuter contre eux le jugement qui est écrit ! C'est une gloire pour tous ses fidèles. Louez l'Éternel !\n", "150": "Psaume 150.\n\nLouez l'Éternel ! Louez Dieu dans son sanctuaire ! Louez-le dans l'étendue, où éclate sa puissance !\n\nLouez-le pour ses hauts faits ! Louez-le selon l'immensité de sa grandeur !\n\nLouez-le au son de la trompette ! Louez-le avec le luth et la harpe !\n\nLouez-le avec le tambourin et avec des danses ! Louez-le avec les instruments à cordes et le chalumeau !\n\nLouez-le avec les cymbales sonores ! Louez-le avec les cymbales retentissantes !\n\nQue tout ce qui respire loue l'Éternel ! Louez l'Éternel !\n"};
const AUDIO="Psaumes/Psaume_";
const AUDIOM="PsaumesMusique/Psaume_";
let music=true;
function setMode(m){music=m;show(cur,false)}
const grid=document.getElementById('grid'),panel=document.getElementById('panel'),q=document.getElementById('q');
let cur=1;
function pad(n){return String(n).padStart(3,'0')}
function buildGrid(list){grid.innerHTML='';list.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className=n===cur?'on':'';b.onclick=()=>show(n,true);grid.appendChild(b)})}
function show(n,scroll){cur=n;location.hash='psaume-'+n;
 const lines=P[n].split(/\n\s*\n/).filter(x=>x.trim());
 const title=lines.shift();
 const src=(music?AUDIOM:AUDIO)+pad(n)+'.mp3';
 panel.innerHTML='<h2>Psaume '+n+'</h2><div class="row"><button class="'+(music?'on':'')+'" onclick="setMode(true)">🎵 Avec musique</button><button class="'+(!music?'on':'')+'" onclick="setMode(false)">🎙 Voix seule</button></div><audio controls preload="none" src="'+src+'" onerror="this.outerHTML=\'<div class=noaudio>Audio bientôt disponible.</div>\'"></audio>'+
 '<div class="row"><a href="'+src+'" download>⬇ Télécharger l\'audio</a>'+(n>1?'<button onclick="show('+(n-1)+',true)">← Précédent</button>':'')+(n<150?'<button onclick="show('+(n+1)+',true)">Suivant →</button>':'')+'</div>'+
 '<div class="txt">'+lines.map(l=>'<p>'+l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</p>').join('')+'</div>';
 filter();if(scroll)panel.scrollIntoView({behavior:'smooth'})}
function filter(){const t=q.value.trim().toLowerCase();let list=[];
 for(let i=1;i<=150;i++){if(!t||(/^\d+$/.test(t)?String(i).startsWith(t):P[i].toLowerCase().includes(t)))list.push(i)}
 buildGrid(list)}
q.oninput=filter;
const m=location.hash.match(/psaume-(\d+)/);show(m&&P[+m[1]]?+m[1]:1,false);
</script></body></html>
